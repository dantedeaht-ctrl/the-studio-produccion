    await response.text();

    src.match(
      /const b="([^"]+)"/
    );


  if(!m){

    throw new Error(
      "No se encontró la versión base de The Studio."
    );

  }


  const a =
    Uint8Array.from(
      atob(m[1]),
      c=>c.charCodeAt(0)
    );


  const ds =
    new DecompressionStream("gzip");


  const t =
    await new Response(
      new Response(a)
      .body
      .pipeThrough(ds)
    ).text();


  document.open();

  document.write(t);

  document.close();


  /*
  ================================================================
  DESPUÉS DE CARGAR LA APP
  ================================================================

      DESTAJO

      --------------------------------------------------------------
      ACTUALIZACIÓN INICIAL
      --------------------------------------------------------------

      --------------------------------------------------------------
      OBSERVADOR
      --------------------------------------------------------------
      */

        !window.__TS_OBSERVER__

        window.__TS_OBSERVER__ =
          new MutationObserver(
            ()=>{

              /*
              Evitamos actualizar inmediatamente
              cientos de veces cuando la app pinta.
              */

              clearTimeout(
                window.__TS_REFRESH_TIMER__

              window.__TS_REFRESH_TIMER__ =

                    }catch{}

            }

        window.__TS_OBSERVER__.observe(
          document.body,
          {
            childList:true,
            subtree:true
          }

    }catch(e){

      console.error(

/* ================================================================
   ================================================================
   UTILIDADES
   ================================================================
   ================================================================ */


function readJSON(
  key,
  fallback
){

  try{

    const value =
      localStorage.getItem(key);


    if(
      value===null ||
      value===undefined ||
      value===""
    ){

      return fallback;

    }


    return JSON.parse(value);

  }catch{

    return fallback;

  }

}


function saveJSON(
  key,
  value
){

  localStorage.setItem(
    key,
    JSON.stringify(value)
  );

}


function num(value){

  const n =
    Number(value);


  return Number.isFinite(n)
    ? n
    : 0;

}


function money(value){

  return new Intl.NumberFormat(
    "es-MX",
    {
      style:"currency",
      currency:"MXN",
      minimumFractionDigits:2
    }
  ).format(
    num(value)
  );

}


function esc(value){

  return String(
    value ?? ""
  )
  .replace(
    /[&<>"']/g,
    m=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"

    }[m])
  );

}


function normalize(value){

  return String(
    value ?? ""
  )
  .normalize("NFD")
  .replace(
    /[\u0300-\u036f]/g,
    ""
  )
  .trim()
  .toLowerCase();

}


/* ================================================================
   ================================================================
   FECHAS
   ================================================================
   ================================================================ */


function localDateString(date){

  const d =
    date instanceof Date
      ? new Date(date)
      : new Date(
          String(date)+"T12:00:00"
        );


  if(
    Number.isNaN(
      d.getTime()
    )
  ){

    return "";

  }


  return [

    d.getFullYear(),

    String(
      d.getMonth()+1
    ).padStart(
      2,
      "0"
    ),

    String(
      d.getDate()
    ).padStart(
      2,
      "0"
    )

  ].join("-");

}


function todayLocal(){

  return localDateString(
    new Date()
  );

}


function mondayOf(date){

  const d =
    new Date(
      String(date)+"T12:00:00"
    );


  if(
    Number.isNaN(
      d.getTime()
    )
  ){

    return todayLocal();

  }


  const day =
    d.getDay();


  const diff =
    day===0
      ? -6
      : 1-day;


  d.setDate(
    d.getDate()+diff
  );


  return localDateString(
    d
  );

}


function addDays(
  date,
  n
){

  const d =
    new Date(
      String(date)+"T12:00:00"
    );


  d.setDate(
    d.getDate()+n
  );


  return localDateString(
    d
  );

}


function weekRange(
  reference
){

  const start =
    mondayOf(
      reference
    );


  return {

    start:start,

    end:addDays(
      start,
      5
    )

  };

}


function inWeek(
  date,
  reference
){

  const d =
    localDateString(
      date
    );


  const r =
    weekRange(
      reference
    );


  return (
    d>=r.start &&
    d<=r.end
  );

}

/* ================================================================
   ================================================================
   COSTOS
   ================================================================
   ================================================================ */


function normalizeCostObject(
  raw
){

  const result = {};


  /*
  ------------------------------------------------
  FORMATO NUEVO
  ------------------------------------------------
  */

  if(
    raw &&
    !Array.isArray(raw) &&
    typeof raw==="object"
  ){

    if(
      raw.cost &&
      typeof raw.cost==="object"
    ){

      raw =
        raw.cost;

    }

  }


  /*
  ------------------------------------------------
  OBJETO
  ------------------------------------------------
  */

  if(
    raw &&
    !Array.isArray(raw) &&
    typeof raw==="object"
  ){

    Object.keys(raw)
    .forEach(
      model=>{

        const item =
          raw[model];


        if(
          item &&
          typeof item==="object"
        ){

          result[model] = {

            pes:
              num(
                item.pes ??
                item.pespunte ??
                item.pesPunte ??
                item.costoPespunte ??
                item.costo_pespunte
              ),

            pre:
              num(
                item.pre ??
                item.preliminar ??
                item.costoPreliminar ??
                item.costo_preliminar
              ),

            min:
              num(
                item.min ??
                item.minutos
              )

          };

        }else{

          result[model] = {

            pes:
              num(item),

            pre:0,

            min:0

          };

        }

      }
    );


    return result;

  }


  /*
  ------------------------------------------------
  ARRAY ANTIGUO
  ------------------------------------------------
  */

  if(
    Array.isArray(raw)
  ){

    raw.forEach(
      item=>{

        if(!item)
          return;


        const model =
          String(
            item.modelo ??
            item.model ??
            item.nombre ??
            item.name ??
            ""
          ).trim();


        if(!model)
          return;


        result[model] = {

          pes:
            num(
              item.pes ??
              item.pespunte ??
              item.pesPunte ??
              item.costoPespunte ??
              item.costo_pespunte
            ),

          pre:
            num(
              item.pre ??
              item.preliminar ??
              item.costoPreliminar ??
              item.costo_preliminar
            ),

          min:
            num(
              item.min ??
              item.minutos
            )

        };

      }
    );

  }


  return result;

}


/* ================================================================
   ================================================================
   RECUPERACIÓN COMPLETA DE COSTOS
   ================================================================
   ================================================================ */


function migrateAllCosts(){

  try{

    const MAIN =
      "theStudioCostos_v4";


    let main =
      normalizeCostObject(
        readJSON(
          MAIN,
          null
        )
      );


    /*
    --------------------------------------------------------------
    CLAVES ANTIGUAS
    --------------------------------------------------------------
    */

    const OLD_KEYS = [

      "ts_costos_v1",

      "theStudioCostos_v1",

      "theStudioCostos_v2",

      "theStudioCostos_v3",

      "theStudioCostos",

      "costos",

      "modelos",

      "catalogoModelos",

      "catalogoCostos"

    ];


    /*
    --------------------------------------------------------------
    FUNCIÓN DE MERGE
    --------------------------------------------------------------
    */

    function mergeModel(
      model,
      incoming
    ){

      const clean =
        String(
          model ?? ""
        ).trim();


      if(!clean)
        return;


      const existingName =
        Object.keys(main)
        .find(
          x=>
            normalize(x)===
            normalize(clean)
        );


      const name =
        existingName ||
        clean;


      if(
        !main[name]
      ){

        main[name] = {

          pes:
            num(
              incoming?.pes
            ),

          pre:
            num(
              incoming?.pre
            ),

          min:
            num(
              incoming?.min
            )

        };

        return;

      }


      if(
        !num(main[name].pes) &&
        num(incoming?.pes)
      ){

        main[name].pes =
          num(
            incoming.pes
          );

      }


      if(
        !num(main[name].pre) &&
        num(incoming?.pre)
      ){

        main[name].pre =
          num(
            incoming.pre
          );

      }


      if(
        !num(main[name].min) &&
        num(incoming?.min)
      ){

        main[name].min =
          num(
            incoming.min
          );

      }

    }


    /*
    --------------------------------------------------------------
    LEER FUENTES
    --------------------------------------------------------------
    */

    function readCostSource(
      raw
    ){

      if(!raw)
        return;


      if(
        Array.isArray(raw)
      ){

        raw.forEach(
          item=>{

            if(
              !item ||
              typeof item!=="object"
            )
              return;


            const model =
              String(
                item.modelo ??
                item.model ??
                item.nombre ??
                item.name ??
                ""
              ).trim();


            if(!model)
              return;


            const pes =
              num(
                item.pes ??
                item.pespunte ??
                item.pesPunte ??
                item.costoPespunte ??
                item.costo_pespunte ??
                item.precioPespunte
              );


            const pre =
              num(
                item.pre ??
                item.preliminar ??
                item.costoPreliminar ??
                item.costo_preliminar ??
                item.precioPreliminar
              );


            const min =
              num(
                item.min ??
                item.minutos
              );


            if(
              pes===0 &&
              pre===0 &&
              min===0
            ){

              return;

            }


            mergeModel(
              model,
              {
                pes,
                pre,
                min
              }
            );

          }
        );

        return;

      }


      if(
        typeof raw!=="object"
      ){

        return;

      }


      [
        raw.costos,
        raw.modelos,
        raw.cost,
        raw.catalogo,
        raw.data
      ]
      .forEach(
        source=>{

          if(
            source &&
            source!==raw
          ){

            readCostSource(
              source
            );

          }

        }
      );


      Object.keys(raw)
      .forEach(
        key=>{

          if(
            [
              "costos",
              "modelos",
              "cost",
              "catalogo",
              "data"
            ].includes(key)
          ){

            return;

          }


          const value =
            raw[key];


          if(
            !value ||
            typeof value!=="object" ||
            Array.isArray(value)
          ){

            return;

          }


          const pes =
            num(
              value.pes ??
              value.pespunte ??
              value.pesPunte ??
              value.costoPespunte ??
              value.costo_pespunte
            );


          const pre =
            num(
              value.pre ??
              value.preliminar ??
              value.costoPreliminar ??
              value.costo_preliminar
            );


          const min =
            num(
              value.min ??
              value.minutos
            );


          if(
            pes===0 &&
            pre===0 &&
            min===0
          ){

            return;

          }


          mergeModel(
            key,
            {
              pes,
              pre,
              min
            }
          );

        }
      );

    }


    /*
    --------------------------------------------------------------
    CLAVES ANTIGUAS
    --------------------------------------------------------------
    */

    OLD_KEYS.forEach(
      key=>{

        const raw =
          readJSON(
            key,
            null
          );


        readCostSource(
          raw
        );

      }
    );


    /*
    --------------------------------------------------------------
    GUARDAR PRINCIPAL
    --------------------------------------------------------------
    */

    saveJSON(
      MAIN,
      main
    );


    /*
    --------------------------------------------------------------
    ESPEJO
    --------------------------------------------------------------
    */

    saveJSON(
      "ts_costos_v1",
      Object.keys(main)
      .map(
        model=>({

          modelo:model,

          pespunte:
            num(
              main[model].pes
            ),

          preliminar:
            num(
              main[model].pre
            ),

          min:
            num(
              main[model].min
            )

        })
      )
    );


    return main;

  }catch(e){

    console.error(
      "Error recuperando costos:",
      e
    );


    return normalizeCostObject(
      readJSON(
        "theStudioCostos_v4",
        {}
      )
    );

  }

}

/* ================================================================
   ================================================================
   FECHA DE REFERENCIA
   ================================================================
   ================================================================ */


function getReferenceDate(){

  const inputs =
    [
      ...document.querySelectorAll(
        'input[type="date"]'
      )
    ];


  for(
    const input of inputs
  ){

    const parent =
      input.parentElement;


    const text =
      normalize(
        parent?.textContent
      );


    if(
      text.includes(
        "fecha de referencia"
      )
    ){

      if(input.value)
        return input.value;

    }

  }


  for(
    const input of inputs
  ){

    if(
      input.closest(
        "#tsDestajo"
      )
    )
      continue;


    if(
      input.closest(
        "#tsJarvisPanel"
      )
    )
      continue;


    if(
      input.offsetParent!==null &&
      input.value
    ){

      return input.value;

    }

  }


  return todayLocal();

}


/* ================================================================
   ================================================================
   CÁLCULO SEMANAL
   ================================================================
   ================================================================ */


function calculateWeek(
  reference
){

  const prod =
    getProduction();


  const advances =
    getAdvances();


  const range =
    weekRange(
      reference
    );


  const programmed =
    prod.filter(
      item=>
        inWeek(
          item.fecha,
          reference
        )
    );


  const programado =
    programmed.reduce(
      (
        total,
        item
      )=>
        total+
        num(
          item.programado
        ),
      0
    );


  const empaqueRecords =
    advances.filter(
      item=>{

        const date =
          item.fecha ??
          item.fechaHora;


        if(
          !inWeek(
            date,
            reference
          )
        ){

          return false;

        }


        return normalize(
          item.siguienteProceso ??
          item.procesoNuevo ??
          item.procesoDestino ??
          item.destino ??
          ""
        ) ===
        "empaque";

      }
    );


  const empaque =
    empaqueRecords.reduce(
      (
        total,
        item
      )=>
        total+
        num(
          item.piezas ??
          item.cantidad ??
          item.qty
        ),
      0
    );


  const auditoriaRecords =
    advances.filter(
      item=>{

        const date =
          item.fecha ??
          item.fechaHora;


        if(
          !inWeek(
            date,
            reference
          )
        ){

          return false;

        }


        return normalize(
          item.siguienteProceso ??
          item.procesoNuevo ??
          item.procesoDestino ??
          item.destino ??
          ""
        ) ===
        "auditoria";

      }
    );


  const auditoria =
    auditoriaRecords.reduce(
      (
        total,
        item
      )=>
        total+
        num(
          item.piezas ??
          item.cantidad ??
          item.qty
        ),
      0
    );


  const ots =
    new Set();


  empaqueRecords.forEach(
    item=>{

      if(
        item.ot!==undefined &&
        item.ot!==null &&
        String(
          item.ot
        ).trim()
      ){

        ots.add(
          String(
            item.ot
          ).trim()
        );

      }

    }
  );


  return {

    start:
      range.start,

    end:
      range.end,

    programado,

    empaque,

    auditoria,

    otsEmpaque:
      ots.size,

    programmedRecords:
      programmed,

    empaqueRecords,

    auditoriaRecords

  };

}


/* ================================================================
   ================================================================
   NORMALIZACIÓN DE PROCESOS
   ================================================================
   ================================================================ */


function processName(
  value
){

  const x =
    normalize(
      value
    );


  if(
    x.includes("armado")
  ){

    return "armado";

  }


  if(
    x.includes("salida") &&
    x.includes("pespunte")
  ){

    return "salida pespunte";

  }


  if(
    x==="pespunte"
  ){

    return "salida pespunte";

  }


  if(
    x.includes("clasificacion")
  ){

    return "clasificacion";

  }


  if(
    x.includes("empaque")
  ){

    return "empaque";

  }


  if(
    x.includes("auditoria")
  ){

    return "auditoria";

  }


  if(
    x.includes("programado")
  ){

    return "programado";

  }


  return x;

}


function getAdvanceOrigin(
  item
){

  return processName(
    item.procesoAnterior ??
    item.procesoOrigen ??
    item.procesoActual ??
    item.origen ??
    item.proceso ??
    ""
  );

}


function getAdvanceDestination(
  item
){

  return processName(
    item.siguienteProceso ??
    item.procesoNuevo ??
    item.procesoDestino ??
    item.destino ??
    ""
  );

}


function getAdvancePieces(
  item
){

  return num(
    item.piezas ??
    item.cantidad ??
    item.qty ??
    item.piece ??
    item.pieces
  );

}


function getItemLine(
  item
){

  const raw =
    item.linea ??
    item.line ??
    item.lineaProduccion ??
    item.lineProduction ??
    "";


  const n =
    normalize(
      raw
    );


  if(
    n.includes("b")
  ){

    return "Línea B";

  }


  if(
    n.includes("a")
  ){

    return "Línea A";

  }


  return String(
    raw || ""
  );

}


/* ================================================================
   ================================================================
   CÁLCULO DIARIO POR LÍNEA
   ================================================================
   ================================================================ */


function calculateDayLine(
  date,
  line
){

  const prod =
    getProduction();


  const advances =
    getAdvances();


  const programmed =
    prod.filter(
      item=>{

        if(
          localDateString(
            item.fecha
          )!==date
        ){

          return false;

        }


        const itemLine =
          getItemLine(
            item
          );


        if(
          itemLine &&
          itemLine!==line
        ){

          return false;

        }


        return true;

      }
    );


  const programado =
    programmed.reduce(
      (
        total,
        item
      )=>
        total+
        num(
          item.programado
        ),
      0
    );


  const dailyAdvances =
    advances.filter(
      item=>{

        const itemDate =
          localDateString(
            item.fecha ??
            item.fechaHora
          );


        if(
          itemDate!==date
        ){

          return false;

        }


        const itemLine =
          getItemLine(
            item
          );


        if(
          itemLine &&
          itemLine!==line
        ){

          return false;

        }


        return true;

      }
    );


  /*
  --------------------------------------------------------------
  EMPAQUE DEL DÍA
  --------------------------------------------------------------
  */

  const empaque =
    dailyAdvances
    .filter(
      item=>
        getAdvanceDestination(
          item
        )===
        "empaque"
    )
    .reduce(
      (
        total,
        item
      )=>
        total+
        getAdvancePieces(
          item
        ),
      0
    );


  /*
  --------------------------------------------------------------
  CLASIFICACIÓN
  --------------------------------------------------------------
  */

  const clasificacion =
    dailyAdvances
    .filter(
      item=>
        getAdvanceDestination(
          item
        )===
        "clasificacion"
    )
    .reduce(
      (
        total,
        item
      )=>
        total+
        getAdvancePieces(
          item
        ),
      0
    );


  /*
  --------------------------------------------------------------
  ARMADO
  --------------------------------------------------------------
  */

  const armado =
    dailyAdvances
    .filter(
      item=>
        getAdvanceDestination(
          item
        )===
        "armado"
    )
    .reduce(
      (
        total,
        item
      )=>
        total+
        getAdvancePieces(
          item
        ),
      0
    );


  /*
  --------------------------------------------------------------
  SALIDA PESpunte
  --------------------------------------------------------------
  */

  const salidaPespunte =
    dailyAdvances
    .filter(
      item=>
        getAdvanceDestination(
          item
        )===
        "salida pespunte"
    )
    .reduce(
      (
        total,
        item
      )=>
        total+
        getAdvancePieces(
          item
        ),
      0
    );


  /*
  --------------------------------------------------------------
  EN PROCESO
  ARMADO + SALIDA PESpunte
  --------------------------------------------------------------
  */

  const enProceso =
    armado+
    salidaPespunte;


  /*
  --------------------------------------------------------------
  EFICIENCIA
  --------------------------------------------------------------
  */

  const eficiencia =
    programado>0

      ?

      (
        empaque/
        programado
      )*100

      :

      0;


  return {

    date,

    line,

    programado,

    armado,

    salidaPespunte,

    enProceso,

    clasificacion,

    empaque,

    eficiencia,

    programmedRecords:
      programmed

  };

}

/* ================================================================
   ================================================================
   ENCONTRAR TEXTO
   ================================================================
   ================================================================ */


function findTextElement(
  phrases
){

  const wanted =
    phrases.map(
      normalize
    );


  const elements =
    [
      ...document.querySelectorAll(
        "body *"
      )
    ];


  return elements.find(
    el=>{

      if(
        el.children.length>0
      ){

        return false;

      }


      if(
        !el.offsetParent
      ){

        return false;

      }


      const text =
        normalize(
          el.textContent
        );


      return wanted.some(
        x=>
          text===x ||
          text.includes(x)
      );

    }
  );

}

    );

  const date =
    getReferenceDate();


  const A =
    calculateDayLine(
      date,
      "Línea A"
    );


  const B =
    calculateDayLine(
      date,
      "Línea B"
    );


  const week =
    calculateWeek(
      date
    );


  const efficiency =
    week.programado>0

      ?

      (

        week.programado

/* ================================================================

   ================================================================
   ================================================================ */


function formatDateLong(
  date
){

  try{

    const d =
      new Date(
        String(date)+"T12:00:00"
      );


    return new Intl.DateTimeFormat(
      "es-MX",
      {
        weekday:"long",
        day:"2-digit",
        month:"short",
        year:"numeric"
      }
    ).format(
      d
    );

  }catch{

    return date;

  }

}

   ================================================================
   ================================================================ */


function openProgrammedOTs(
  date
){

  const prod =
    getProduction();


  const records =
    prod.filter(
      item=>
        localDateString(
          item.fecha
        )===date
    );


  const modal =
    document.getElementById(
      "tsBoardModal"
    );


  const shade =
    document.getElementById(
      "tsBoardShade"
    );


  const title =
    document.getElementById(
      "tsBoardModalTitle"
    );


  const body =
    document.getElementById(
      "tsBoardModalBody"
    );


  if(!modal || !shade || !body)
    return;


  if(title){

    title.textContent =
      "OTs programadas · "+
      formatDateLong(
        date
      );

  }


  if(
    !records.length
  ){

    body.innerHTML = `

      <div
        style="
          padding:30px 16px;
          text-align:center;
          color:#6e9aab;
        "
      >

        No hay OTs programadas
        para este día.

      </div>

    `;

  }else{

    body.innerHTML =
      records
      .map(
        item=>{

          const line =
            getItemLine(
              item
            ) ||
            "Sin línea";


          const ot =
            item.ot ??
            item.OT ??
            item.numeroOT ??
            item.folio ??
            "—";


          const model =
            item.modelo ??
            item.model ??
            item.nombreModelo ??
            "";


          const pieces =
            num(
              item.programado
            );


          return `

            <div class="tsOTRow">

              <div class="tsOTTop">

                <span class="tsOT">
                  OT ${esc(ot)}
                </span>

                <span
                  class="tsOTPieces"
                >
                  ${formatNumber(
                    pieces
                  )} piezas
                </span>

              </div>


              <div class="tsOTMeta">

                ${esc(line)}

                ${
                  model
                    ? " · Modelo: "+
                      esc(model)
                    : ""
                }

              </div>

            </div>

          `;

        }
      )
      .join("");

  }


  shade.style.display =
    "block";


  modal.style.display =
    "block";

}


/* ================================================================
   ================================================================
   OTs EN PROCESO
   ================================================================
   ================================================================ */


function openProcessOTs(
  date
){

  const advances =
    getAdvances();


  const records =
    advances.filter(
      item=>{

        const itemDate =
          localDateString(
            item.fecha ??
            item.fechaHora
          );


        if(
          itemDate!==date
        ){

          return false;

        }


        const destination =
          getAdvanceDestination(
            item
          );


        return (
          destination===
            "armado" ||
          destination===
            "salida pespunte"
        );

      }
    );


  const modal =
    document.getElementById(
      "tsBoardModal"
    );


  const shade =
    document.getElementById(
      "tsBoardShade"
    );


  const title =
    document.getElementById(
      "tsBoardModalTitle"
    );


  const body =
    document.getElementById(
      "tsBoardModalBody"
    );


  if(!modal || !shade || !body)
    return;


  if(title){

    title.textContent =
      "OTs en proceso · "+
      formatDateLong(
        date
      );

  }


  if(
    !records.length
  ){

    body.innerHTML = `

      <div
        style="
          padding:30px 16px;
          text-align:center;
          color:#6e9aab;
        "
      >

        No hay movimientos de
        proceso registrados para este día.

      </div>

    `;

  }else{

    body.innerHTML =
      records
      .map(
        item=>{

          const ot =
            item.ot ??
            item.OT ??
            item.numeroOT ??
            item.folio ??
            "—";


          const destination =
            getAdvanceDestination(
              item
            );


          const pieces =
            getAdvancePieces(
              item
            );


          const line =
            getItemLine(
              item
            ) ||
            "Sin línea";


          return `

            <div class="tsOTRow">

              <div class="tsOTTop">

                <span class="tsOT">

                  OT ${esc(ot)}

                </span>


                <span
                  class="tsOTPieces"
                >

                  ${formatNumber(
                    pieces

              </div>


              <div class="tsOTMeta">

                ${esc(line)}
                ·
                ${esc(
                  destination
                )}

              </div>

            </div>

          `;

        }

      .join("");

  }


  shade.style.display =
    "block";


  modal.style.display =
    "block";

/* ================================================================
   ================================================================
   DASHBOARD ORIGINAL
   ================================================================
   ================================================================ */


function setDashboardMetric(
  label,
  value
){

  const target =
    normalize(
      label
    );


  const leaves =
    [
      ...document.querySelectorAll(
        "body *"
      )
    ]
    .filter(
      el=>
        el.children.length===0 &&
        normalize(
          el.textContent
        )===target &&
        el.offsetParent!==null
    );


  for(
    const labelEl of leaves
  ){

    let box =
      labelEl.parentElement;


    for(
      let level=0;
      level<5 &&
      box;
      level++,
      box=box.parentElement
    ){

      const candidates =
        [
          ...box.querySelectorAll(
            "strong,b,h1,h2,h3,h4,h5,.value,.number,.num,.stat-value"
          )
        ]
        .filter(
          el=>
            el!==labelEl &&
            el.offsetParent!==null &&
            /\d/.test(
              el.textContent
            )
        );


      if(
        candidates.length
      ){

        candidates.sort(
          (
            a,
            b
          )=>
            a.textContent.length-
            b.textContent.length
        );


        candidates[0].textContent =
          new Intl.NumberFormat(
            "es-MX"
          ).format(
            value
          );


        return true;

      }

    }

  }


  return false;

}


/* ================================================================
   ================================================================
   REFRESH STUDIO
   ================================================================
   ================================================================ */


function refreshStudio(){

  try{

    const reference =
      getReferenceDate();


    const data =
      calculateWeek(
        reference
      );


    setDashboardMetric(
      "Programado",
      data.programado
    );


    setDashboardMetric(
      "Empaque para nómina",
      data.empaque
    );


    setDashboardMetric(
      "Auditoría",
      data.auditoria
    );


    setDashboardMetric(
      "OTs con Empaque",
      data.otsEmpaque
    );


    installWeekListeners();


    installCostRepair();


    refreshTablero();


  }catch(e){

    console.error(
      "refreshStudio:",
      e
    );

  }

}


/* ================================================================
   ================================================================
   EVENTOS DE SEMANA
   ================================================================
   ================================================================ */


function installWeekListeners(){

  if(
    window.__TS_WEEK_LISTENERS__
  ){

    return;

  }


  window.__TS_WEEK_LISTENERS__ =
    true;


  document.addEventListener(
    "change",
    event=>{

      const el =
        event.target;


      if(
        el &&
        el.matches(
          'input[type="date"]'
        )
      ){

        setTimeout(
          ()=>{
            refreshStudio();
            refreshTablero();
          },
          100
        );

      }

    }
  );


  document.addEventListener(
    "click",
    event=>{

      const button =
        event.target.closest(
          "button"
        );


      if(!button)
        return;


      const text =
        normalize(
          button.textContent
        );


      if(
        text==="actualizar" ||
        text.includes(
          "actualizar"
        )
      ){

        setTimeout(
          ()=>{
            refreshStudio();
            refreshTablero();
          },
          150
        );

      }

    }
  );

}

function installCostRepair(){

  const costs =
    migrateAllCosts();


  const existing =
    document.getElementById(
      "tsCostRepair"
    );


  if(existing){

    renderCostRepair(
      existing,
      costs
    );

    return;

  }


  const heading =
    findTextElement(
      [
        "catalogo de modelos"
      ]
    );


  if(!heading)
    return;


  let container =
    heading.parentElement;


  for(
    let i=0;
    i<4 &&
    container &&
    container.parentElement;
    i++
  ){

    container =
      container.parentElement;

  }


  const panel =
    document.createElement(
      "section"
    );


  panel.id =
    "tsCostRepair";


  panel.style.cssText = `

    margin:18px 0;

    padding:18px;

    border:
      1px solid #104765;

    border-radius:20px;

    background:
      linear-gradient(
        145deg,
        #071521,
        #030c15
      );

    color:#eef4fb;

    box-shadow:
      0 12px 35px
      rgba(0,0,0,.30);

  `;


  container.insertBefore(
    panel,
    container.firstChild
  );


  renderCostRepair(
    panel,
    costs
  );

}

function renderCostRepair(
  panel,

            document.getElementById(
              "tsCostModel"
            );


          const pesInput =

          const preInput =
            document.getElementById(

          }


          if(pesInput){

            pesInput.value =

              );

          }


          if(preInput){

          if(modelInput){

          "tsCostModel"

      const pesInput =
        document.getElementById(
          "tsCostPes"
        );


      const preInput =
        document.getElementById(
          "tsCostPre"
        );


      const model =
        modelInput
          ?.value
          ?.trim();


      if(!model){

        alert(
          "Escribe el nombre del modelo."
        );

        return;

      }


      const pes =
        num(
          pesInput?.value
        );


      const pre =
        num(
          preInput?.value
        );


      const current =
        normalizeCostObject(
          readJSON(
            "theStudioCostos_v4",
            {}
          )
        );


      const existingName =
        Object.keys(
          current
        )
        .find(
          x=>
            normalize(x)===
            normalize(model)
        );


      let minValue =
        0;


      if(
        existingName &&
        current[existingName]
      ){

        minValue =
          num(
            current[
              existingName
            ].min
          );

      }


      /*
      Si se cambió el nombre,
      quitamos solamente el nombre anterior.
      */

      if(
        existingName &&
        existingName!==model
      ){

        delete current[
          existingName
        ];

      }


      /*
      GUARDAMOS NUEVO VALOR.
      */

      current[model] = {

        pes:pes,

        pre:pre,

        min:minValue

      };


      saveJSON(
        "theStudioCostos_v4",
        current
      );


      /*
      ESPEJO.
      */

      saveJSON(
        "ts_costos_v1",
        Object.keys(
          current
        )
        .map(
          name=>({

            modelo:name,

            pespunte:
              num(
                current[name].pes
              ),

            preliminar:
              num(
                current[name].pre
              ),

            min:
              num(
                current[name].min
              )

          })
        )
      );


      /*
      AVISAMOS A LA APP.
      */

      try{

        window.dispatchEvent(
          new StorageEvent(
            "storage",
            {
              key:
                "theStudioCostos_v4",

              newValue:
                JSON.stringify(
                  current
                ),

              storageArea:
                localStorage
            }
          )
        );

      }catch{}


      renderCostRepair(
        panel,
        current
      );


      /*
      Actualizamos también el destajo
      si está abierto.
      */

      try{

        if(
          typeof window.__TS_RENDER_DESTajo__===
          "function"
        ){

          window.__TS_RENDER_DESTajo__();

        }

      }catch{}


      alert(
        "Costo actualizado correctamente."
      );

    }
  );

}

            Date.now(),

          date:
            document
            .getElementById(
              "tsDate"
            )
            .value,

          line:
            document
            .getElementById(
              "tsLine"
            )
            .value,

          modelo:
            model.modelo,

          piezas:
            pieces,

          pares:
            pieces,

          pespunte:
            num(
              model.pespunte
            ),

          preliminar:
            num(
              model.preliminar
            )

        });


        save(
          KEYR,
          r
        );


        renderAll();

        refreshStudio();

      }
    );


    document
    .getElementById(
      "tsClear"
    )
    ?.addEventListener(
      "click",
      ()=>{

        const input =
          document.getElementById(
            "tsPairs"
          );


        if(input){

          input.value =
            "";

        }


        update();

      }
    );


    const rr =
      records()
      .slice(-12)
      .reverse();


    const recent =
      document.getElementById(
        "tsRecent"
      );


    if(!recent)
      return;


    recent.innerHTML =

      rr.length

      ?

      `

<table class="tsTable">

<tr>

  <th>
    Fecha
  </th>

  <th>
    Línea
  </th>

  <th>
    Modelo
  </th>

  <th class="tsRight">
    Piezas
  </th>

  <th class="tsRight">
    Destajo
  </th>

</tr>


${
  rr.map(
    r=>`

<tr>

  <td>
    ${esc(r.date)}
  </td>

  <td>
    ${esc(
      String(
        r.line || ""
      )
      .replace(
        "Línea ",
        ""
      )
    )}
  </td>

  <td>
    ${esc(r.modelo)}
  </td>

  <td class="tsRight">

    ${num(
      r.piezas ??
      r.pares
    )}

  </td>

  <td class="tsRight">

    ${money(
      num(
        r.piezas ??
        r.pares
      )*
      (
        num(r.pespunte)+
        num(r.preliminar)
      )
    )}

  </td>

</tr>

`
  ).join("")
}

</table>

`

      :

      `

<div
  class="tsMuted"
  style="padding:10px 0"
>

  Aún no hay registros.

</div>

`;

  }


  /* ==============================================================
     COSTOS DESTAJO
     ============================================================== */


  function renderCost(){

    const c =
      costsArray();


    document
    .getElementById(
      "tsCost"
    )
    .innerHTML = `

<div class="tsCard">

  <b>
    Catálogo de costos
  </b>


  <div class="tsMuted">

    Los costos se guardan en
    theStudioCostos_v4.

    Puedes editarlos cuando cambien.

  </div>


  <div
    class="tsGrid3"
    style="margin-top:10px"
  >

    <div class="tsField">

      <label>
        Modelo
      </label>

      <input
        id="tsNewM"
        placeholder="Verona"
      >

    </div>


    <div class="tsField">

      <label>
        Costo pespunte $
      </label>

      <input
        id="tsNewP"
        type="number"
        min="0"
        step="0.01"
        placeholder="12.50"
      >

    </div>


    <div class="tsField">

      <label>
        Costo preliminar $
      </label>

      <input
        id="tsNewR"
        type="number"
        min="0"
        step="0.01"
        placeholder="8.00"
      >

    </div>

  </div>


  <button
    class="tsBtn"
    id="tsSaveC"
    style="margin-top:10px"
  >

    Guardar / actualizar modelo

  </button>

</div>


<div class="tsCard">

${
  c.length

  ?

`

<table class="tsTable">

<tr>

  <th>
    Modelo
  </th>

  <th class="tsRight">
    Pespunte
  </th>

  <th class="tsRight">
    Preliminar
  </th>

  <th>
    Acción
  </th>

</tr>


${
  c.map(
    x=>`

<tr>

  <td>
    ${esc(x.modelo)}
  </td>

  <td class="tsRight">
    ${money(
      x.pespunte
    )}
  </td>

  <td class="tsRight">
    ${money(
      x.preliminar
    )}
  </td>

  <td>

    <button
      class="tsBtn alt tsDestEdit"
      data-model="${esc(x.modelo)}"
      title="Editar"
    >
      ✏️
    </button>

  </td>

</tr>

`
  ).join("")
}

</table>

`

  :

`

<div class="tsMuted">

  No hay modelos capturados.

</div>

`

}

</div>

`;


    document
    .getElementById(
      "tsSaveC"
    )
    ?.addEventListener(
      "click",
      ()=>{

        const model =
          document
          .getElementById(
            "tsNewM"
          )
          .value
          .trim();


        if(!model){

          alert(
            "Escribe el modelo."
          );

          return;

        }


        const p =
          num(
            document
            .getElementById(
              "tsNewP"
            )
            .value
          );


        const r =
          num(
            document
            .getElementById(
              "tsNewR"
            )
            .value
          );


        const arr =
          normalizeCostObject(
            readJSON(
              KEYC,
              {}
            )
          );


        const existing =
          Object.keys(
            arr
          )
          .find(
            x=>
              normalize(x)===
              normalize(model)
          );


        let min =
          0;


        if(
          existing &&
          arr[existing]
        ){

          min =
            num(
              arr[existing].min
            );

        }


        if(
          existing &&
          existing!==model
        ){

          delete arr[
            existing
          ];

        }


        arr[model] = {

          pes:p,

          pre:r,

          min:min

        };


        saveJSON(
          KEYC,
          arr
        );


        saveJSON(
          "ts_costos_v1",
          Object.keys(arr)
          .map(
            x=>({

              modelo:x,

              pespunte:
                num(
                  arr[x].pes
                ),

              preliminar:
                num(
                  arr[x].pre
                ),

              min:
                num(
                  arr[x].min
                )

            })
          )
        );


        renderAll();


        setTimeout(
          ()=>{
            installCostRepair();
            refreshTablero();
          },
          80
        );

      }
    );


    document
    .querySelectorAll(
      ".tsDestEdit"
    )
    .forEach(
      button=>{

        button.onclick=()=>{

          const model =
            button.dataset.model;


          const item =
            c.find(
              x=>
                x.modelo===
                model
            );


          if(!item)
            return;


          document
          .getElementById(
            "tsNewM"
          )
          .value =
            item.modelo;


          document
          .getElementById(
            "tsNewP"
          )
          .value =
            num(
              item.pespunte
            );


          document
          .getElementById(
            "tsNewR"
          )
          .value =
            num(
              item.preliminar
            );


          document
          .getElementById(
            "tsNewM"
          )
          .focus();

        };

      }
    );

  }


  /* ==============================================================
     RESUMEN
     ============================================================== */


  function renderRes(){

    const start =
      mondayOf(
        todayLocal()
      );


    const end =
      addDays(
        start,
        5
      );


    const rr =
      records()
      .filter(
        r=>
          r.date>=start &&
          r.date<=end
      );


    const sum =
      arr=>
        arr.reduce(
          (
            a,
            r
          )=>
            a+
            num(
              r.piezas ??
              r.pares
            ),
          0
        );


    const calc =
      (
        arr,
        key
      )=>
        arr.reduce(
          (
            a,
            r
          )=>
            a+
            num(
              r.piezas ??
              r.pares
            )*
            num(
              r[key]
            ),
          0
        );


    const A =
      rr.filter(
        r=>
          r.line===
          "Línea A"
      );


    const B =
      rr.filter(
        r=>
          r.line===
          "Línea B"
      );


    const pA =
      calc(
        A,
        "pespunte"
      );


    const pB =
      calc(
        B,
        "pespunte"
      );


    const rA =
      calc(
        A,
        "preliminar"
      );


    const rB =
      calc(
        B,
        "preliminar"
      );


    const total =
      pA+
      pB+
      rA+
      rB;


    document
    .getElementById(
      "tsRes"
    )
    .innerHTML = `

<div class="tsCard">

  <b>
    Semana de nómina
  </b>


  <div class="tsMuted">

    ${start}
    →
    ${end}

    · cierre el sábado

  </div>


  <div
    class="tsKpis"
    style="margin-top:10px"
  >

    <div class="tsKpi">

      <small>
        Línea A · destajo
      </small>

      <div class="tsMoney">

        ${money(
          pA+rA
        )}

      </div>

    </div>


    <div class="tsKpi">

      <small>
        Línea B · destajo
      </small>

      <div class="tsMoney">

        ${money(
          pB+rB
        )}

      </div>

    </div>


    <div class="tsKpi">

      <small>
        Acumulado semanal
      </small>

      <div class="tsMoney">

        ${money(
          total
        )}

      </div>

    </div>

  </div>

</div>


<div class="tsCard">

  <b>
    Desglose por línea
  </b>


  <div class="tsLine">

    <span>

      Línea A ·
      ${sum(A)}
      piezas

    </span>


    <span>

      <b>
        Pespunte
        ${money(pA)}
      </b>

      · Preliminar
      ${money(rA)}

    </span>

  </div>


  <div class="tsLine">

    <span>

      Línea B ·
      ${sum(B)}
      piezas

    </span>


    <span>

      <b>
        Pespunte
        ${money(pB)}
      </b>

      · Preliminar
      ${money(rB)}

    </span>

  </div>


  <div class="tsLine">

    <span>

      <b>
        Total
      </b>

    </span>


    <span>

      <b>
        ${money(total)}
      </b>

    </span>

  </div>

</div>


<div class="tsCard">

  <b>
    Cerrar semana
  </b>


  <div class="tsMuted">

    El cierre guarda el total
    de lunes a sábado.

    Los registros no se borran.

  </div>


  <button
    class="tsBtn good"
    id="tsCloseWeek"
    style="margin-top:10px"
  >

    Cerrar semana y guardar histórico

  </button>

</div>


<div class="tsCard">

  <b>
    Histórico de cierres
  </b>


  <div id="tsHistory">
  </div>

</div>

`;


    document
    .getElementById(
      "tsCloseWeek"
    )
    ?.addEventListener(
      "click",
      ()=>{

        const h =
          closes();


        if(
          h.some(
            x=>
              x.week===
              start
          )
        ){

          alert(
            "Esta semana ya está cerrada."
          );

          return;

        }


        h.unshift({

          week:start,

          end:end,

          total:total,

          pespunte:
            pA+pB,

          preliminar:
            rA+rB,

          lineA:
            pA+rA,

          lineB:
            pB+rB,

          closedAt:
            new Date()
            .toISOString()

        });


        save(
          KEYW,
          h
        );


        renderRes();

      }
    );


    const h =
      closes();


    document
    .getElementById(
      "tsHistory"
    )
    .innerHTML =

      h.length

      ?

`

<table class="tsTable">

<tr>

  <th>
    Semana
  </th>

  <th>
    A
  </th>

  <th>
    B
  </th>

  <th class="tsRight">
    Total
  </th>

</tr>


${
  h.map(
    x=>`

<tr>

  <td>
    ${esc(x.week)}
  </td>

  <td>
    ${money(x.lineA)}
  </td>

  <td>
    ${money(x.lineB)}
  </td>

  <td class="tsRight">

    <b>
      ${money(x.total)}
    </b>

  </td>

</tr>

`
  ).join("")
}

</table>

`

      :

`

<div
  class="tsMuted"
  style="padding-top:8px"
>

  No hay semanas cerradas todavía.

</div>

`;

  }


  function renderAll(){

    renderCap();

    renderCost();

    renderRes();


    window.__TS_RENDER_DESTajo__ =
      renderAll;

  }


  panel.style.display =
    "none";


  window.__TS_RENDER_DESTajo__ =
    renderAll;

}

   FIN

</script>
