    "https://raw.githubusercontent.com/dantedeaht-ctrl/the-studio-produccion/f07dc9e5221a9b207d205d143d68c0b917ee0e0e/index.html";

  const response =
    await fetch(
      ORIGINAL_URL,
      {
        cache:"no-store"
      }
    );

  const src =
    await response.text();

  const m =
    src.match(
      /const b="([^"]+)"/
    );

  if(!m){

    throw new Error(
      "No se encontró la versión base de The Studio"
    );

  }

  const a =
    Uint8Array.from(
      atob(m[1]),
      c=>c.charCodeAt(0)
    );

  const ds =
    new DecompressionStream("gzip");

  const t =
    await new Response(
      new Response(a)
      .body
      .pipeThrough(ds)
    ).text();

  document.open();

  document.write(t);

  document.close();

  /*
  ================================================================
  DESPUÉS DE CARGAR LA APP
  ================================================================
  */

  setTimeout(()=>{

    try{

      migrateAllCosts();

      fixResponsive();

      installBMWTheme();

      installJARVISTheme();

      installCostRepair();

      installWeekRepair();

      installDestajo();

      installLineEfficiency();

      refreshStudio();

      if(
        !window.__TS_OBSERVER__

        window.__TS_OBSERVER__ =
          new MutationObserver(
            ()=>{
              try{
                refreshStudio();
                installLineEfficiency();
              }catch{}
            }
          );

        window.__TS_OBSERVER__.observe(
          document.body,
          {
            childList:true,
            subtree:true
          }
        );

      }

    }catch(e){

      console.error(
        "The Studio patch:",
        e

}

/* ================================================================
   UTILIDADES
   ================================================================ */

function readJSON(key,fallback){

  try{

    const value =
      localStorage.getItem(key);

    if(
      value===null ||
      value===undefined ||
      value===""
    ){

      return fallback;

    }

    return JSON.parse(value);

  }catch{

    return fallback;

  }

}

function saveJSON(key,value){

  localStorage.setItem(
    key,
    JSON.stringify(value)
  );

}

function num(value){

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : 0;

}

function money(value){

  return new Intl.NumberFormat(
    "es-MX",
    {
      style:"currency",
      currency:"MXN",
      minimumFractionDigits:2
    }
  ).format(
    num(value)
  );

}

function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      m=>({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      }[m])
    );

}

function normalize(value){

  return String(
    value ?? ""
  )
  .normalize("NFD")
  .replace(
    /[\u0300-\u036f]/g,
    ""
  )
  .trim()
  .toLowerCase();

}

/* ================================================================
   FECHAS
   ================================================================ */

function localDateString(date){

  const d =
    date instanceof Date
      ? new Date(date)
      : new Date(String(date)+"T12:00:00");

  if(
    Number.isNaN(d.getTime())
  ){

    return "";

  }

  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");

}

function todayLocal(){

  return localDateString(
    new Date()
  );

}

function mondayOf(date){

  const d =
    new Date(
      String(date)+"T12:00:00"
    );

  if(
    Number.isNaN(d.getTime())
  ){

    return todayLocal();

  }

  const day =
    d.getDay();

  const diff =
    day===0
      ? -6
      : 1-day;

  d.setDate(
    d.getDate()+diff
  );

  return localDateString(d);

}

function addDays(date,n){

  const d =
    new Date(
      String(date)+"T12:00:00"
    );

  d.setDate(
    d.getDate()+n
  );

  return localDateString(d);

}

function weekRange(reference){

  const start =
    mondayOf(reference);

  return {

    start:start,

    end:addDays(start,5)

  };

}

function inWeek(date,reference){

  const d =
    localDateString(date);

  const r =
    weekRange(reference);

  return (
    d>=r.start &&
    d<=r.end
  );

}

/* ================================================================
   COSTOS
   ================================================================ */

function normalizeCostObject(raw){

  const result = {};

  if(
    raw &&
    !Array.isArray(raw) &&
    typeof raw==="object"
  ){

    if(
      raw.cost &&
      typeof raw.cost==="object"
    ){

      raw =
        raw.cost;

    }

  }

  if(
    raw &&
    !Array.isArray(raw) &&
    typeof raw==="object"
  ){

    Object.keys(raw)
    .forEach(model=>{

      const item =
        raw[model];

      if(
        item &&
        typeof item==="object"
      ){

        result[model] = {

          pes:
            num(
              item.pes ??
              item.pespunte ??
              item.pesPunte ??
              item.costoPespunte
            ),

          pre:
            num(
              item.pre ??
              item.preliminar ??
              item.costoPreliminar
            ),

          min:
            num(
              item.min ??
              item.minutos ??
              item.tiempoEstandar ??
              item.tiempo ??
              item.standardTime
            )

        };

      }else{

        result[model] = {

          pes:num(item),

          pre:0,

          min:0

        };

      }

    });

    return result;

  }

  if(
    Array.isArray(raw)
  ){

    raw.forEach(item=>{

      if(!item)
        return;

      const model =
        String(
          item.modelo ??
          item.model ??
          item.nombre ??
          item.name ??
          ""
        ).trim();

      if(!model)
        return;

      result[model] = {

        pes:
          num(
            item.pes ??
            item.pespunte ??
            item.pesPunte ??
            item.costoPespunte
          ),

        pre:
          num(
            item.pre ??
            item.preliminar ??
            item.costoPreliminar
          ),

        min:
          num(
            item.min ??
            item.minutos ??
            item.tiempoEstandar ??
            item.tiempo ??
            item.standardTime
          )

      };

    });

  }

  return result;

}

/* ================================================================
   RECUPERACIÓN COMPLETA DE COSTOS
   ================================================================ */

function migrateAllCosts(){

  try{

    const MAIN =
      "theStudioCostos_v4";

    let main =
      normalizeCostObject(
        readJSON(
          MAIN,
          null
        )
      );

    const OLD_KEYS = [

      "ts_costos_v1",

      "theStudioCostos_v1",

      "theStudioCostos_v2",

      "theStudioCostos_v3",

      "theStudioCostos",

      "costos",

      "modelos",

      "catalogoModelos",

      "catalogoCostos"

    ];

    function mergeModel(
      model,
      incoming
    ){

      const cleanModel =
        String(
          model ?? ""
        ).trim();

      if(!cleanModel)
        return;

      const existingName =
        Object.keys(main)
        .find(
          x=>
            normalize(x) ===
            normalize(cleanModel)
        );

      const name =
        existingName ||
        cleanModel;

      if(!main[name]){

        main[name] = {

          pes:
            num(
              incoming?.pes
            ),

          pre:
            num(
              incoming?.pre
            ),

          min:
            num(
              incoming?.min
            )

        };

        return;

      }

      if(
        !num(main[name].pes) &&
        num(incoming?.pes)
      ){

        main[name].pes =
          num(incoming.pes);

      }

      if(
        !num(main[name].pre) &&
        num(incoming?.pre)
      ){

        main[name].pre =
          num(incoming.pre);

      }

      if(
        !num(main[name].min) &&
        num(incoming?.min)
      ){

        main[name].min =
          num(incoming.min);

      }

    }

    function extractItem(item){

      if(
        !item ||
        typeof item!=="object"
      ){

        return null;

      }

      const model =
        String(
          item.modelo ??
          item.model ??
          item.nombre ??
          item.name ??
          ""
        ).trim();

      if(!model)
        return null;

      const pes =
        num(
          item.pes ??
          item.pespunte ??
          item.pesPunte ??
          item.costoPespunte ??
          item.costo_pespunte ??
          item.precioPespunte ??
          item.precio_pespunte ??
          item.pesCost
        );

      const pre =
        num(
          item.pre ??
          item.preliminar ??
          item.costoPreliminar ??
          item.costo_preliminar ??
          item.precioPreliminar ??
          item.precio_preliminar ??
          item.preCost
        );

      const min =
        num(
          item.min ??
          item.minutos ??
          item.tiempoEstandar ??
          item.tiempo ??
          item.standardTime
        );

      if(
        pes===0 &&
        pre===0 &&
        min===0
      ){

        return null;

      }

      return {

        model:model,

        pes:pes,

        pre:pre,

        min:min

      };

    }

    function readCostSource(raw){

      if(!raw)
        return;

      if(
        Array.isArray(raw)
      ){

        raw.forEach(
          item=>{

            const found =
              extractItem(item);

            if(found){

              mergeModel(
                found.model,
                found
              );

            }

          }
        );

        return;

      }

      if(
        typeof raw!=="object"
      ){

        return;

      }

      [
        raw.costos,
        raw.modelos,
        raw.cost,
        raw.catalogo,
        raw.data
      ]
      .forEach(
        source=>{

          if(
            source &&
            source!==raw
          ){

            readCostSource(
              source
            );

          }

        }
      );

      Object.keys(raw)
      .forEach(
        key=>{

          if(
            [
              "costos",
              "modelos",
              "cost",
              "catalogo",
              "data"
            ]
            .includes(
              key
            )
          ){

            return;

          }

          const value =
            raw[key];

          if(
            !value ||
            typeof value!=="object" ||
            Array.isArray(value)
          ){

            return;

          }

          const pes =
            num(
              value.pes ??
              value.pespunte ??
              value.pesPunte ??
              value.costoPespunte ??
              value.costo_pespunte ??
              value.precioPespunte ??
              value.precio_pespunte
            );

          const pre =
            num(
              value.pre ??
              value.preliminar ??
              value.costoPreliminar ??
              value.costo_preliminar ??
              value.precioPreliminar ??
              value.precio_preliminar
            );

          const min =
            num(
              value.min ??
              value.minutos ??
              value.tiempoEstandar ??
              value.tiempo ??
              value.standardTime
            );

          if(
            pes===0 &&
            pre===0 &&
            min===0
          ){

            return;

          }

          mergeModel(
            key,
            {
              pes:pes,
              pre:pre,
              min:min
            }
          );

        }
      );

    }

    OLD_KEYS.forEach(
      key=>{

        const raw =
          readJSON(
            key,
            null
          );

        readCostSource(
          raw
        );

      }
    );

    for(
      let i=0;
      i<localStorage.length;
      i++
    ){

      const key =
        localStorage.key(i);

      if(!key)
        continue;

      if(
        OLD_KEYS.includes(key) ||
        key===MAIN
      ){

        continue;

      }

      let raw =
        null;

      try{

        raw =
          JSON.parse(
            localStorage.getItem(key)
          );

      }catch{

        continue;

      }

      if(
        Array.isArray(raw)
      ){

        const possible =
          raw.some(
            item=>{

              if(
                !item ||
                typeof item!=="object"
              ){

                return false;

              }

              const hasModel =
                item.modelo!==undefined ||
                item.model!==undefined ||
                item.nombre!==undefined ||
                item.name!==undefined;

              const hasCost =
                item.pes!==undefined ||
                item.pespunte!==undefined ||
                item.pespunte!==undefined ||
                item.costoPespunte!==undefined ||
                item.pre!==undefined ||
                item.preliminar!==undefined ||
                item.costoPreliminar!==undefined ||
                item.min!==undefined ||
                item.minutos!==undefined ||
                item.tiempoEstandar!==undefined;

              return (
                hasModel &&
                hasCost
              );

            }
          );

        if(possible){

          readCostSource(
            raw
          );

        }

      }
      else
      if(
        raw &&
        typeof raw==="object"
      ){

        const text =
          JSON.stringify(
            raw
          ).toLowerCase();

        if(
          text.includes("pespunte") ||
          text.includes("preliminar") ||
          text.includes("costopespunte") ||
          text.includes("costopreliminar") ||
          text.includes("tiempoestandar")
        ){

          readCostSource(
            raw
          );

        }

      }

    }

    saveJSON(
      MAIN,
      main
    );

    const mirror =
      Object.keys(main)
      .map(
        model=>({

          modelo:model,

          pespunte:
            num(
              main[model].pes
            ),

          preliminar:
            num(
              main[model].pre
            ),

          min:
            num(
              main[model].min
            )

        })
      );

    saveJSON(
      "ts_costos_v1",
      mirror
    );

    return main;

  }catch(e){

    console.error(
      "Error recuperando costos:",
      e
    );

    return normalizeCostObject(
      readJSON(
        "theStudioCostos_v4",
        {}
      )
    );

  }

}

/* ================================================================
   FECHA DE REFERENCIA
   ================================================================ */

function getReferenceDate(){

  const inputs =
    [
      ...document.querySelectorAll(
        'input[type="date"]'
      )
    ];

  for(
    const input of inputs
  ){

    const parent =
      input.parentElement;

    const text =
      normalize(
        parent?.textContent
      );

    if(
      text.includes(
        "fecha de referencia"
      )
    ){

      if(input.value)
        return input.value;

    }

  }

  for(
    const input of inputs
  ){

    if(
      input.closest("#tsDestajo")
    )
      continue;

    if(
      input.offsetParent!==null &&
      input.value
    ){

      return input.value;

    }

  }

  return todayLocal();

}

/* ================================================================
   SEMANA
   ================================================================ */

function calculateWeek(reference){

  const prod =
    getProduction();

  const advances =
    getAdvances();

  const range =
    weekRange(reference);

  const programmed =
    prod.filter(
      item=>
        inWeek(
          item.fecha ??
          item.date,
          reference
        )
    );

  const programado =
    programmed.reduce(
      (total,item)=>
        total+
        num(
          item.programado ??
          item.piezasProgramadas ??
          item.cantidad ??
          item.qty
        ),
      0
    );

  const empaqueRecords =
    advances.filter(item=>{

      const date =
        item.fecha ??
        item.fechaHora ??
        item.date;

      if(
        !inWeek(
          date,
          reference
        )
      ){

        return false;

      }

      return normalize(
        item.siguienteProceso ??
        item.procesoNuevo ??
        item.procesoDestino ??
        item.destino ??
        ""
      ) ===
      "empaque";

    });

  const empaque =
    empaqueRecords.reduce(
      (total,item)=>
        total+
        num(
          item.piezas ??
          item.cantidad ??
          item.qty
        ),
      0
    );

  const auditoriaRecords =
    advances.filter(item=>{

      const date =
        item.fecha ??
        item.fechaHora ??
        item.date;

      if(
        !inWeek(
          date,
          reference
        )
      ){

        return false;

      }

      return normalize(
        item.siguienteProceso ??
        item.procesoNuevo ??
        item.procesoDestino ??
        item.destino ??
        ""
      ) ===
      "auditoria";

    });

  const auditoria =
    auditoriaRecords.reduce(
      (total,item)=>
        total+
        num(
          item.piezas ??
          item.cantidad ??
          item.qty
        ),
      0
    );

  const ots =
    new Set();

  empaqueRecords.forEach(
    item=>{

      if(
        item.ot!==undefined &&
        item.ot!==null &&
        String(item.ot).trim()
      ){

        ots.add(
          String(item.ot).trim()
        );

      }

    }
  );

  return {

    start:range.start,
    end:range.end,
    programado,
    empaque,
    auditoria,
    otsEmpaque:ots.size,
    programmedRecords:programmed,
    empaqueRecords,
    auditoriaRecords

  };

}

/* ================================================================
   DASHBOARD
   ================================================================ */

function setDashboardMetric(
  label,
  value
){

  const target =
    normalize(label);

  const leaves =
    [
      ...document.querySelectorAll(
        "body *"
      )
    ].filter(
      el=>
        el.children.length===0 &&
        normalize(el.textContent)===target &&
        el.offsetParent!==null
    );

  for(
    const labelEl of leaves
  ){

    let box =
      labelEl.parentElement;

    for(
      let level=0;
      level<5 && box;
      level++,
      box=box.parentElement
    ){

      const candidates =
        [
          ...box.querySelectorAll(
            "strong,b,h1,h2,h3,h4,h5,.value,.number,.num,.stat-value"
          )
        ]
        .filter(
          el=>
            el!==labelEl &&
            el.offsetParent!==null &&
            /\d/.test(
              el.textContent
            )
        );

      if(
        candidates.length
      ){

        candidates.sort(
          (a,b)=>
            a.textContent.length-
            b.textContent.length
        );

        candidates[0].textContent =
          new Intl.NumberFormat(
            "es-MX"
          ).format(
            value
          );

        return true;

      }

    }

  }

  return false;

}

/* ================================================================
   REFRESCAR
   ================================================================ */

function refreshStudio(){

  try{

    const reference =
      getReferenceDate();

    const data =
      calculateWeek(
        reference
      );

    setDashboardMetric(
      "Programado",
      data.programado
    );

    setDashboardMetric(
      "Empaque para nómina",
      data.empaque
    );

    setDashboardMetric(
      "Auditoría",
      data.auditoria
    );

    setDashboardMetric(
      "OTs con Empaque",
      data.otsEmpaque
    );

    installWeekListeners();

    installCostRepair();

  }catch(e){

    console.error(
      "refreshStudio:",
      e
    );

  }

}

/* ================================================================
   LISTENERS DE SEMANA
   ================================================================ */

function installWeekListeners(){

  if(
    window.__TS_WEEK_LISTENERS__
  ){

    return;

  }

  window.__TS_WEEK_LISTENERS__ =
    true;

  document.addEventListener(
    "change",
    event=>{

      const el =
        event.target;

      if(
        el.matches(
          'input[type="date"]'
        )
      ){

        setTimeout(
          refreshStudio,
          80
        );

        setTimeout(
          installLineEfficiency,
          100
        );

      }

    }
  );

  document.addEventListener(
    "click",
    event=>{

      const button =
        event.target.closest(
          "button"
        );

      if(!button)
        return;

      const text =
        normalize(
          button.textContent
        );

      if(
        text==="actualizar" ||
        text.includes(
          "actualizar"
        )
      ){

        setTimeout(
          refreshStudio,
          120
        );

        setTimeout(
          installLineEfficiency,
          150
        );

      }

    }
  );

}

/* ================================================================
   REPARACIÓN SEMANAL
   CORRECCIÓN DEL ERROR QUE FALTABA
   ================================================================ */

function installWeekRepair(){

  if(
    window.__TS_WEEK_REPAIR__
  ){

    return;

  }

  window.__TS_WEEK_REPAIR__ =
    true;

  /*
  Esta función existe para que el cargador
  no se detenga antes de Destajo y Eficiencia.
  */

  installWeekListeners();

}

/* ================================================================
   EFICIENCIA POR LÍNEA
   PROGRAMADO VS SALIDA DE PESpunte
   ================================================================ */

function getLineName(item){

  return String(
    item.linea ??
    item.line ??
    item.lineaProduccion ??
    item.lineaNombre ??
    item.Linea ??
    ""
  ).trim();

}

function sameLine(item,line){

  const a =
    normalize(
      getLineName(item)
    );

  const b =
    normalize(line);

  if(
    a===b
  ){

    return true;

  }

  if(
    b==="linea a"
  ){

    return (
      a==="a" ||
      a==="lineaa" ||
      a==="linea  a"
    );

  }

  if(
    b==="linea b"
  ){

    return (
      a==="b" ||
      a==="lineab" ||
      a==="linea  b"
    );

  }

  return false;

}

function getItemDate(item){

  return localDateString(
    item.fecha ??
    item.date ??
    item.fechaHora ??
    item.createdAt ??
    ""
  );

}

function isSalidaPespunte(item){

  const destination =
    normalize(
      item.siguienteProceso ??
      item.procesoNuevo ??
      item.procesoDestino ??
      item.destino ??
      item.hasta ??
      item.to ??
      ""
    );

  const source =
    normalize(
      item.procesoAnterior ??
      item.procesoOrigen ??
      item.proceso ??
      item.desde ??
      item.from ??
      ""
    );

  /*
  Detectamos explícitamente:
  Salida pespunte / salida de pespunte.
  */

  const salida =
    destination.includes(
      "salida pespunte"
    ) ||
    destination.includes(
      "salida de pespunte"
    ) ||
    destination==="salidapespunte" ||
    destination==="salidadepespunte";

  if(salida)
    return true;

  /*
  También aceptamos movimientos cuyo origen
  sea Pespunte y cuyo proceso siguiente sea
  Clasificación, porque en algunas versiones
  el avance puede quedar registrado así.
  */

  const origenPespunte =
    source==="pespunte" ||
    source.includes("pespunte");

  const siguienteClasificacion =
    destination==="clasificacion" ||
    destination.includes("clasificacion");

  return (
    origenPespunte &&
    siguienteClasificacion
  );

}

function getProgrammedForLine(
  date,
  line
){

  return getProduction()
    .filter(
      item=>
        getItemDate(item)===date &&
        sameLine(item,line)
    )
    .reduce(
      (total,item)=>
        total+
        num(
          item.programado ??
          item.piezasProgramadas ??
          item.cantidad ??
          item.qty ??
          item.piezas
        ),
      0
    );

}

function getSalidaPespunteForLine(
  date,
  line
){

  return getAdvances()
    .filter(
      item=>
        getItemDate(item)===date &&
        sameLine(item,line) &&
        isSalidaPespunte(item)
    )
    .reduce(
      (total,item)=>
        total+
        num(
          item.piezas ??
          item.cantidad ??
          item.qty ??
          item.pares
        ),
      0
    );

}

function lineEfficiency(
  programado,
  salida
){

  const p =
    num(programado);

  if(p<=0)
    return 0;

  return (
    num(salida) /
    p
  )*
  100;

}

                </td>

                <td>
                  ${esc(r.modelo)}
                </td>

                <td class="tsRight">
                  ${num(
                    r.piezas ??
                    r.pares
                  )}
                </td>

                <td class="tsRight">

                  ${money(
                    num(
                      r.piezas ??
                      r.pares
                    )*
                    (
                      num(r.pespunte)+
                      num(r.preliminar)
                    )
                  )}

                </td>

              </tr>

            `
          ).join("")
        }

      </table>

      `

      :

      `

      <div
        class="tsMuted"
        style="padding:10px 0"
      >

        Aún no hay registros.

      </div>

      `;

  }

  /* ==============================================================
     COSTOS DESTAJO + TIEMPO ESTÁNDAR
     ============================================================== */

  function renderCost(){

    const c =
      costsArray();

    document
    .getElementById(
      "tsCost"
    )
    .innerHTML = `

      <div class="tsCard">

        <b>
          🤖 Catálogo de costos
        </b>

        <div class="tsMuted">

          Pespunte + Preliminar +
          Tiempo estándar.

          Los costos existentes se conservan.

        </div>

        <div
          class="tsGrid"
          style="margin-top:10px"
        >

          <div class="tsField">

            <label>
              Modelo
            </label>

            <input
              id="tsNewM"
              placeholder="Verona"
            >

          </div>

          <div class="tsField">

            <label>
              Costo pespunte $
            </label>

            <input
              id="tsNewP"
              type="number"
              min="0"
              step="0.01"
              placeholder="12.50"
            >

          </div>

          <div class="tsField">

            <label>
              Costo preliminar $
            </label>

            <input
              id="tsNewR"
              type="number"
              min="0"
              step="0.01"
              placeholder="0.00"
            >

          </div>

          <div class="tsField">

            <label>
              Tiempo estándar (min)
            </label>

            <input
              id="tsNewMin"
              type="number"
              min="0"
              step="0.01"
              placeholder="0.00"
            >

          </div>

        </div>

        <button
          class="tsBtn"
          id="tsSaveC"
          style="margin-top:10px"
        >

          💾 Guardar / actualizar modelo

        </button>

      </div>

      <div class="tsCard">

        ${
          c.length

          ?

          `

          <table class="tsTable">

            <tr>

              <th>
                Modelo
              </th>

              <th class="tsRight">
                Pespunte
              </th>

              <th class="tsRight">
                Preliminar
              </th>

              <th class="tsRight">
                Tiempo
              </th>

              <th>
                Acción
              </th>

            </tr>

            ${
              c.map(
                x=>`

                  <tr>

                    <td>
                      ${esc(x.modelo)}
                    </td>

                    <td class="tsRight">
                      ${money(
                        x.pespunte
                      )}
                    </td>

                    <td class="tsRight">
                      ${money(
                        x.preliminar
                      )}
                    </td>

                    <td class="tsRight">

                      ${
                        num(x.min)
                          ? num(x.min)+" min"
                          : "—"
                      }

                    </td>

                    <td>

                      <button
                        class="tsBtn alt tsDestEdit"
                        data-model="${esc(x.modelo)}"
                      >
                        ✏️
                      </button>

                    </td>

                  </tr>

                `
              ).join("")
            }

          </table>

          `

          :

          `

          <div class="tsMuted">

            No hay modelos capturados.

          </div>

          `

        }

      </div>

    `;

    document
    .getElementById(
      "tsSaveC"
    )
    ?.addEventListener(
      "click",
      ()=>{

        const model =
          document
          .getElementById(
            "tsNewM"
          )
          .value
          .trim();

        if(!model){

          alert(
            "Escribe el modelo."
          );

          return;

        }

        const p =
          num(
            document
            .getElementById(
              "tsNewP"
            )
            .value
          );

        const r =
          num(
            document
            .getElementById(
              "tsNewR"
            )
            .value
          );

        const min =
          num(
            document
            .getElementById(
              "tsNewMin"
            )
            .value
          );

        const arr =
          normalizeCostObject(
            readJSON(
              KEYC,
              {}
            )
          );

        const existing =
          Object.keys(arr)
          .find(
            x=>
              normalize(x)===
              normalize(model)
          );

        if(
          existing &&
          existing!==model
        ){

          delete arr[
            existing
          ];

        }

        arr[model] = {

          pes:p,

          pre:r,

          min:min

        };

        saveJSON(
          KEYC,
          arr
        );

        saveJSON(
          "ts_costos_v1",
          Object.keys(arr)
          .map(x=>({

            modelo:x,

            pespunte:
              num(arr[x].pes),

            preliminar:
              num(arr[x].pre),

            min:
              num(arr[x].min)

          }))
        );

        renderAll();

        setTimeout(
          installCostRepair,
          50
        );

      }
    );

    document
    .querySelectorAll(
      ".tsDestEdit"
    )
    .forEach(
      button=>{

        button.onclick=()=>{

          const model =
            button.dataset.model;

          const item =
            c.find(
              x=>
                x.modelo===model
            );

          if(!item)
            return;

          document
          .getElementById(
            "tsNewM"
          )
          .value =
            item.modelo;

          document
          .getElementById(
            "tsNewP"
          )
          .value =
            num(
              item.pespunte
            );

          document
          .getElementById(
            "tsNewR"
          )
          .value =
            num(
              item.preliminar
            );

          document
          .getElementById(
            "tsNewMin"
          )
          .value =
            num(
              item.min
            );

          document
          .getElementById(
            "tsNewM"
          )
          .focus();

        };

      }
    );

  }

  /* ==============================================================
     RESUMEN DESTAJO
     ============================================================== */

  function renderRes(){

    const start =
      mondayOf(
        todayLocal()
      );

    const end =
      addDays(
        start,
        5
      );

    const rr =
      records()
      .filter(
        r=>
          r.date>=start &&
          r.date<=end
      );

    const sum =
      arr=>
        arr.reduce(
          (a,r)=>
            a+
            num(
              r.piezas ??
              r.pares
            ),
          0
        );

    const calc =
      (arr,key)=>
        arr.reduce(
          (a,r)=>
            a+
            num(
              r.piezas ??
              r.pares
            )*
            num(
              r[key]
            ),
          0
        );

    const A =
      rr.filter(
        r=>
          r.line===
          "Línea A"
      );

    const B =
      rr.filter(
        r=>
          r.line===
          "Línea B"
      );

    const pA =
      calc(
        A,
        "pespunte"
      );

    const pB =
      calc(
        B,
        "pespunte"
      );

    const rA =
      calc(
        A,
        "preliminar"
      );

    const rB =
      calc(
        B,
        "preliminar"
      );

    const total =
      pA+pB+rA+rB;

    document
    .getElementById(
      "tsRes"
    )
    .innerHTML = `

      <div class="tsCard">

        <b>
          Semana de nómina
        </b>

        <div class="tsMuted">

          ${start}
          →
          ${end}

          · cierre el sábado

        </div>

        <div
          class="tsKpis"
          style="margin-top:10px"
        >

          <div class="tsKpi">

            <small>
              Línea A · destajo
            </small>

            <div class="tsMoney">

              ${money(
                pA+rA
              )}

            </div>

          </div>

          <div class="tsKpi">

            <small>
              Línea B · destajo
            </small>

            <div class="tsMoney">

              ${money(
                pB+rB
              )}

            </div>

          </div>

          <div class="tsKpi">

            <small>
              Acumulado semanal
            </small>

            <div class="tsMoney">

              ${money(
                total
              )}

            </div>

          </div>

        </div>

      </div>

      <div class="tsCard">

        <b>
          Desglose por línea
        </b>

        <div class="tsLine">

          <span>

            Línea A ·
            ${sum(A)}
            piezas

          </span>

          <span>

            <b>
              Pespunte
              ${money(pA)}
            </b>

            · Preliminar
            ${money(rA)}

          </span>

        </div>

        <div class="tsLine">

          <span>

            Línea B ·
            ${sum(B)}
            piezas

          </span>

          <span>

            <b>
              Pespunte
              ${money(pB)}
            </b>

            · Preliminar
            ${money(rB)}

          </span>

        </div>

        <div class="tsLine">

          <span>
            <b>
              Total
            </b>
          </span>

          <span>

            <b>
              ${money(total)}
            </b>

          </span>

        </div>

      </div>

      <div class="tsCard">

        <b>
          Cerrar semana
        </b>

        <div class="tsMuted">

          El cierre guarda el total
          de lunes a sábado.

          Los registros no se borran.

        </div>

        <button
          class="tsBtn good"
          id="tsCloseWeek"
          style="margin-top:10px"
        >

          Cerrar semana y guardar histórico

        </button>

      </div>

      <div class="tsCard">

        <b>
          Histórico de cierres
        </b>

        <div id="tsHistory">
        </div>

      </div>

    `;

    document
    .getElementById(
      "tsCloseWeek"
    )
    ?.addEventListener(
      "click",
      ()=>{

        const h =
          closes();

        if(
          h.some(
            x=>
              x.week===
              start
          )
        ){

          alert(
            "Esta semana ya está cerrada."
          );

          return;

        }

        h.unshift({

          week:start,

          end:end,

          total:total,

          pespunte:
            pA+pB,

          preliminar:
            rA+rB,

          lineA:
            pA+rA,

          lineB:
            pB+rB,

          closedAt:
            new Date()
            .toISOString()

        });

        save(
          KEYW,
          h
        );

        renderRes();

      }
    );

    const h =
      closes();

    document
    .getElementById(
      "tsHistory"
    )
    .innerHTML =

      h.length

      ?

      `

      <table class="tsTable">

        <tr>

          <th>
            Semana
          </th>

          <th>
            A
          </th>

          <th>
            B
          </th>

          <th class="tsRight">
            Total
          </th>

        </tr>

        ${
          h.map(
            x=>`

              <tr>

                <td>
                  ${esc(x.week)}
                </td>

                <td>
                  ${money(x.lineA)}
                </td>

                <td>
                  ${money(x.lineB)}
                </td>

                <td class="tsRight">

                  <b>
                    ${money(x.total)}
                  </b>

                </td>

              </tr>

            `
          ).join("")
        }

      </table>

      `

      :

      `

      <div
        class="tsMuted"
        style="padding-top:8px"
      >

        No hay semanas cerradas todavía.

      </div>

      `;

  }

  function renderAll(){

    renderCap();

    renderCost();

    renderRes();

  }

  panel.style.display =
    "none";

}

/* ================================================================
   FINAL
   ================================================================ */

</script>
