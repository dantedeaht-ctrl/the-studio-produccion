<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Studio</title>

<script>
(async()=>{
  try{

    const ORIGINAL_URL="https://raw.githubusercontent.com/dantedeaht-ctrl/the-studio-produccion/f07dc9e5221a9b207d205d143d68c0b917ee0e0e/index.html";

    const src=await (await fetch(ORIGINAL_URL,{cache:"no-store"})).text();

    const m=src.match(/const b="([^"]+)"/);

    if(!m){
      throw new Error("No se encontró la versión base de The Studio");
    }

    const a=Uint8Array.from(
      atob(m[1]),
      c=>c.charCodeAt(0)
    );

    const ds=new DecompressionStream("gzip");

    const t=await new Response(
      new Response(a).body.pipeThrough(ds)
    ).text();

    document.open();
    document.write(t);
    document.close();

    setTimeout(()=>{
      try{
        fixResponsive();
        installDestajo();
      }catch(e){
        console.error(e);
      }
    },80);

  }catch(e){

    document.body.innerHTML=
      '<div style="font:18px system-ui;padding:30px;max-width:100%;box-sizing:border-box">'+
      'Error al cargar The Studio<br>'+
      '<small style="overflow-wrap:anywhere">'+e+'</small>'+
      '</div>';

  }
})();


/* =========================================================
   CORRECCIÓN RESPONSIVE
   Evita que la pantalla se haga más ancha que el celular.
   ========================================================= */

function fixResponsive(){

  if(document.getElementById('tsResponsiveFix')) return;

  const style=document.createElement('style');

  style.id='tsResponsiveFix';

  style.textContent=`

    /* BASE */
    html,
    body{
      width:100%;
      max-width:100%;
      margin:0;
      padding:0;
      overflow-x:hidden !important;
    }

    *,
    *::before,
    *::after{
      box-sizing:border-box;
    }

    /* ELEMENTOS VISUALES */
    img,
    video,
    canvas,
    svg{
      max-width:100%;
      height:auto;
    }

    /* TABLAS */
    table{
      max-width:100%;
    }

    table{
      display:block;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
    }

    /* TEXTO LARGO */
    pre,
    code{
      max-width:100%;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
      word-break:break-word;
    }

    /* CAMPOS */
    input,
    select,
    textarea,
    button{
      max-width:100%;
    }

    textarea{
      resize:vertical;
    }

    /* CONTENEDORES */
    main,
    #app,
    .app,
    .container,
    .content,
    .page,
    .panel,
    .card,
    .section,
    .wrap,
    .wrapper{
      max-width:100%;
      min-width:0;
    }

    body > *{
      min-width:0;
      max-width:100vw;
    }

    /* CUALQUIER ELEMENTO QUE TENGA 100VW */
    [style*="width:100vw"],
    [style*='width:100vw']{
      max-width:100% !important;
    }

    /* EVITA MIN-WIDTH QUE ROMPA EL CELULAR */
    [style*='min-width']{
      min-width:0 !important;
    }

    /* GRID / FLEX */
    .row,
    .grid,
    .grid2,
    .grid3,
    .grid4,
    .kpis,
    .cards,
    .toolbar,
    .actions,
    .form-grid{
      min-width:0;
    }

    .row > *,
    .grid > *,
    .grid2 > *,
    .grid3 > *,
    .grid4 > *,
    .kpis > *,
    .cards > *,
    .toolbar > *,
    .actions > *,
    .form-grid > *{
      min-width:0;
      max-width:100%;
    }


    /* =====================================================
       CELULAR
       ===================================================== */

    @media(max-width:720px){

      html,
      body{
        font-size:15px;
        width:100%;
        max-width:100vw;
        overflow-x:hidden !important;
      }

      table{
        font-size:12px;
      }

      /* UNA COLUMNA EN CELULAR */
      .grid,
      .grid2,
      .grid3,
      .grid4,
      .kpis,
      .cards,
      .form-grid{
        grid-template-columns:minmax(0,1fr) !important;
      }

      .row{
        grid-template-columns:minmax(0,1fr) !important;
      }

      /* BOTONES */
      .toolbar,
      .actions{
        flex-wrap:wrap !important;
      }

      .toolbar > *,
      .actions > *{
        flex:1 1 140px;
        min-width:0;
      }

      /* HEADER */
      header{
        max-width:100vw !important;
        overflow:hidden;
      }

      /* MENÚ */
      nav{
        max-width:100vw !important;
        overflow-x:auto !important;
        overflow-y:hidden !important;
        -webkit-overflow-scrolling:touch;
      }

    }


    /* =====================================================
       CELULARES PEQUEÑOS
       ===================================================== */

    @media(max-width:420px){

      body{
        font-size:14px;
      }

      button,
      input,
      select,
      textarea{
        font-size:16px;
      }

    }

  `;

  document.head.appendChild(style);
}


/* =========================================================
   MÓDULO DESTAJO
   ========================================================= */

function installDestajo(){

  if(document.getElementById('tsDestajoBtn')) return;

  const KEYC='ts_costos_v1';
  const KEYR='ts_destajo_v1';
  const KEYW='ts_cierres_v1';


  /* =========================
     FUNCIONES GENERALES
     ========================= */

  const money=n=>
    new Intl.NumberFormat(
      'es-MX',
      {
        style:'currency',
        currency:'MXN'
      }
    ).format(Number(n)||0);


  const esc=s=>
    String(s??'').replace(
      /[&<>"']/g,
      m=>({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[m])
    );


  const read=(k,d)=>{
    try{
      return JSON.parse(
        localStorage.getItem(k) ||
        JSON.stringify(d)
      );
    }catch{
      return d;
    }
  };


  const save=(k,v)=>
    localStorage.setItem(
      k,
      JSON.stringify(v)
    );


  const today=()=>{
    const d=new Date();
    return d.toISOString().slice(0,10);
  };


  const mondayOf=d=>{

    const x=new Date(
      d+'T12:00:00'
    );

    const day=x.getDay();

    const diff=
      day===0
      ? -6
      : 1-day;

    x.setDate(
      x.getDate()+diff
    );

    return x.toISOString().slice(0,10);
  };


  const addDays=(s,n)=>{

    const d=new Date(
      s+'T12:00:00'
    );

    d.setDate(
      d.getDate()+n
    );

    return d.toISOString().slice(0,10);
  };


  const weekKey=d=>
    mondayOf(d);


  const costs=()=>
    read(KEYC,[]);


  const records=()=>
    read(KEYR,[]);


  const closes=()=>
    read(KEYW,[]);


  /* =========================
     ESTILOS DE DESTAJO
     ========================= */

  const style=document.createElement('style');

  style.textContent=`

    #tsDestajoBtn{
      position:fixed;
      right:14px;
      bottom:14px;
      z-index:2147483646;
      border:0;
      border-radius:999px;
      padding:13px 17px;
      background:#111827;
      color:#fff;
      font:700 14px system-ui;
      box-shadow:0 8px 30px #0004;
      max-width:calc(100vw - 28px);

    #tsDestajoShade{
      position:fixed;

      background:#0006;
      z-index:2147483645;
      display:none;
      width:100%;
      height:100%;
    }


    #tsDestajo{

      position:fixed;

      right:12px;
      bottom:70px;

      width:min(
        620px,
        calc(100vw - 24px)
      );

      max-width:
        calc(100vw - 24px);

      max-height:82vh;

      overflow:auto;

      -webkit-overflow-scrolling:touch;

      background:#fff;
      color:#111827;

      border-radius:18px;

      z-index:2147483647;

      box-shadow:
        0 20px 70px #0006;

      font:14px system-ui;

      box-sizing:border-box;
    }


    #tsDestajo *{
      box-sizing:border-box;
      max-width:100%;
    }


    .tsHead{

      position:sticky;
      top:0;

      background:#fff;

      border-bottom:
        1px solid #e5e7eb;

      padding:14px 16px;

      display:flex;

      align-items:center;

      justify-content:space-between;

      gap:10px;

      z-index:2;
    }


    .tsHead b{
      font-size:18px;

    }


    .tsClose{
      border:0;
      background:#f3f4f6;
      border-radius:10px;
      padding:8px 11px;
      font-size:18px;

    }


    .tsTabs{

      display:flex;

      overflow-y:hidden;

    }


    .tsTab{

    }


    .tsTab.on{
      background:#111827;
      color:#fff;
    }


    .tsPane{
      display:none;
      padding:14px;
      min-width:0;
    }


    .tsPane.on{
      display:block;
    }


    .tsGrid{

      display:grid;

      grid-template-columns:
        minmax(0,1fr)
        minmax(0,1fr);

      gap:9px;

      min-width:0;
    }


    .tsGrid3{

      display:grid;

      grid-template-columns:
        minmax(0,1fr)

        minmax(0,1fr);

      gap:9px;

      min-width:0;
    }


    .tsField{
      min-width:0;
    }


    .tsField label{

      display:block;

      font-size:11px;

      font-weight:800;

      color:#6b7280;

      margin:0 0 4px;
    }


    .tsField input,
    .tsField select{

      width:100%;

      max-width:100%;

      min-width:0;

      border:
        1px solid #d1d5db;

      border-radius:9px;

      padding:10px;

      background:#fff;

      font:inherit;

      box-sizing:border-box;
    }


    .tsBtn{

      border:0;

      border-radius:10px;

      padding:10px 13px;

      background:#111827;

      max-width:100%;
    }


    .tsBtn.alt{

      background:#e5e7eb;

    }


    .tsBtn.good{

    }


    .tsCard{

        1px solid #e5e7eb;

    }


    .tsMoney{
      font-size:21px;

    }


    .tsKpis{

      display:grid;

      grid-template-columns:
        repeat(3,minmax(0,1fr));

      min-width:0;
    }


    .tsKpi{

      background:#f8fafc;

      padding:10px;

      overflow:hidden;
    }


    .tsKpi small{

      display:block;

      color:#6b7280;

      overflow-wrap:anywhere;
    }


    .tsTable{

      width:100%;

      max-width:100%;

      border-collapse:collapse;

      margin-top:9px;

      font-size:12px;
    }


    .tsTable th,
    .tsTable td{

      padding:7px 5px;

      border-bottom:
        1px solid #eee;

      text-align:left;

      font-size:12px;

      white-space:nowrap;
    }


    .tsTable th{
      color:#6b7280;
    }


    .tsRight{
      text-align:right !important;
    }


    .tsLine{

      display:flex;

      justify-content:space-between;

      gap:8px;

      padding:8px 0;

      border-bottom:
        1px solid #eee;

      min-width:0;
    }


    .tsLine > *{
      min-width:0;
      overflow-wrap:anywhere;
    }


    .tsMuted{
      color:#6b7280;
      font-size:12px;
    }


    .tsDanger{
      color:#b91c1c;
    }


    .tsPill{

      display:inline-block;

      padding:3px 7px;

      border-radius:999px;

      background:#eef2ff;

      font-weight:800;

      font-size:11px;
    }


    /* =========================
       DESTAJO EN CELULAR
       ========================= */

    @media(max-width:520px){

      #tsDestajo{

        right:8px;

        bottom:
          calc(62px + env(safe-area-inset-bottom));

        width:
          calc(100vw - 16px);

        max-width:
          calc(100vw - 16px);

        max-height:
          calc(100vh - 80px);

        border-radius:16px;
      }


      .tsGrid,
      .tsGrid3{

        grid-template-columns:
          minmax(0,1fr)
          minmax(0,1fr);
      }


      .tsKpis{

        grid-template-columns:
          minmax(0,1fr)
          minmax(0,1fr);
      }


      .tsKpi:last-child{

        grid-column:
          1/-1;
      }


      .tsPane{
        padding:10px;
      }


      .tsCard{
        padding:10px;
      }


      .tsHead{
        padding:12px;
      }


      .tsHead b{
        font-size:16px;
      }


      .tsLine{

        flex-direction:column;

        align-items:flex-start;
      }

    }


    @media(max-width:380px){

      .tsGrid,
      .tsGrid3,
      .tsKpis{

        grid-template-columns:
          minmax(0,1fr);
      }


      .tsKpi:last-child{
        grid-column:auto;
      }

    }

  `;

  document.head.appendChild(style);


  /* =========================
     HTML DEL MÓDULO
     ========================= */

  document.body.insertAdjacentHTML(
    'beforeend',

    `
    <button
      id="tsDestajoBtn"
      aria-label="Abrir Destajo"
    >
      💰 Destajo
    </button>

    <div
      id="tsDestajoShade"
    ></div>

    <section
      id="tsDestajo"
      aria-label="Destajo The Studio"
    >

      <div class="tsHead">

        <b>
          💰 Destajo · Nómina
        </b>

        <button
          class="tsClose"
          id="tsClose"
        >
          ×
        </button>

      </div>


      <div class="tsTabs">

        <button
          class="tsTab on"
          data-tab="cap"
        >
          Captura
        </button>

        <button
          class="tsTab"
          data-tab="cost"
        >
          Costos por modelo
        </button>

        <button
          class="tsTab"
          data-tab="res"
        >
          Resumen semanal
        </button>

      </div>


      <div
        id="tsCap"
        class="tsPane on"
      ></div>


      <div
        id="tsCost"
        class="tsPane"
      ></div>


      <div
        id="tsRes"
        class="tsPane"
      ></div>

    </section>
    `
  );


  const btn=
    document.getElementById(
      'tsDestajoBtn'
    );

  const shade=
    document.getElementById(
      'tsDestajoShade'
    );

  const panel=
    document.getElementById(
      'tsDestajo'
    );


  const open=()=>{

    shade.style.display='block';

    panel.style.display='block';

    renderAll();

  };


  const close=()=>{

    shade.style.display='none';

    panel.style.display='none';

  };


  btn.onclick=open;

  shade.onclick=close;

  document.getElementById(
    'tsClose'
  ).onclick=close;


  document
    .querySelectorAll('.tsTab')
    .forEach(t=>{

      t.onclick=()=>{

        document
          .querySelectorAll('.tsTab')
          .forEach(x=>
            x.classList.remove('on')
          );

        t.classList.add('on');


        document
          .querySelectorAll('.tsPane')
          .forEach(x=>
            x.classList.remove('on')
          );


        document
          .getElementById(
            'ts'+
            ({
              cap:'Cap',
              cost:'Cost',
              res:'Res'
            }[t.dataset.tab])
          )
          .classList.add('on');


        renderAll();

      };

    });


  /* =========================
     MODELOS
     ========================= */

  function modelOptions(){

    return costs()
      .map((c,i)=>

        `<option value="${esc(c.modelo)}">
          ${esc(c.modelo)}
          · P ${money(c.pespunte)}
          · Pre ${money(c.preliminar)}
        </option>`

      )
      .join('');

  }


  /* =========================
     CAPTURA
     ========================= */

  function renderCap(){

    const c=costs();

    document.getElementById(
      'tsCap'
    ).innerHTML=`

      <div class="tsCard">

        <b>
          Registrar producción
        </b>

        <div class="tsMuted">

          El destajo se calcula con
          los pares capturados como salida.

          Semana:
          lunes a sábado.

        </div>


        <div
          class="tsGrid"
          style="margin-top:10px"
        >

          <div class="tsField">

            <label>
              Fecha
            </label>

            <input
              id="tsDate"
              type="date"
              value="${today()}"
            >

          </div>


          <div class="tsField">

            <label>
              Línea
            </label>

            <select id="tsLine">

              <option>
                Línea A
              </option>

              <option>
                Línea B
              </option>

            </select>

          </div>


          <div class="tsField">

            <label>
              Modelo
            </label>

            <select id="tsModel">

              ${
                modelOptions() ||
                '<option value="">Primero agrega un modelo</option>'
              }

            </select>

          </div>


          <div class="tsField">

            <label>
              Pares salidos
            </label>

            <input
              id="tsPairs"
              type="number"
              min="0"
              step="1"
              placeholder="0"
            >

          </div>

        </div>


        <div
          class="tsGrid3"
          style="margin-top:10px"
        >

          <div class="tsKpi">

            <small>
              Pespunte/par
            </small>

            <b id="tsCP">
              $0.00
            </b>

          </div>


          <div class="tsKpi">

            <small>
              Preliminar/par
            </small>

            <b id="tsCR">
              $0.00
            </b>

          </div>


          <div class="tsKpi">

            <small>
              Destajo registro
            </small>

            <b id="tsCT">
              $0.00
            </b>

          </div>

        </div>


        <div
          style="
            display:flex;
            gap:8px;
            margin-top:10px;
            flex-wrap:wrap;
          "
        >

          <button
            class="tsBtn"
            id="tsAdd"
          >
            Agregar
          </button>

          <button
            class="tsBtn alt"
            id="tsClear"
          >
            Limpiar
          </button>

        </div>

      </div>


      <div class="tsCard">

        <b>
          Registros recientes
        </b>

        <div id="tsRecent"></div>

      </div>

    `;


    const update=()=>{

      const x=c.find(
        v=>
          v.modelo===
          (
            document.getElementById(
              'tsModel'
            )?.value
          )
      );


      const p=
        Number(
          document.getElementById(
            'tsPairs'
          )?.value
        )||0;


      document.getElementById(
        'tsCP'
      ).textContent=
        money(x?.pespunte);


      document.getElementById(
        'tsCR'
      ).textContent=
        money(x?.preliminar);


      document.getElementById(
        'tsCT'
      ).textContent=
        money(
          p*
          (
            (x?.pespunte||0)+
            (x?.preliminar||0)
          )
        );

    };


    document
      .getElementById('tsModel')
      ?.addEventListener(
        'change',
        update
      );


    document
      .getElementById('tsPairs')
      ?.addEventListener(
        'input',
        update
      );


    update();


    document
      .getElementById('tsAdd')
      ?.addEventListener(
        'click',
        ()=>{

          const model=
            c.find(
              v=>
                v.modelo===
                document.getElementById(
                  'tsModel'
                ).value
            );


          const pairs=
            Number(
              document.getElementById(
                'tsPairs'
              ).value
            )||0;


          if(
            !model||
            pairs<=0
          ){

            return alert(
              'Selecciona un modelo y captura los pares salidos.'
            );

          }


          const r=records();


          r.push({

            id:Date.now(),

            date:
              document.getElementById(
                'tsDate'
              ).value,

            line:
              document.getElementById(
                'tsLine'
              ).value,

            modelo:
              model.modelo,

            pares:
              pairs,

            pespunte:
              Number(
                model.pespunte
              )||0,

            preliminar:
              Number(
                model.preliminar
              )||0

          });


          save(
            KEYR,
            r
          );


          renderAll();

        }
      );


    document
      .getElementById('tsClear')
      ?.addEventListener(
        'click',
        ()=>{

          document.getElementById(
            'tsPairs'
          ).value='';

          update();

        }
      );


    const rr=
      records()
        .slice(-12)
        .reverse();


    document.getElementById(
      'tsRecent'
    ).innerHTML=

      rr.length

      ?

      `
      <div
        style="
          width:100%;
          overflow-x:auto;
          -webkit-overflow-scrolling:touch;
        "
      >

        <table
          class="tsTable"
          style="min-width:520px"
        >

          <tr>

            <th>
              Fecha
            </th>

            <th>
              Línea
            </th>

            <th>
              Modelo
            </th>

            <th class="tsRight">
              Pares
            </th>

            <th class="tsRight">
              Destajo
            </th>

          </tr>


          ${
            rr.map(r=>

              `<tr>

                <td>
                  ${r.date}
                </td>

                <td>
                  ${esc(
                    r.line.replace(
                      'Línea ',
                      ''
                    )
                  )}
                </td>

                <td>
                  ${esc(r.modelo)}
                </td>

                <td class="tsRight">
                  ${r.pares}
                </td>

                <td class="tsRight">
                  ${
                    money(
                      r.pares*
                      (
                        r.pespunte+
                        r.preliminar
                      )
                    )
                  }
                </td>

              </tr>`

            ).join('')
          }

        </table>

      </div>
      `

      :

      `
      <div
        class="tsMuted"
        style="padding:10px 0"
      >
        Aún no hay registros.
      </div>
      `;

  }


  /* =========================
     COSTOS
     ========================= */

  function renderCost(){

    const c=costs();


    document.getElementById(
      'tsCost'
    ).innerHTML=`

      <div class="tsCard">

        <b>
          Catálogo de costos
        </b>

        <div class="tsMuted">

          Captura una vez el costo
          por modelo; al registrar
          salida se toma automáticamente.

        </div>


        <div
          class="tsGrid3"
          style="margin-top:10px"
        >

          <div class="tsField">

            <label>
              Modelo
            </label>

            <input
              id="tsNewM"
              placeholder="Verona"
            >

          </div>


          <div class="tsField">

            <label>
              Costo pespunte $
            </label>

            <input
              id="tsNewP"
              type="number"
              min="0"
              step="0.01"
              placeholder="12"
            >

          </div>


          <div class="tsField">

            <label>
              Costo preliminar $
            </label>

            <input
              id="tsNewR"
              type="number"
              min="0"
              step="0.01"
              placeholder="8"
            >

          </div>

        </div>


        <button
          class="tsBtn"
          id="tsSaveC"
          style="margin-top:10px"
        >
          Guardar / actualizar modelo
        </button>

      </div>


      <div class="tsCard">

        ${
          c.length

          ?

          `
          <div
            style="
              width:100%;
              overflow-x:auto;
              -webkit-overflow-scrolling:touch;
            "
          >

            <table
              class="tsTable"
              style="min-width:480px"
            >

              <tr>

                <th>
                  Modelo
                </th>

                <th class="tsRight">
                  Pespunte
                </th>

                <th class="tsRight">
                  Preliminar
                </th>

                <th></th>

              </tr>


              ${
                c.map((x,i)=>

                  `<tr>

                    <td>
                      ${esc(x.modelo)}
                    </td>

                    <td class="tsRight">
                      ${money(x.pespunte)}
                    </td>

                    <td class="tsRight">
                      ${money(x.preliminar)}
                    </td>

                    <td class="tsRight">

                      <button
                        class="tsBtn alt"
                        data-del="${i}"
                      >
                        ×
                      </button>

                    </td>

                  </tr>`

                ).join('')
              }

            </table>

          </div>
          `

          :

          `
          <div class="tsMuted">
            No hay modelos capturados.
          </div>
          `
        }

      </div>

    `;


    document
      .getElementById('tsSaveC')
      ?.addEventListener(
        'click',
        ()=>{

          const m=
            document.getElementById(
              'tsNewM'
            ).value.trim();


          if(!m){

            return alert(
              'Escribe el modelo.'
            );

          }


          const p=
            Number(
              document.getElementById(
                'tsNewP'
              ).value
            )||0;


          const r=
            Number(
              document.getElementById(
                'tsNewR'
              ).value
            )||0;


          const arr=costs();


          const i=
            arr.findIndex(
              x=>
                x.modelo.toLowerCase()===
                m.toLowerCase()
            );


          const item={
            modelo:m,
            pespunte:p,
            preliminar:r
          };


          if(i>=0){

            arr[i]=item;

          }else{

            arr.push(item);

          }


          save(
            KEYC,
            arr
          );


          renderAll();

        }
      );


    document
      .querySelectorAll('[data-del]')
      .forEach(
        b=>

          b.onclick=()=>{

            const arr=costs();

            arr.splice(
              Number(
                b.dataset.del
              ),
              1
            );

            save(
              KEYC,
              arr
            );

            renderAll();

          }

      );

  }


  /* =========================
     RESUMEN SEMANAL
     ========================= */

  function renderRes(){

    const start=
      mondayOf(
        today()
      );


    const end=
      addDays(
        start,
        5
      );


    const rr=
      records()
        .filter(
          r=>
            r.date>=start &&
            r.date<=end
        );


    const sum=arr=>
      arr.reduce(
        (a,r)=>
          a+r.pares,
        0
      );


    const calc=(arr,k)=>
      arr.reduce(
        (a,r)=>
          a+
          r.pares*
          (r[k]||0),
        0
      );


    const A=
      rr.filter(
        r=>
          r.line===
          'Línea A'
      );


    const B=
      rr.filter(
        r=>
          r.line===
          'Línea B'
      );


    const pA=
      calc(
        A,
        'pespunte'
      );


    const pB=
      calc(
        B,
        'pespunte'
      );


    const rA=
      calc(
        A,
        'preliminar'
      );


    const rB=
      calc(
        B,
        'preliminar'
      );


    const total=
      pA+
      pB+
      rA+
      rB;


    document.getElementById(
      'tsRes'
    ).innerHTML=`

      <div class="tsCard">

        <b>
          Semana de nómina
        </b>

        <div class="tsMuted">

          ${start}
          →
          ${end}

          · cierre el sábado

        </div>


        <div
          class="tsKpis"
          style="margin-top:10px"
        >

          <div class="tsKpi">

            <small>
              Línea A · destajo
            </small>

            <div class="tsMoney">
              ${money(pA+rA)}
            </div>

          </div>


          <div class="tsKpi">

            <small>
              Línea B · destajo
            </small>

            <div class="tsMoney">
              ${money(pB+rB)}
            </div>

          </div>


          <div class="tsKpi">

            <small>
              Acumulado semanal
            </small>

            <div class="tsMoney">
              ${money(total)}
            </div>

          </div>

        </div>

      </div>


      <div class="tsCard">

        <b>
          Desglose por línea
        </b>


        <div class="tsLine">

          <span>
            Línea A ·
            ${sum(A)}
            pares
          </span>

          <span>
            <b>
              Pespunte
              ${money(pA)}
            </b>

            · Preliminar
            ${money(rA)}
          </span>

        </div>


        <div class="tsLine">

          <span>
            Línea B ·
            ${sum(B)}
            pares
          </span>

          <span>

            <b>
              Pespunte
              ${money(pB)}
            </b>

            · Preliminar
            ${money(rB)}

          </span>

        </div>


        <div class="tsLine">

          <span>
            <b>
              Total
            </b>
          </span>

          <span>

            <b>
              ${money(total)}
            </b>

          </span>

        </div>

      </div>


      <div class="tsCard">

        <b>
          Cerrar semana
        </b>

        <div class="tsMuted">

          El cierre guarda el total
          de lunes a sábado en el histórico.

          Los registros no se borran.

        </div>


        <button
          class="tsBtn good"
          id="tsCloseWeek"
          style="margin-top:10px"
        >
          Cerrar semana y guardar histórico
        </button>

      </div>


      <div class="tsCard">

        <b>
          Histórico de cierres
        </b>

        <div id="tsHistory"></div>

      </div>

    `;


    document
      .getElementById('tsCloseWeek')
      ?.addEventListener(
        'click',
        ()=>{

          const h=closes();


          if(
            h.some(
              x=>
                x.week===
                start
            )
          ){

            alert(
              'Esta semana ya está cerrada.'
            );

            return;

          }


          h.unshift({

            week:start,

            end,

            total,

            pespunte:
              pA+pB,

            preliminar:
              rA+rB,

            lineA:
              pA+rA,

            lineB:
              pB+rB,

            closedAt:
              new Date().toISOString()

          });


          save(
            KEYW,
            h
          );


          renderRes();

        }
      );


    const h=closes();


    document.getElementById(
      'tsHistory'
    ).innerHTML=

      h.length

      ?

      `
      <div
        style="
          width:100%;
          overflow-x:auto;
          -webkit-overflow-scrolling:touch;
        "
      >

        <table
          class="tsTable"
          style="min-width:420px"
        >

          <tr>

            <th>
              Semana
            </th>

            <th>
              A
            </th>

            <th>
              B
            </th>

            <th class="tsRight">
              Total
            </th>

          </tr>


          ${
            h.map(x=>

              `<tr>

                <td>
                  ${x.week}
                </td>

                <td>
                  ${money(x.lineA)}
                </td>

                <td>
                  ${money(x.lineB)}
                </td>

                <td class="tsRight">

                  <b>
                    ${money(x.total)}
                  </b>

                </td>

              </tr>`

            ).join('')
          }

        </table>

      </div>
      `

      :

      `
      <div
        class="tsMuted"
        style="padding-top:8px"
      >
        No hay semanas cerradas todavía.
      </div>
      `;

  }


  /* =========================
     RENDER GENERAL
     ========================= */

  function renderAll(){

    renderCap();

    renderCost();

    renderRes();

  }


  panel.style.display='none';

}
</script>
