/* ================================================================
   UTILIDADES
   ================================================================ */

function num(value){

  const n=Number(value);

  return Number.isFinite(n)?n:0;

}


function money(value){

  return new Intl.NumberFormat(
    "es-MX",
    {
      style:"currency",
      currency:"MXN",
      minimumFractionDigits:2
    }
  ).format(num(value));

}


function numberMX(value){

  return new Intl.NumberFormat(
    "es-MX",
    {
      maximumFractionDigits:2
    }
  ).format(num(value));

}


function esc(value){

  return String(value??"")
    .replace(
      /[&<>"']/g,
      m=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[m])
    );

}


function normalize(value){

  return String(value??"")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .trim()
    .toLowerCase();

}


/* ================================================================
   LOCAL STORAGE
   ================================================================ */

function readJSON(key,fallback){

  try{

    const value=localStorage.getItem(key);

    if(
      value===null ||
      value===undefined ||
      value===""
    ){

      return fallback;

    }

    return JSON.parse(value);

  }catch(error){

    console.error(
      "Error leyendo",
      key,
      error
    );

    return fallback;

  }

}


function saveJSON(key,value){

  try{

    localStorage.setItem(
      key,
      JSON.stringify(value)
    );

  }catch(error){

    console.error(
      "Error guardando",
      key,
      error
    );

  }

}


/* ================================================================
   FECHAS
   ================================================================ */

function localDateString(date){

  if(!date){
    return "";
  }

  const d =
    date instanceof Date
      ? new Date(date)
      : new Date(String(date).includes("T")
          ? String(date)
          : String(date)+"T12:00:00"
        );

  if(Number.isNaN(d.getTime())){
    return "";
  }

  return [

    d.getFullYear(),

    String(
      d.getMonth()+1
    ).padStart(2,"0"),

    String(
      d.getDate()
    ).padStart(2,"0")

  ].join("-");

}


function todayLocal(){

  return localDateString(
    new Date()
  );

}


function mondayOf(date){

  const d=
    new Date(
      String(date)+"T12:00:00"
    );

  const day=d.getDay();

  const diff=
    day===0
      ? -6
      : 1-day;

  d.setDate(
    d.getDate()+diff
  );

  return localDateString(d);

}


function addDays(date,n){

  const d=
    new Date(
      String(date)+"T12:00:00"
    );

  d.setDate(
    d.getDate()+n
  );

  return localDateString(d);

}


function weekRange(reference){

  const start=
    mondayOf(reference);

  return {

    start:start,

    end:addDays(
      start,
      5
    )

  };

}


function inWeek(date,reference){

  const d=
    localDateString(date);

  const r=
    weekRange(reference);

  return (
    d>=r.start &&
    d<=r.end
  );

}

  if(
    raw &&

    raw &&

  ){
    return raw.produccion;
  }

  if(
    raw &&
    Array.isArray(raw.programacion)
  ){

  }

  return [];

/* ================================================================
   COSTOS
   ================================================================ */

function normalizeCostObject(raw){

  const result={};

  if(!raw){
    return result;
  }


  if(
    raw &&
    !Array.isArray(raw) &&
    typeof raw==="object"
  ){

    if(
      raw.cost &&
      typeof raw.cost==="object"
    ){

      raw=raw.cost;

    }

  }


  if(
    !Array.isArray(raw) &&
    typeof raw==="object"
  ){

    Object.keys(raw).forEach(
      model=>{

        const item=raw[model];

        if(
          !item ||
          typeof item!=="object"
        ){

          result[model]={

            pes:num(item),

            pre:0,

            min:0,

            tstdPes:0,

            tstdPre:0

          };

          return;

        }


        result[model]={

          pes:num(
            item.pes ??
            item.pespunte ??
            item.pesPunte ??
            item.costoPespunte ??
            item.costo_pespunte
          ),

          pre:num(
            item.pre ??
            item.preliminar ??
            item.costoPreliminar ??
            item.costo_preliminar
          ),

          min:num(
            item.min ??
            item.minutos
          ),

          tstdPes:num(
            item.tstdPes ??
            item.tstdPespunte ??
            item.tstd_pespunte ??
            item.tiempoPespunte ??
            item.tiempo_pespunte
          ),

          tstdPre:num(
            item.tstdPre ??
            item.tstdPreliminar ??
            item.tstd_preliminar ??
            item.tiempoPreliminar ??
            item.tiempo_preliminar
          )

        };

      }
    );

    return result;

  }


  if(Array.isArray(raw)){

    raw.forEach(
      item=>{

        if(!item){
          return;
        }

        const model=
          String(
            item.modelo ??
            item.model ??
            item.nombre ??
            item.name ??
            ""
          ).trim();

        if(!model){
          return;
        }

        result[model]={

          pes:num(
            item.pes ??
            item.pespunte ??
            item.pesPunte ??
            item.costoPespunte
          ),

          pre:num(
            item.pre ??
            item.preliminar ??
            item.costoPreliminar
          ),

          min:num(
            item.min ??
            item.minutos
          ),

          tstdPes:num(
            item.tstdPes ??
            item.tstdPespunte ??
            item.tiempoPespunte
          ),

          tstdPre:num(
            item.tstdPre ??
            item.tstdPreliminar ??
            item.tiempoPreliminar
          )

        };

      }
    );

  }

  return result;

}


/* ================================================================
   RECUPERAR COSTOS ANTIGUOS
   ================================================================ */

function migrateAllCosts(){

  let main=
    normalizeCostObject(
      readJSON(
        KCOST,
        {}
      )
    );


  const oldKeys=[

    "ts_costos_v1",

    "theStudioCostos_v1",

    "theStudioCostos_v2",

    "theStudioCostos_v3",

    "theStudioCostos",

    "costos",

    "modelos",

    "catalogoModelos",

    "catalogoCostos"

  ];


  function mergeModel(
    model,
    incoming
  ){

    const clean=
      String(
        model??""
      ).trim();

    if(!clean){
      return;
    }


    const existing=
      Object.keys(main)
      .find(
        x=>
          normalize(x)===
          normalize(clean)
      );


    const name=
      existing ||
      clean;


    if(!main[name]){

      main[name]={

        pes:num(incoming?.pes),

        pre:num(incoming?.pre),

        min:num(incoming?.min),

        tstdPes:num(
          incoming?.tstdPes
        ),

        tstdPre:num(
          incoming?.tstdPre
        )

      };

      return;

    }


    if(
      !num(main[name].pes) &&
      num(incoming?.pes)
    ){

      main[name].pes=
        num(incoming.pes);

    }


    if(
      !num(main[name].pre) &&
      num(incoming?.pre)
    ){

      main[name].pre=
        num(incoming.pre);

    }


    if(
      !num(main[name].min) &&
      num(incoming?.min)
    ){

      main[name].min=
        num(incoming.min);

    }


    if(
      !num(main[name].tstdPes) &&
      num(incoming?.tstdPes)
    ){

      main[name].tstdPes=
        num(incoming.tstdPes);

    }


    if(
      !num(main[name].tstdPre) &&
      num(incoming?.tstdPre)
    ){

      main[name].tstdPre=
        num(incoming.tstdPre);

    }

  }


  function readSource(raw){

    if(!raw){
      return;
    }


    if(Array.isArray(raw)){

      raw.forEach(
        item=>{

          if(
            !item ||
            typeof item!=="object"
          ){
            return;
          }


          const model=
            String(
              item.modelo ??
              item.model ??
              item.nombre ??
              item.name ??
              ""
            ).trim();


          if(!model){
            return;
          }


          mergeModel(
            model,
            {

              pes:num(
                item.pes ??
                item.pespunte ??
                item.costoPespunte
              ),

              pre:num(
                item.pre ??
                item.preliminar ??
                item.costoPreliminar
              ),

              min:num(
                item.min ??
                item.minutos
              ),

              tstdPes:num(
                item.tstdPes ??
                item.tstdPespunte ??
                item.tiempoPespunte
              ),

              tstdPre:num(
                item.tstdPre ??
                item.tstdPreliminar ??
                item.tiempoPreliminar
              )

            }
          );

        }
      );

      return;

    }


    if(
      typeof raw!=="object"
    ){
      return;
    }


    if(raw.costos){
      readSource(raw.costos);
    }

    if(raw.modelos){
      readSource(raw.modelos);
    }

    if(raw.catalogo){
      readSource(raw.catalogo);
    }

    if(raw.data){
      readSource(raw.data);
    }


    Object.keys(raw).forEach(
      key=>{

        if(
          [
            "costos",
            "modelos",
            "catalogo",
            "data"
          ].includes(key)
        ){
          return;
        }


        const value=raw[key];


        if(
          !value ||
          typeof value!=="object" ||
          Array.isArray(value)
        ){
          return;
        }


        const pes=
          num(
            value.pes ??
            value.pespunte ??
            value.costoPespunte
          );


        const pre=
          num(
            value.pre ??
            value.preliminar ??
            value.costoPreliminar
          );


        const min=
          num(
            value.min ??
            value.minutos
          );


        const tstdPes=
          num(
            value.tstdPes ??
            value.tstdPespunte ??
            value.tiempoPespunte
          );


        const tstdPre=
          num(
            value.tstdPre ??
            value.tstdPreliminar ??
            value.tiempoPreliminar
          );


        if(
          pes===0 &&
          pre===0 &&
          min===0 &&
          tstdPes===0 &&
          tstdPre===0
        ){
          return;
        }


        mergeModel(
          key,
          {
            pes,
            pre,
            min,
            tstdPes,
            tstdPre
          }
        );

      }
    );

  }


  oldKeys.forEach(
    key=>{
      readSource(
        readJSON(
          key,
          null
        )
      );
    }
  );


  Object.keys(TS_TSTD).forEach(
    key=>{

      const existing=
        Object.keys(main)
        .find(
          model=>
            normalize(model)===
            key
        );


      if(!existing){
        return;
      }


      if(
        !num(
          main[existing].tstdPes
        )
      ){

        main[existing].tstdPes=
          TS_TSTD[key].pes;

      }


      if(
        !num(
          main[existing].tstdPre
        )
      ){

        main[existing].tstdPre=
          TS_TSTD[key].pre;

      }

    }
  );


  saveJSON(
    KCOST,
    main
  );


  saveJSON(
    "ts_costos_v1",
    Object.keys(main).map(
      model=>({

        modelo:model,

        pespunte:
          num(main[model].pes),

        preliminar:
          num(main[model].pre),

        min:
          num(main[model].min),

        tstdPes:
          num(main[model].tstdPes),

        tstdPre:
          num(main[model].tstdPre)

      })
    )
  );


  return main;

}


function getCosts(){

  return migrateAllCosts();

}


/* ================================================================
   TSTD DEL MODELO
   ================================================================ */

function getModelTSTD(model){

  const name=
    normalize(model);


  const costs=
    getCosts();


  const existing=
    Object.keys(costs)
    .find(
      x=>
        normalize(x)===name
    );


  if(existing){

    const item=costs[existing];

    let pes=
      num(item.tstdPes);

    let pre=
      num(item.tstdPre);


    if(
      pes<=0 &&
      pre<=0 &&
      num(item.min)>0
    ){

      pes=num(item.min);
      pre=num(item.min);

    }


    const known=
      Object.keys(TS_TSTD)
      .find(
        key=>
          name.includes(key) ||
          key.includes(name)
      );


    if(known){

      if(pes<=0){
        pes=TS_TSTD[known].pes;
      }

      if(pre<=0){
        pre=TS_TSTD[known].pre;
      }

    }


    return {
      pes,
      pre
    };

  }


  const known=
    Object.keys(TS_TSTD)
    .find(
      key=>
        name.includes(key) ||
        key.includes(name)
    );


  if(known){

    return {

      pes:TS_TSTD[known].pes,

      pre:TS_TSTD[known].pre

    };

  }


  return {
    pes:0,
    pre:0
  };

}


/* ================================================================
   CAPACIDAD DE LA JORNADA
   ================================================================ */

function getShift(){

  return {

    minutes:
      TS_CONFIG.minutosJornada,

    pespunte:
      TS_CONFIG.pespuntadores *
      TS_CONFIG.minutosJornada,

    preliminar:
      TS_CONFIG.preliminares *
      TS_CONFIG.minutosJornada,

    totalWorkers:
      TS_CONFIG.pespuntadores+
      TS_CONFIG.preliminares

  };

}


/* ================================================================
   DATOS DE PROGRAMACIÓN
   ================================================================ */

function getTodayProgramming(){

  const today=
    todayLocal();


  return getProduction()
    .filter(
      item=>{

        const date=
          item.fecha ??
          item.date ??
          item.dia ??
          item.fechaProgramacion;


        return (
          localDateString(date)===today
        );

      }
    );

}


function getProgrammedPieces(item){

  return num(

    item.programado ??

    item.cantidadProgramada ??

    item.cantidad ??

    item.piezas ??

    item.qty ??

    item.cantidadProg ??

    item.cantProg

  );

}


function getProgrammedModel(item){

  return String(

    item.modelo ??

    item.model ??

    item.nombreModelo ??

    item.producto ??

    ""

  ).trim();

}


/* ================================================================
   CAPACIDAD DE LA PROGRAMACIÓN
   ================================================================ */

function calculateTodayCapacity(){

  const rows=
    getTodayProgramming();


  let programmedPieces=0;

  let requiredPesMinutes=0;

  let requiredPreMinutes=0;

  let moneyPes=0;

  let moneyPre=0;

  const details=[];


  rows.forEach(
    item=>{

      const model=
        getProgrammedModel(item);


      const pieces=
        getProgrammedPieces(item);


      if(
        !model ||
        pieces<=0
      ){
        return;
      }


      const tstd=
        getModelTSTD(model);


      const costs=
        getCosts();


      const costName=
        Object.keys(costs)
        .find(
          x=>
            normalize(x)===
            normalize(model)
        );


      const cost=
        costName
          ? costs[costName]
          : null;


      const pesCost=
        num(cost?.pes);


      const preCost=
        num(cost?.pre);


      const pesMinutes=
        pieces*tstd.pes;


      const preMinutes=
        pieces*tstd.pre;


      programmedPieces+=pieces;

      requiredPesMinutes+=pesMinutes;

      requiredPreMinutes+=preMinutes;

      moneyPes+=
        pieces*pesCost;

      moneyPre+=
        pieces*preCost;


      details.push({

        model,

        pieces,

        tstdPes:tstd.pes,

        tstdPre:tstd.pre,

        pesMinutes,

        preMinutes,

        pesCost,

        preCost,

        money:
          pieces*
          (
            pesCost+
            preCost
          )

      });

    }
  );


  const shift=
    getShift();


  const capacityPes=
    requiredPesMinutes>0

      ? shift.pespunte /
        (
          requiredPesMinutes/
          programmedPieces
        )

      : 0;


  const capacityPre=
    requiredPreMinutes>0

      ? shift.preliminar /
        (
          requiredPreMinutes/
          programmedPieces
        )

      : 0;


  let capacityLine=0;


  if(
    programmedPieces>0
  ){

    capacityLine=
      Math.floor(
        Math.min(
          capacityPes,
          capacityPre
        )
      );

  }


  const limitingProcess=
    requiredPesMinutes>=
    requiredPreMinutes

      ? "Pespunte"

      : "Preliminar";


  const occupiedPercentPes=
    shift.pespunte>0

      ? (
          requiredPesMinutes/
          shift.pespunte
        )*100

      : 0;


  const occupiedPercentPre=
    shift.preliminar>0

      ? (
          requiredPreMinutes/
          shift.preliminar
        )*100

      : 0;


  const targetPerHour=
    shift.minutes>0

      ? capacityLine/
        (
          shift.minutes/60
        )

      : 0;


  return {

    rows,

    details,

    programmedPieces,

    requiredPesMinutes,

    requiredPreMinutes,

    availablePesMinutes:
      shift.pespunte,

    availablePreMinutes:
      shift.preliminar,

    capacityPes,

    capacityPre,

    capacityLine,

    limitingProcess,

    targetPerHour,

    occupiedPercentPes,

    occupiedPercentPre,

    moneyPes,

    moneyPre,

    moneyTotal:
      moneyPes+
      moneyPre

  };

}


/* ================================================================
   PRODUCCIÓN REAL DEL DÍA
   ================================================================ */

function getTodayActual(){

  const today=
    todayLocal();


  let total=0;

  let moneyTotal=0;

  let standardMinutesPes=0;

  let standardMinutesPre=0;


  getAdvances()
  .filter(
    item=>{

      const date=
        item.fecha ??
        item.fechaHora ??
        item.date;

      return (
        localDateString(date)===today
      );

    }
  )
  .forEach(
    item=>{

      const destination=
        normalize(

          item.siguienteProceso ??

          item.procesoNuevo ??

          item.procesoDestino ??

          item.destino ??

          ""

        );


      if(
        destination!=="empaque" &&
        destination!=="auditoria"
      ){

        return;

      }


      const pieces=
        num(

          item.piezas ??

          item.cantidad ??

          item.qty

        );


      if(pieces<=0){
        return;
      }


      const model=
        String(

          item.modelo ??

          item.model ??

          ""

        ).trim();


      const tstd=
        getModelTSTD(model);


      const costs=
        getCosts();


      const costName=
        Object.keys(costs)
        .find(
          x=>
            normalize(x)===
            normalize(model)
        );


      const cost=
        costName
          ? costs[costName]
          : null;


      total+=pieces;


      standardMinutesPes+=
        pieces*tstd.pes;


      standardMinutesPre+=
        pieces*tstd.pre;


      moneyTotal+=
        pieces*
        (
          num(cost?.pes)+
          num(cost?.pre)
        );

    }
  );


  return {

    pieces:total,

    money:moneyTotal,

    standardMinutesPes,

    standardMinutesPre

  };

}


/* ================================================================

          ""

        );

        num(

            normalize(x)===
            normalize(model)
        );


      const cost=
        costName
          ? costs[costName]
          : null;


      pieces+=quantity;


      pes+=
        quantity*
        num(cost?.pes);


      pre+=
        quantity*
        num(cost?.pre);

    }
  );


  return {

    pieces,

    pes,

    pre,

    total:
      pes+
      pre

  };

}


/* ================================================================
   EFICIENCIA
   ================================================================ */

function calculateEfficiency(){

  const plan=
    calculateTodayCapacity();


  const actual=
    getTodayActual();


  const pes=
    plan.availablePesMinutes>0

      ? (
          actual.standardMinutesPes/
          plan.availablePesMinutes
        )*100

      : 0;


  const pre=
    plan.availablePreMinutes>0

      ? (
          actual.standardMinutesPre/
          plan.availablePreMinutes
        )*100

      : 0;


  return {

    pes,

    pre,

    line:
      Math.min(
        pes,
        pre
      )

  };

}

/* ================================================================

   ================================================================ */

function refreshCapacityPanel(){

  const plan=
    calculateTodayCapacity();


  const actual=
    getTodayActual();


  const efficiency=
    calculateEfficiency();


  const destajo=
    calculateActualDestajo();


  const freePes=
    plan.availablePesMinutes-
    plan.requiredPesMinutes;


  const freePre=
    plan.availablePreMinutes-
    plan.requiredPreMinutes;


  const difference=
    plan.programmedPieces-
    plan.capacityLine;


  const projection=
    actual.pieces>0

      ? (
          destajo.total/
          actual.pieces
        )*
        Math.max(
          plan.capacityLine,
          actual.pieces
        )

      : 0;


  function put(id,value){

    const el=
      document.getElementById(id);

    if(el){

      el.textContent=value;

    }

  }


  put(
    "tsCPAvailablePes",
    numberMX(
      plan.availablePesMinutes
    )
  );


  put(
    "tsCPAvailablePre",
    numberMX(
      plan.availablePreMinutes
    )
  );


  put(
    "tsCPProgrammed",
    numberMX(
      plan.programmedPieces
    )
  );


  put(
    "tsCPTarget",
    numberMX(
      plan.capacityLine
    )
  );


  put(
    "tsCPTargetHour",
    numberMX(
      plan.targetPerHour
    )
  );


  put(
    "tsCPActual",
    numberMX(
      actual.pieces
    )
  );


  put(
    "tsCPOccupiedPes",
    numberMX(
      plan.requiredPesMinutes
    )+
    " min"
  );


  put(
    "tsCPFreePes",
    numberMX(
      Math.max(
        0,
        freePes
      )
    )+
    " min"
  );


  put(
    "tsCPOccupiedPre",
    numberMX(
      plan.requiredPreMinutes
    )+
    " min"
  );


  put(
    "tsCPFreePre",
    numberMX(
      Math.max(
        0,
        freePre
      )
    )+
    " min"
  );


  put(
    "tsCPCapPes",
    numberMX(
      plan.capacityPes
    )
  );


  put(
    "tsCPCapPre",
    numberMX(
      plan.capacityPre
    )
  );


  put(
    "tsCPLimit",
    plan.limitingProcess
  );


  put(
    "tsCPDifference",

    difference>0

      ? "+"+
        numberMX(
          difference
        )+
        " sobre capacidad"

      : numberMX(
          Math.abs(
            difference
          )
        )+
        " de margen"

  );


  put(
    "tsCPMoneyActual",
    money(
      destajo.total
    )
  );


  put(
    "tsCPMoneyPlan",
    money(
      plan.moneyTotal
    )
  );


  put(
    "tsCPMoneyProjection",
    money(
      projection
    )
  );


  put(
    "tsEffPes",
    numberMX(
      efficiency.pes
    )+
    "%"
  );


  put(
    "tsEffPre",
    numberMX(
      efficiency.pre
    )+
    "%"
  );


  put(
    "tsEffLine",
    numberMX(
      efficiency.line
    )+
    "%"
  );


  const piecesPercent=
    plan.programmedPieces>0

      ? (
          actual.pieces/
          plan.programmedPieces
        )*100

      : 0;


  put(
    "tsEffPieces",
    numberMX(
      piecesPercent
    )+
    "%"
  );


  const alert=
    document.getElementById(
      "tsCPAlert"
    );


  if(alert){

    if(
      plan.programmedPieces<=0
    ){

      alert.textContent=
        "📋 No hay programación registrada para hoy.";

    }
    else
    if(
      plan.programmedPieces>
      plan.capacityLine
    ){

      alert.textContent=
        "⚠️ PROGRAMACIÓN POR ENCIMA DE CAPACIDAD · "+
        numberMX(
          plan.programmedPieces
        )+
        " programadas contra "+
        numberMX(
          plan.capacityLine
        )+
        " de capacidad.";

    }
    else{

      alert.textContent=
        "✅ PROGRAMACIÓN DENTRO DE CAPACIDAD · "+
        numberMX(
          plan.capacityLine-
          plan.programmedPieces
        )+
        " piezas de margen.";

    }

  }

}

function saveCostFromPanel(){

  const model=
    document
    .getElementById(
      "tsCostModel"
    )
    .value
    .trim();


  if(!model){

    alert(
      "Escribe el nombre del modelo."
    );

    return;

  }


  const current=
    normalizeCostObject(
      readJSON(
        KCOST,
        {}
      )
    );


  const existing=
    Object.keys(current)
    .find(
      x=>
        normalize(x)===
        normalize(model)
    );


  if(
    existing &&
    existing!==model
  ){

    delete current[existing];

  }


  current[model]={

    pes:num(
      document
      .getElementById(
        "tsCostPes"
      )
      .value
    ),

    pre:num(
      document
      .getElementById(
        "tsCostPre"
      )
      .value
    ),

    min:num(
      current[model]?.min
    ),

    tstdPes:num(
      document
      .getElementById(
        "tsCostTstdPes"
      )
      .value
    ),

    tstdPre:num(
      document
      .getElementById(
        "tsCostTstdPre"
      )
      .value
    )

  };


  saveJSON(
    KCOST,
    current
  );


  saveJSON(
    "ts_costos_v1",
    Object.keys(current).map(
      x=>({

        modelo:x,

        pespunte:
          num(current[x].pes),

        preliminar:
          num(current[x].pre),

        min:
          num(current[x].min),

        tstdPes:
          num(current[x].tstdPes),

        tstdPre:
          num(current[x].tstdPre)

      })
    )
  );


  renderCostRepair();

  refreshCapacityPanel();

  refreshTodayDetails();

}


/* ================================================================
   RESUMEN SEMANAL
   ================================================================ */

function calculateWeek(reference){

  const prod=
    getProduction();


  const advances=
    getAdvances();


  const range=
    weekRange(reference);


  const programmed=
    prod.filter(
      item=>
        inWeek(
          item.fecha ??
          item.date,
          reference
        )
    );


  const programado=
    programmed.reduce(
      (
        total,
        item
      )=>

        total+
        num(
          item.programado ??
          item.cantidadProgramada ??
          item.cantidad ??
          item.piezas
        ),

      0
    );


  const empaqueRecords=
    advances.filter(
      item=>{

        const date=
          item.fecha ??
          item.fechaHora ??
          item.date;


        if(
          !inWeek(
            date,
            reference
          )
        ){

          return false;

        }


        return normalize(

          item.siguienteProceso ??

          item.procesoNuevo ??

          item.procesoDestino ??

          item.destino ??

          ""

        )==="empaque";

      }
    );


  const auditoriaRecords=
    advances.filter(
      item=>{

        const date=
          item.fecha ??
          item.fechaHora ??
          item.date;


        if(
          !inWeek(
            date,
            reference
          )
        ){

          return false;

        }


        return normalize(

          item.siguienteProceso ??

          item.procesoNuevo ??

          item.procesoDestino ??

          item.destino ??

          ""

        )==="auditoria";

      }
    );


  const empaque=
    empaqueRecords.reduce(
      (
        total,
        item
      )=>

        total+
        num(
          item.piezas ??
          item.cantidad ??
          item.qty
        ),

      0
    );


  const auditoria=
    auditoriaRecords.reduce(
      (
        total,
        item
      )=>

        total+
        num(
          item.piezas ??
          item.cantidad ??
          item.qty
        ),

      0
    );


  const ots=
    new Set();


  empaqueRecords.forEach(
    item=>{

      if(
        item.ot!==undefined &&
        item.ot!==null &&
        String(item.ot).trim()
      ){

        ots.add(
          String(
            item.ot
          ).trim()
        );

      }

    }
  );


  return {

    start:range.start,

    end:range.end,

    programado,

    empaque,

    auditoria,

    otsEmpaque:
      ots.size

  };

}

/* ================================================================
   OBSERVER SEGURO
   ================================================================ */

function installObserver(){

  if(
    window.__TS_OBSERVER__
  ){
    return;
  }


  let scheduled=false;


  window.__TS_OBSERVER__=
    new MutationObserver(
      mutations=>{

        if(scheduled){
          return;
        }


        let relevant=false;


        for(
          const mutation
          of mutations
        ){

          if(
            mutation.type!=="childList"
          ){
            continue;
          }


          for(
            const node
            of mutation.addedNodes
          ){

            if(
              node.nodeType!==1
            ){
              continue;
            }


            if(
              node.id==="tsCapacityPanel" ||
              node.id==="tsTodayDetails" ||
              node.id==="tsCostRepair"
            ){
              continue;
            }


            relevant=true;

          }

        }


        if(!relevant){
          return;
        }


        scheduled=true;


        setTimeout(
          ()=>{

            scheduled=false;

            refreshStudio();

          },
          200
        );

      }
    );


  window.__TS_OBSERVER__.observe(
    document.body,
    {
      childList:true,
      subtree:true
    }
  );

}
