   ================================================================ */

try{

  /*
  ================================================================
  CLAVES PRINCIPALES
  NO CAMBIAR
  ================================================================
  */

  const KPROD = "theStudioProduccion_v4";
  const KCOST = "theStudioCostos_v4";
  const KHIST = "theStudioHistorial_v4";
  const KADV  = "theStudioAvances_v4";


  /*
  ================================================================
  RECUPERAMOS LOS COSTOS
  ANTES DE CARGAR LA APP
  ================================================================
  */

  migrateAllCosts();


  const ORIGINAL_URL =
    "https://raw.githubusercontent.com/dantedeaht-ctrl/the-studio-produccion/f07dc9e5221a9b207d205d143d68c0b917ee0e0e/index.html";


  const response =
    await fetch(
      ORIGINAL_URL,
      {
        cache:"no-store"
      }
    );


  const src =
    await response.text();


  const m =
    src.match(
      /const b="([^"]+)"/
    );


  if(!m){

    throw new Error(
      "No se encontró la versión base de The Studio"
    );

  }


  const a =
    Uint8Array.from(
      atob(m[1]),
      c=>c.charCodeAt(0)
    );


  const ds =
    new DecompressionStream("gzip");


  const t =
    await new Response(
      new Response(a)
      .body
      .pipeThrough(ds)
    ).text();


  document.open();

  document.write(t);

  document.close();


  /*
  ================================================================
  DESPUÉS DE CARGAR LA APP
  ================================================================
  */

  setTimeout(()=>{

    try{

      migrateAllCosts();

      fixResponsive();

      installBMWTheme();

      installCostRepair();

      installWeekRepair();

      installDestajo();

      refreshStudio();


      if(
        !window.__TS_OBSERVER__
      ){

        window.__TS_OBSERVER__ =
          new MutationObserver(
            ()=>{
              refreshStudio();
            }
          );


        window.__TS_OBSERVER__.observe(
          document.body,
          {
            childList:true,
            subtree:true
          }
        );

      }


    }catch(e){

      console.error(
        "The Studio patch:",
        e
      );

    }

  },150);


}catch(e){

  document.body.innerHTML =
    '<div style="font:18px system-ui;padding:30px">'+
    'Error al cargar The Studio<br>'+
    '<small>'+
    String(e)+
    '</small>'+
    '</div>';

}

})();


/* ================================================================
   UTILIDADES
   ================================================================ */

function readJSON(key,fallback){

  try{

    const value =
      localStorage.getItem(key);

    if(
      value===null ||
      value===undefined ||
      value===""
    ){

      return fallback;

    }


    return JSON.parse(value);

  }catch{

    return fallback;

  }

}


function saveJSON(key,value){

  localStorage.setItem(
    key,
    JSON.stringify(value)
  );

}


function num(value){

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : 0;

}


function money(value){

  return new Intl.NumberFormat(
    "es-MX",
    {
      style:"currency",
      currency:"MXN",
      minimumFractionDigits:2
    }
  ).format(
    num(value)
  );

}


function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      m=>({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      }[m])
    );

}


function normalize(value){

  return String(
    value ?? ""
  )
  .normalize("NFD")
  .replace(
    /[\u0300-\u036f]/g,
    ""
  )
  .trim()
  .toLowerCase();

}


/* ================================================================
   FECHAS
   ================================================================ */

function localDateString(date){

  const d =
    date instanceof Date
      ? new Date(date)
      : new Date(String(date)+"T12:00:00");


  if(
    Number.isNaN(d.getTime())
  ){

    return "";

  }


  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");

}


function todayLocal(){

  return localDateString(
    new Date()
  );

}


function mondayOf(date){

  const d =
    new Date(
      String(date)+"T12:00:00"
    );


  if(
    Number.isNaN(d.getTime())
  ){

    return todayLocal();

  }


  const day =
    d.getDay();


  const diff =
    day===0
      ? -6
      : 1-day;


  d.setDate(
    d.getDate()+diff
  );


  return localDateString(d);

}


function addDays(date,n){

  const d =
    new Date(
      String(date)+"T12:00:00"
    );


  d.setDate(
    d.getDate()+n
  );


  return localDateString(d);

}


function weekRange(reference){

  const start =
    mondayOf(reference);


  return {

    start:start,

    end:addDays(start,5)

  };

}


function inWeek(date,reference){

  const d =
    localDateString(date);


  const r =
    weekRange(reference);


  return (
    d>=r.start &&
    d<=r.end
  );

}

/* ================================================================
   COSTOS
   ================================================================ */

function normalizeCostObject(raw){

  const result = {};


  /*
  ------------------------------------------------
  FORMATO NUEVO
  cost = {
    Verona:{
      pes:12.50,
      pre:8
    }
  }
  ------------------------------------------------
  */

  if(
    raw &&
    !Array.isArray(raw) &&
    typeof raw==="object"
  ){

    if(
      raw.cost &&
      typeof raw.cost==="object"
    ){

      raw =
        raw.cost;

    }

  }


  if(
    raw &&
    !Array.isArray(raw) &&
    typeof raw==="object"
  ){

    Object.keys(raw)
    .forEach(model=>{

      const item =
        raw[model];


      if(
        item &&
        typeof item==="object"
      ){

        result[model] = {

          pes:
            num(
              item.pes ??
              item.pespunte ??
              item.pesPunte ??
              item.costoPespunte
            ),

          pre:
            num(
              item.pre ??
              item.preliminar ??
              item.costoPreliminar
            ),

          min:
            num(
              item.min ??
              item.minutos
            )

        };

      }else{

        result[model] = {

          pes:num(item),

          pre:0,

          min:0

        };

      }

    });


    return result;

  }


  /*
  ------------------------------------------------
  FORMATO ANTIGUO EN ARRAY
  ------------------------------------------------
  */

  if(
    Array.isArray(raw)
  ){

    raw.forEach(item=>{

      if(!item)
        return;


      const model =
        String(
          item.modelo ??
          item.model ??
          item.nombre ??
          item.name ??
          ""
        ).trim();


      if(!model)
        return;


      result[model] = {

        pes:
          num(
            item.pes ??
            item.pespunte ??
            item.pesPunte ??
            item.costoPespunte
          ),

        pre:
          num(
            item.pre ??
            item.preliminar ??
            item.costoPreliminar
          ),

        min:
          num(
            item.min ??
            item.minutos
          )

      };

    });

  }


  return result;

}


/* ================================================================
   RECUPERACIÓN COMPLETA DE COSTOS
   ÚNICO BLOQUE MODIFICADO
   ================================================================ */

function migrateAllCosts(){

  try{

    const MAIN =
      "theStudioCostos_v4";


    /*
    --------------------------------------------------------------
    LEEMOS PRIMERO LOS COSTOS ACTUALES
    --------------------------------------------------------------
    */

    let main =
      normalizeCostObject(
        readJSON(
          MAIN,
          null
        )
      );


    /*
    --------------------------------------------------------------
    CLAVES ANTIGUAS CONOCIDAS
    --------------------------------------------------------------
    */

    const OLD_KEYS = [

      "ts_costos_v1",

      "theStudioCostos_v1",

      "theStudioCostos_v2",

      "theStudioCostos_v3",

      "theStudioCostos",

      "costos",

      "modelos",

      "catalogoModelos",

      "catalogoCostos"

    ];


    /*
    --------------------------------------------------------------
    AGREGA UN MODELO SIN BORRAR COSTOS EXISTENTES
    --------------------------------------------------------------
    */

    function mergeModel(
      model,
      incoming
    ){

      const cleanModel =
        String(
          model ?? ""
        ).trim();


      if(!cleanModel)
        return;


      const existingName =
        Object.keys(main)
        .find(
          x=>
            normalize(x) ===
            normalize(cleanModel)
        );


      const name =
        existingName ||
        cleanModel;


      if(!main[name]){

        main[name] = {

          pes:
            num(
              incoming?.pes
            ),

          pre:
            num(
              incoming?.pre
            ),

          min:
            num(
              incoming?.min
            )

        };

        return;

      }


      /*
      ------------------------------------------------------------
      SOLO RECUPERAMOS CAMPOS VACÍOS
      ------------------------------------------------------------
      */

      if(
        !num(main[name].pes) &&
        num(incoming?.pes)
      ){

        main[name].pes =
          num(incoming.pes);

      }


      if(
        !num(main[name].pre) &&
        num(incoming?.pre)
      ){

        main[name].pre =
          num(incoming.pre);

      }


      if(
        !num(main[name].min) &&
        num(incoming?.min)
      ){

        main[name].min =
          num(incoming.min);

      }

    }


    /*
    --------------------------------------------------------------
    EXTRAER UN REGISTRO DE COSTO
    --------------------------------------------------------------
    */

    function extractItem(item){

      if(
        !item ||
        typeof item!=="object"
      ){

        return null;

      }


      const model =
        String(
          item.modelo ??
          item.model ??
          item.nombre ??
          item.name ??
          ""
        ).trim();


      if(!model)
        return null;


      const pes =
        num(
          item.pes ??
          item.pespunte ??
          item.pesPunte ??
          item.costoPespunte ??
          item.costo_pespunte ??
          item.precioPespunte ??
          item.precio_pespunte ??
          item.pesCost
        );


      const pre =
        num(
          item.pre ??
          item.preliminar ??
          item.costoPreliminar ??
          item.costo_preliminar ??
          item.precioPreliminar ??
          item.precio_preliminar ??
          item.preCost
        );


      const min =
        num(
          item.min ??
          item.minutos
        );


      if(
        pes===0 &&
        pre===0 &&
        min===0
      ){

        return null;

      }


      return {

        model:model,

        pes:pes,

        pre:pre,

        min:min

      };

    }


    /*
    --------------------------------------------------------------
    LEER UNA FUENTE DE COSTOS
    --------------------------------------------------------------
    */

    function readCostSource(raw){

      if(!raw)
        return;


      /*
      ARRAY
      */

      if(
        Array.isArray(raw)
      ){

        raw.forEach(
          item=>{

            const found =
              extractItem(item);


            if(found){

              mergeModel(
                found.model,
                found
              );

            }

          }
        );

        return;

      }


      /*
      OBJETO
      */

      if(
        typeof raw!=="object"
      ){

        return;

      }


      /*
      Estructuras anidadas conocidas.
      */

      [
        raw.costos,
        raw.modelos,
        raw.cost,
        raw.catalogo,
        raw.data
      ]
      .forEach(
        source=>{

          if(
            source &&
            source!==raw
          ){

            readCostSource(
              source
            );

          }

        }
      );


      /*
      ------------------------------------------------------------
      FORMATO MAPA:

      {
        Verona:{
          pes:12.50,
          pre:8
        }
      }
      ------------------------------------------------------------
      */

      Object.keys(raw)
      .forEach(
        key=>{

          if(
            [
              "costos",
              "modelos",
              "cost",
              "catalogo",
              "data"
            ]
            .includes(
              key
            )
          ){

            return;

          }


          const value =
            raw[key];


          if(
            !value ||
            typeof value!=="object" ||
            Array.isArray(value)
          ){

            return;

          }


          const pes =
            num(
              value.pes ??
              value.pespunte ??
              value.pesPunte ??
              value.costoPespunte ??
              value.costo_pespunte ??
              value.precioPespunte ??
              value.precio_pespunte
            );


          const pre =
            num(
              value.pre ??
              value.preliminar ??
              value.costoPreliminar ??
              value.costo_preliminar ??
              value.precioPreliminar ??
              value.precio_preliminar
            );


          const min =
            num(
              value.min ??
              value.minutos
            );


          if(
            pes===0 &&
            pre===0 &&
            min===0
          ){

            return;

          }


          mergeModel(
            key,
            {
              pes:pes,
              pre:pre,
              min:min
            }
          );

        }
      );

    }


    /*
    --------------------------------------------------------------
    REVISAMOS LAS CLAVES ANTIGUAS
    --------------------------------------------------------------
    */

    OLD_KEYS.forEach(
      key=>{

        const raw =
          readJSON(
            key,
            null
          );


        readCostSource(
          raw
        );

      }
    );


    /*
    --------------------------------------------------------------
    BUSCAMOS TAMBIÉN EN OTRAS CLAVES DE localStorage
    --------------------------------------------------------------
    */

    for(
      let i=0;
      i<localStorage.length;
      i++
    ){

      const key =
        localStorage.key(i);


      if(!key)
        continue;


      if(
        OLD_KEYS.includes(key) ||
        key===MAIN
      ){

        continue;

      }


      let raw =
        null;


      try{

        raw =
          JSON.parse(
            localStorage.getItem(key)
          );

      }catch{

        continue;

      }


      /*
      Revisamos arrays que tengan
      modelo + algún costo.
      */

      if(
        Array.isArray(raw)
      ){

        const possible =
          raw.some(
            item=>{

              if(
                !item ||
                typeof item!=="object"
              ){

                return false;

              }


              const hasModel =
                item.modelo!==undefined ||
                item.model!==undefined ||
                item.nombre!==undefined ||
                item.name!==undefined;


              const hasCost =
                item.pes!==undefined ||
                item.pespunte!==undefined ||
                item.pesPunte!==undefined ||
                item.costoPespunte!==undefined ||
                item.pre!==undefined ||
                item.preliminar!==undefined ||
                item.costoPreliminar!==undefined;


              return (
                hasModel &&
                hasCost
              );

            }
          );


        if(possible){

          readCostSource(
            raw
          );

        }

      }
      else
      if(
        raw &&
        typeof raw==="object"
      ){

        const text =
          JSON.stringify(
            raw
          ).toLowerCase();


        if(
          text.includes("pespunte") ||
          text.includes("preliminar") ||
          text.includes("costopespunte") ||
          text.includes("costopreliminar")
        ){

          readCostSource(
            raw
          );

        }

      }

    }


    /*
    --------------------------------------------------------------
    GUARDAMOS LOS COSTOS RECUPERADOS
    --------------------------------------------------------------
    */

    saveJSON(
      MAIN,
      main
    );


    /*
    --------------------------------------------------------------
    ESPEJO DEL MÓDULO DE DESTAJO
    --------------------------------------------------------------
    */

    const mirror =
      Object.keys(main)
      .map(
        model=>({

          modelo:model,

          pespunte:
            num(
              main[model].pes
            ),

          preliminar:
            num(
              main[model].pre
            ),

          min:
            num(
              main[model].min
            )

        })
      );


    saveJSON(
      "ts_costos_v1",
      mirror
    );


    console.log(
      "The Studio · Costos recuperados:",
      Object.keys(main)
    );


    return main;


  }catch(e){

    console.error(
      "Error recuperando costos:",
      e
    );


    /*
    En caso de error NO borramos nada.
    */

    return normalizeCostObject(
      readJSON(
        "theStudioCostos_v4",
        {}
      )
    );

  }

}

/* ================================================================
   OBTENER FECHA DE REFERENCIA
   ================================================================ */

function getReferenceDate(){

  const inputs =
    [
      ...document.querySelectorAll(
        'input[type="date"]'
      )
    ];


  for(
    const input of inputs
  ){

    const parent =
      input.parentElement;


    const text =
      normalize(
        parent?.textContent
      );


    if(
      text.includes(
        "fecha de referencia"
      )
    ){

      if(input.value)
        return input.value;

    }

  }


  for(
    const input of inputs
  ){

    if(
      input.closest("#tsDestajo")
    )
      continue;


    if(
      input.offsetParent!==null &&
      input.value
    ){

      return input.value;

    }

  }


  return todayLocal();

}


/* ================================================================
   SEMANA CORRECTA
   ================================================================ */

function calculateWeek(reference){

  const prod =
    getProduction();


  const advances =
    getAdvances();


  const range =
    weekRange(reference);


  const programmed =
    prod.filter(
      item=>
        inWeek(
          item.fecha,
          reference
        )
    );


  const programado =
    programmed.reduce(
      (total,item)=>
        total+
        num(
          item.programado
        ),
      0
    );


  const empaqueRecords =
    advances.filter(item=>{

      const date =
        item.fecha ??
        item.fechaHora;


      if(
        !inWeek(
          date,
          reference
        )
      ){

        return false;

      }


      return normalize(
        item.siguienteProceso ??
        item.procesoNuevo ??
        item.procesoDestino ??
        item.destino ??
        ""
      ) ===
      "empaque";

    });


  const empaque =
    empaqueRecords.reduce(
      (total,item)=>
        total+
        num(
          item.piezas ??
          item.cantidad ??
          item.qty
        ),
      0
    );


  const auditoriaRecords =
    advances.filter(item=>{

      const date =
        item.fecha ??
        item.fechaHora;


      if(
        !inWeek(
          date,
          reference
        )
      ){

        return false;

      }


      return normalize(
        item.siguienteProceso ??
        item.procesoNuevo ??
        item.procesoDestino ??
        item.destino ??
        ""
      ) ===
      "auditoria";

    });


  const auditoria =
    auditoriaRecords.reduce(
      (total,item)=>
        total+
        num(
          item.piezas ??
          item.cantidad ??
          item.qty
        ),
      0
    );


  const ots =
    new Set();


  empaqueRecords.forEach(
    item=>{

      if(
        item.ot!==undefined &&
        item.ot!==null &&
        String(item.ot).trim()
      ){

        ots.add(
          String(item.ot).trim()
        );

      }

    }
  );


  return {

    start:range.start,

    end:range.end,

    programado,

    empaque,

    auditoria,

    otsEmpaque:ots.size,

    programmedRecords:programmed,

    empaqueRecords,

    auditoriaRecords

  };

}


/* ================================================================
   CAMBIAR NÚMEROS DEL DASHBOARD
   ================================================================ */

function setDashboardMetric(
  label,
  value
){

  const target =
    normalize(label);


  const leaves =
    [
      ...document.querySelectorAll(
        "body *"
      )
    ].filter(
      el=>
        el.children.length===0 &&
        normalize(el.textContent)===target &&
        el.offsetParent!==null
    );


  for(
    const labelEl of leaves
  ){

    let box =
      labelEl.parentElement;


    for(
      let level=0;
      level<5 && box;
      level++,
      box=box.parentElement
    ){

      const candidates =
        [
          ...box.querySelectorAll(
            "strong,b,h1,h2,h3,h4,h5,.value,.number,.num,.stat-value"
          )
        ]
        .filter(
          el=>
            el!==labelEl &&
            el.offsetParent!==null &&
            /\d/.test(
              el.textContent
            )
        );


      if(
        candidates.length
      ){

        candidates.sort(
          (a,b)=>
            a.textContent.length-
            b.textContent.length
        );


        candidates[0].textContent =
          new Intl.NumberFormat(
            "es-MX"
          ).format(
            value
          );


        return true;

      }

    }

  }


  return false;

}


/* ================================================================
   REFRESCAR DASHBOARD
   ================================================================ */

function refreshStudio(){

  try{

    const reference =
      getReferenceDate();


    const data =
      calculateWeek(
        reference
      );


    setDashboardMetric(
      "Programado",
      data.programado
    );


    setDashboardMetric(
      "Empaque para nómina",
      data.empaque
    );


    setDashboardMetric(
      "Auditoría",
      data.auditoria
    );


    setDashboardMetric(
      "OTs con Empaque",
      data.otsEmpaque
    );


    installWeekListeners();

    installCostRepair();


  }catch(e){

    console.error(
      "refreshStudio:",
      e
    );

  }

}


/* ================================================================
   EVENTOS DE SEMANA
   ================================================================ */

function installWeekListeners(){

  if(
    window.__TS_WEEK_LISTENERS__
  ){

    return;

  }


  window.__TS_WEEK_LISTENERS__ =
    true;


  document.addEventListener(
    "change",
    event=>{

      const el =
        event.target;


      if(
        el.matches(
          'input[type="date"]'
        )
      ){

        setTimeout(
          refreshStudio,
          80
        );

      }

    }
  );


  document.addEventListener(
    "click",
    event=>{

      const button =
        event.target.closest(
          "button"
        );


      if(!button)
        return;


      const text =
        normalize(
          button.textContent
        );


      if(
        text==="actualizar" ||
        text.includes(
          "actualizar"
        )
      ){

        setTimeout(
          refreshStudio,
          120
        );

      }

    }
  );

}

   ================================================================ */

function installCostRepair(){

  const existing =
    document.getElementById(
      "tsCostRepair"
    );


  const costs =
    migrateAllCosts();


  if(existing){

    renderCostRepair(
      existing,
      costs
    );

    return;

  }


  const heading =
    [
      ...document.querySelectorAll(
        "body *"
      )
    ].find(
      el=>
        el.children.length===0 &&
        normalize(
          el.textContent
        )==="catalogo de modelos" &&
        el.offsetParent!==null
    );


  if(!heading)
    return;


  let container =
    heading.parentElement;


  for(
    let i=0;
    i<4 &&
    container &&
    container.parentElement;
    i++
  ){

    if(
      container.parentElement
    ){

      container =
        container.parentElement;

    }

  }


  const panel =
    document.createElement(
      "section"
    );


  panel.id =
    "tsCostRepair";


  panel.style.cssText = `

    margin:18px 0;

    padding:18px;

      );

    color:#eef4fb;

      0 12px 35px #0005;

  `;


  container.insertBefore(
    panel,
    container.firstChild
  );


  renderCostRepair(
    panel,
    costs
  );

}

          preliminar:

              current[name].min

        }));


      saveJSON(
        "ts_costos_v1",
        mirror
      );

        window.dispatchEvent(
          new StorageEvent(
            "storage",
            {
              key:
                "theStudioCostos_v4",

              newValue:
                JSON.stringify(
                  current
                ),

              storageArea:
                localStorage
            }
          )
        );

      }catch{}


      renderCostRepair(
        panel,
        current
      );

        document
        .querySelectorAll(
          ".tsTab"
        )
        .forEach(
          x=>
            x.classList.remove(
              "on"
            )
        );


        tab.classList.add(
          "on"
        );


        document
        .querySelectorAll(
          ".tsPane"
        )
        .forEach(
          x=>
            x.classList.remove(
              "on"
            )
        );


        const pane = {

          cap:"Cap",

          cost:"Cost",

          res:"Res"

        }[
          tab.dataset.tab
        ];


        document
        .getElementById(
          "ts"+pane
        )
        .classList.add(
          "on"
        );


        renderAll();

      };

    }
  );


  function modelOptions(){

    return costsArray()
      .map(c=>`

        <option
          value="${esc(c.modelo)}"
        >

          ${esc(c.modelo)}

          · P
          ${money(c.pespunte)}

          · Pre
          ${money(c.preliminar)}

        </option>

      `)
      .join("");

  }


  /* ==============================================================
     CAPTURA
     ============================================================== */

  function renderCap(){

    const c =
      costsArray();


    document
    .getElementById(
      "tsCap"
    )
    .innerHTML = `

      <div class="tsCard">

        <b>
          Registrar producción
        </b>


        <div class="tsMuted">

          El destajo se calcula con
          piezas capturadas como salida.

          Semana:
          lunes a sábado.

        </div>


        <div
          class="tsGrid"
          style="margin-top:10px"
        >

          <div class="tsField">

            <label>
              Fecha
            </label>

            <input
              id="tsDate"
              type="date"
              value="${todayLocal()}"
            >

          </div>


          <div class="tsField">

            <label>
              Línea
            </label>

            <select id="tsLine">

              <option>
                Línea A
              </option>

              <option>
                Línea B
              </option>

            </select>

          </div>


          <div class="tsField">

            <label>
              Modelo
            </label>

            <select id="tsModel">

              ${
                modelOptions()
                ||
                '<option value="">Primero agrega un modelo</option>'
              }

            </select>

          </div>


          <div class="tsField">

            <label>
              Piezas salidas
            </label>

            <input
              id="tsPairs"
              type="number"
              min="0"
              step="1"
              placeholder="0"
            >

          </div>

        </div>


        <div
          class="tsGrid3"
          style="margin-top:10px"
        >

          <div class="tsKpi">

            <small>
              Pespunte/pieza
            </small>

            <b id="tsCP">
              $0.00
            </b>

          </div>


          <div class="tsKpi">

            <small>
              Preliminar/pieza
            </small>

            <b id="tsCR">
              $0.00
            </b>

          </div>


          <div class="tsKpi">

            <small>
              Destajo registro
            </small>

            <b id="tsCT">
              $0.00
            </b>

          </div>

        </div>


        <div
          style="
            display:flex;
            gap:8px;
            margin-top:10px;
          "
        >

          <button
            class="tsBtn"
            id="tsAdd"
          >
            Agregar
          </button>


          <button
            class="tsBtn alt"
            id="tsClear"
          >
            Limpiar
          </button>

        </div>

      </div>


      <div class="tsCard">

        <b>
          Registros recientes
        </b>

        <div id="tsRecent">
        </div>

      </div>

    `;


    const update=()=>{

      const model =
        c.find(
          x=>
            x.modelo ===
            document
            .getElementById(
              "tsModel"
            )
            ?.value
        );


      const pieces =
        num(
          document
          .getElementById(
            "tsPairs"
          )
          ?.value
        );


      document
      .getElementById(
        "tsCP"
      )
      .textContent =
        money(
          model?.pespunte
        );


      document
      .getElementById(
        "tsCR"
      )
      .textContent =
        money(
          model?.preliminar
        );


      document
      .getElementById(
        "tsCT"
      )
      .textContent =
        money(
          pieces*
          (
            num(model?.pespunte)+
            num(model?.preliminar)
          )
        );

    };


    document
    .getElementById(
      "tsModel"
    )
    ?.addEventListener(
      "change",
      update
    );


    document
    .getElementById(
      "tsPairs"
    )
    ?.addEventListener(
      "input",
      update
    );


    update();


    document
    .getElementById(
      "tsAdd"
    )
    ?.addEventListener(
      "click",
      ()=>{

        const model =
          c.find(
            x=>
              x.modelo ===
              document
              .getElementById(
                "tsModel"
              )
              .value
          );


        const pieces =
          num(
            document
            .getElementById(
              "tsPairs"
            )
            .value
          );


        if(
          !model ||
          pieces<=0
        ){

          alert(
            "Selecciona un modelo y captura las piezas salidas."
          );

          return;

        }


        const r =
          records();


        r.push({

          id:
            Date.now(),

          date:
            document
            .getElementById(
              "tsDate"
            )
            .value,

          line:
            document
            .getElementById(
              "tsLine"
            )
            .value,

          modelo:
            model.modelo,

          piezas:
            pieces,

          pares:
            pieces,

          pespunte:
            num(
              model.pespunte
            ),

          preliminar:
            num(
              model.preliminar
            )

        });


        save(
          KEYR,
          r
        );


        renderAll();

      }
    );


    document
    .getElementById(
      "tsClear"
    )
    ?.addEventListener(
      "click",
      ()=>{

        document
        .getElementById(
          "tsPairs"
        )
        .value =
          "";

        update();

      }
    );


    const rr =
      records()
      .slice(-12)
      .reverse();


    document
    .getElementById(
      "tsRecent"
    )
    .innerHTML =

      rr.length

      ?

      `

      <table class="tsTable">

        <tr>

          <th>
            Fecha
          </th>

          <th>
            Línea
          </th>

          <th>
            Modelo
          </th>

          <th class="tsRight">
            Piezas
          </th>

          <th class="tsRight">
            Destajo
          </th>

        </tr>


        ${
          rr.map(
            r=>`

              <tr>

                <td>
                  ${esc(r.date)}
                </td>

                <td>
                  ${esc(
                    String(
                      r.line || ""
                    )
                    .replace(
                      "Línea ",
                      ""
                    )
                  )}
                </td>

                <td>
                  ${esc(r.modelo)}
                </td>

                <td class="tsRight">
                  ${num(
                    r.piezas ??
                    r.pares
                  )}
                </td>

                <td class="tsRight">

                  ${money(
                    num(
                      r.piezas ??
                      r.pares
                    )*
                    (
                      num(r.pespunte)+
                      num(r.preliminar)
                    )
                  )}

                </td>

              </tr>

            `
          ).join("")
        }

      </table>

      `

      :

      `

      <div
        class="tsMuted"
        style="padding:10px 0"
      >

        Aún no hay registros.

      </div>

      `;

  }


  /* ==============================================================
     COSTOS DESTAJO
     ============================================================== */

  function renderCost(){

    const c =
      costsArray();


    document
    .getElementById(
      "tsCost"
    )
    .innerHTML = `

      <div class="tsCard">

        <b>
          Catálogo de costos
        </b>


        <div class="tsMuted">

          Los costos se guardan en
          theStudioCostos_v4.

          Puedes editarlos cuando cambien.

        </div>


        <div
          class="tsGrid3"
          style="margin-top:10px"
        >

          <div class="tsField">

            <label>
              Modelo
            </label>

            <input
              id="tsNewM"
              placeholder="Verona"
            >

          </div>


          <div class="tsField">

            <label>
              Costo pespunte $
            </label>

            <input
              id="tsNewP"
              type="number"
              min="0"
              step="0.01"
              placeholder="12.50"
            >

          </div>


          <div class="tsField">

            <label>
              Costo preliminar $
            </label>

            <input
              id="tsNewR"
              type="number"
              min="0"
              step="0.01"
              placeholder="0.00"
            >

          </div>

        </div>


        <button
          class="tsBtn"
          id="tsSaveC"
          style="margin-top:10px"
        >

          Guardar / actualizar modelo

        </button>

      </div>


      <div class="tsCard">

        ${
          c.length

          ?

          `

          <table class="tsTable">

            <tr>

              <th>
                Modelo
              </th>

              <th class="tsRight">
                Pespunte
              </th>

              <th class="tsRight">
                Preliminar
              </th>

              <th>
                Acción
              </th>

            </tr>


            ${
              c.map(
                x=>`

                  <tr>

                    <td>
                      ${esc(x.modelo)}
                    </td>

                    <td class="tsRight">
                      ${money(
                        x.pespunte
                      )}
                    </td>

                    <td class="tsRight">
                      ${money(
                        x.preliminar
                      )}
                    </td>

                    <td>

                      <button
                        class="tsBtn alt tsDestEdit"
                        data-model="${esc(x.modelo)}"
                      >
                        ✏️
                      </button>

                    </td>

                  </tr>

                `
              ).join("")
            }

          </table>

          `

          :

          `

          <div class="tsMuted">

            No hay modelos capturados.

          </div>

          `

        }

      </div>

    `;


    document
    .getElementById(
      "tsSaveC"
    )
    ?.addEventListener(
      "click",
      ()=>{

        const model =
          document
          .getElementById(
            "tsNewM"
          )
          .value
          .trim();


        if(!model){

          alert(
            "Escribe el modelo."
          );

          return;

        }


        const p =
          num(
            document
            .getElementById(
              "tsNewP"
            )
            .value
          );


        const r =
          num(
            document
            .getElementById(
              "tsNewR"
            )
            .value
          );


        const arr =
          normalizeCostObject(
            readJSON(
              KEYC,
              {}
            )
          );


        const existing =
          Object.keys(arr)
          .find(
            x=>
              normalize(x)===
              normalize(model)
          );


        if(
          existing &&
          existing!==model
        ){

          delete arr[
            existing
          ];

        }


        const old =
          arr[model];


        arr[model] = {

          pes:p,

          pre:r,

          min:
            num(
              old?.min
            )

        };


        saveJSON(
          KEYC,
          arr
        );


        saveJSON(
          "ts_costos_v1",
          Object.keys(arr)
          .map(x=>({

            modelo:x,

            pespunte:
              num(arr[x].pes),

            preliminar:
              num(arr[x].pre),

            min:
              num(arr[x].min)

          }))
        );


        renderAll();


        setTimeout(
          installCostRepair,
          50
        );

      }
    );


    document
    .querySelectorAll(
      ".tsDestEdit"
    )
    .forEach(
      button=>{

        button.onclick=()=>{

          const model =
            button.dataset.model;


          const item =
            c.find(
              x=>
                x.modelo===model
            );


          if(!item)
            return;


          document
          .getElementById(
            "tsNewM"
          )
          .value =
            item.modelo;


          document
          .getElementById(
            "tsNewP"
          )
          .value =
            num(
              item.pespunte
            );


          document
          .getElementById(
            "tsNewR"
          )
          .value =
            num(
              item.preliminar
            );


          document
          .getElementById(
            "tsNewM"
          )
          .focus();

        };

      }
    );

  }


  /* ==============================================================
     RESUMEN DESTAJO
     ============================================================== */

  function renderRes(){

    const start =
      mondayOf(
        todayLocal()
      );


    const end =
      addDays(
        start,
        5
      );


    const rr =
      records()
      .filter(
        r=>
          r.date>=start &&
          r.date<=end
      );


    const sum =
      arr=>
        arr.reduce(
          (a,r)=>
            a+
            num(
              r.piezas ??
              r.pares
            ),
          0
        );


    const calc =
      (arr,key)=>
        arr.reduce(
          (a,r)=>
            a+
            num(
              r.piezas ??
              r.pares
            )*
            num(
              r[key]
            ),
          0
        );


    const A =
      rr.filter(
        r=>
          r.line===
          "Línea A"
      );


    const B =
      rr.filter(
        r=>
          r.line===
          "Línea B"
      );


    const pA =
      calc(
        A,
        "pespunte"
      );


    const pB =
      calc(
        B,
        "pespunte"
      );


    const rA =
      calc(
        A,
        "preliminar"
      );


    const rB =
      calc(
        B,
        "preliminar"
      );


    const total =
      pA+pB+rA+rB;


    document
    .getElementById(
      "tsRes"
    )
    .innerHTML = `

      <div class="tsCard">

        <b>
          Semana de nómina
        </b>


        <div class="tsMuted">

          ${start}
          →
          ${end}

          · cierre el sábado

        </div>


        <div
          class="tsKpis"
          style="margin-top:10px"
        >

          <div class="tsKpi">

            <small>
              Línea A · destajo
            </small>

            <div class="tsMoney">

              ${money(
                pA+rA
              )}

            </div>

          </div>


          <div class="tsKpi">

            <small>
              Línea B · destajo
            </small>

            <div class="tsMoney">

              ${money(
                pB+rB
              )}

            </div>

          </div>


          <div class="tsKpi">

            <small>
              Acumulado semanal
            </small>

            <div class="tsMoney">

              ${money(
                total
              )}

            </div>

          </div>

        </div>

      </div>


      <div class="tsCard">

        <b>
          Desglose por línea
        </b>


        <div class="tsLine">

          <span>

            Línea A ·
            ${sum(A)}
            piezas

          </span>


          <span>

            <b>
              Pespunte
              ${money(pA)}
            </b>

            · Preliminar
            ${money(rA)}

          </span>

        </div>


        <div class="tsLine">

          <span>

            Línea B ·
            ${sum(B)}
            piezas

          </span>


          <span>

            <b>
              Pespunte
              ${money(pB)}
            </b>

            · Preliminar
            ${money(rB)}

          </span>

        </div>


        <div class="tsLine">

          <span>
            <b>
              Total
            </b>
          </span>


          <span>

            <b>
              ${money(total)}
            </b>

          </span>

        </div>

      </div>


      <div class="tsCard">

        <b>
          Cerrar semana
        </b>


        <div class="tsMuted">

          El cierre guarda el total
          de lunes a sábado.

          Los registros no se borran.

        </div>


        <button
          class="tsBtn good"
          id="tsCloseWeek"
          style="margin-top:10px"
        >

          Cerrar semana y guardar histórico

        </button>

      </div>


      <div class="tsCard">

        <b>
          Histórico de cierres
        </b>


        <div id="tsHistory">
        </div>

      </div>

    `;


    document
    .getElementById(
      "tsCloseWeek"
    )
    ?.addEventListener(
      "click",
      ()=>{

        const h =
          closes();


        if(
          h.some(
            x=>
              x.week===
              start
          )
        ){

          alert(
            "Esta semana ya está cerrada."
          );

          return;

        }


        h.unshift({

          week:start,

          end:end,

          total:total,

          pespunte:
            pA+pB,

          preliminar:
            rA+rB,

          lineA:
            pA+rA,

          lineB:
            pB+rB,

          closedAt:
            new Date()
            .toISOString()

        });


        save(
          KEYW,
          h
        );


        renderRes();

      }
    );


    const h =
      closes();


    document
    .getElementById(
      "tsHistory"
    )
    .innerHTML =

      h.length

      ?

      `

      <table class="tsTable">

        <tr>

          <th>
            Semana
          </th>

          <th>
            A
          </th>

          <th>
            B
          </th>

          <th class="tsRight">
            Total
          </th>

        </tr>


        ${
          h.map(
            x=>`

              <tr>

                <td>
                  ${esc(x.week)}
                </td>

                <td>
                  ${money(x.lineA)}
                </td>

                <td>
                  ${money(x.lineB)}
                </td>

                <td class="tsRight">

                  <b>
                    ${money(x.total)}
                  </b>

                </td>

              </tr>

            `
          ).join("")
        }

      </table>

      `

      :

      `

      <div
        class="tsMuted"
        style="padding-top:8px"
      >

        No hay semanas cerradas todavía.

      </div>

      `;

  }


  function renderAll(){

    renderCap();

    renderCost();

    renderRes();

  }


  panel.style.display =
    "none";


}


/* ================================================================
   FINAL
   ================================================================ */

</script>
