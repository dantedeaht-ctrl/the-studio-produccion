try{

  /* ==============================================================

  const FIX = `

/* ==============================================================
   THE STUDIO · AJUSTES NUEVOS
   ============================================================== */


/* ==============================================================
   UTILIDADES SEGURAS
   ============================================================== */

function TSNEWReadJSON(key,fallback){

  try{

    const value =
      localStorage.getItem(key);

    if(
      value===null ||
      value===undefined ||
      value===""
    ){

      return fallback;

    }

    return JSON.parse(value);

  }catch{

    return fallback;

  }

}


function TSNEWSaveJSON(key,value){

  try{

    localStorage.setItem(
      key,
      JSON.stringify(value)
    );

  }catch{}

}


function TSNEWNum(value){

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : 0;

}


function TSNEWNormalize(value){

  return String(
    value ?? ""
  )
  .normalize("NFD")
  .replace(
    /[\\\\u0300-\\\\u036f]/g,
    ""
  )
  .trim()
  .toLowerCase();

}


function TSNEWMoney(value){

  return new Intl.NumberFormat(
    "es-MX",
    {
      style:"currency",
      currency:"MXN",
      minimumFractionDigits:2
    }
  ).format(
    TSNEWNum(value)
  );

}


function TSNEWDate(value){

  if(
    typeof localDateString ===
    "function"
  ){

    return localDateString(
      value
    );

  }

  const d =
    new Date(
      value
    );

  if(
    Number.isNaN(
      d.getTime()
    )
  ){

    return "";

  }

  return [
    d.getFullYear(),
    String(
      d.getMonth()+1
    ).padStart(2,"0"),
    String(
      d.getDate()
    ).padStart(2,"0")
  ].join("-");

}


/* ==============================================================
   COSTOS
   CONSERVA theStudioCostos_v4
   ============================================================== */

function TSNEWGetCosts(){

  const raw =
    TSNEWReadJSON(
      "theStudioCostos_v4",
      {}
    );

  const result = {};


  if(
    Array.isArray(raw)
  ){

    raw.forEach(item=>{

      if(!item)
        return;

      const model =
        String(
          item.modelo ??
          item.model ??
          item.nombre ??
          ""
        ).trim();

      if(!model)
        return;

      result[model] = {

        pes:
          TSNEWNum(
            item.pes ??
            item.pespunte ??
            item.costoPespunte
          ),

        pre:
          TSNEWNum(
            item.pre ??
            item.preliminar ??
            item.costoPreliminar
          ),

        min:
          TSNEWNum(
            item.min ??
            item.minutos ??
            item.tiempoEstandar ??
            item.tiempo ??
            item.standardTime
          )

      };

    });

    return result;

  }


  if(
    raw &&
    typeof raw==="object"
  ){

    const source =
      raw.cost &&
      typeof raw.cost==="object"
        ? raw.cost
        : raw;

    Object.keys(source)
    .forEach(model=>{

      const item =
        source[model];

      if(
        !item ||
        typeof item!=="object"
      )
        return;

      result[model] = {

        pes:
          TSNEWNum(
            item.pes ??
            item.pespunte ??
            item.costoPespunte
          ),

        pre:
          TSNEWNum(
            item.pre ??
            item.preliminar ??
            item.costoPreliminar
          ),

        min:
          TSNEWNum(
            item.min ??
            item.minutos ??
            item.tiempoEstandar ??
            item.tiempo ??
            item.standardTime
          )

      };

    });

  }

  return result;

}

/* ==============================================================
   AGREGAR LÁPIZ A CATÁLOGOS
   ============================================================== */

function TSNEWRefreshCostTables(){

  const costs =
    TSNEWGetCosts();


  document
  .querySelectorAll(
    "table"
  )
  .forEach(
    table=>{

      const rows =
        [
          ...table.querySelectorAll(
            "tr"
          )
        ];


      if(
        rows.length<2
      )
        return;


      const header =
        rows[0];


      const headerText =
        TSNEWNormalize(
          header.textContent
        );


      if(
        !headerText.includes(
          "modelo"
        ) ||
        !headerText.includes(
          "pespunte"
        ) ||
        !headerText.includes(
          "preliminar"
        )
      ){

        return;

      }


      if(
        !header.querySelector(
          ".TSNEW_EDIT_HEAD"
        )
      ){

        const th =
          document.createElement(
            "th"
          );

        th.className =
          "TSNEW_EDIT_HEAD";

        th.textContent =
          "EDITAR";

        th.style.cssText =
          `
          padding:10px;
          color:#48e7ff;
          text-align:center;
          white-space:nowrap;
          `;

        header.appendChild(
          th
        );

      }


      rows
      .slice(1)
      .forEach(
        row=>{

          if(
            row.dataset.tsnewEdit==="1"
          )
            return;


          const cells =
            [
              ...row.children
            ];


          if(!cells.length)
            return;


          const model =
            cells[0]
            ?.textContent
            ?.trim();


          if(!model)
            return;


          const clean =
            Object.keys(costs)
            .find(
              x=>
                TSNEWNormalize(x)===
                TSNEWNormalize(model)
            );


          const buttonCell =
            document.createElement(
              "td"
            );


          buttonCell.style.cssText =
            `
            padding:7px;
            text-align:center;
            `;


          const button =
            document.createElement(
              "button"
            );


          button.type =
            "button";


          button.textContent =
            "✏️";


          button.title =
            "Editar modelo";


          button.style.cssText =
            `
            min-width:42px;
            min-height:38px;
            border:0;
            border-radius:10px;
            background:#063d55!important;
            color:#48e7ff!important;
            font-size:18px;
            cursor:pointer;
            `;


          button.onclick =
            event=>{

              event.preventDefault();
              event.stopPropagation();

              TSNEWEditModel(
                clean || model
              );

            };


          buttonCell.appendChild(
            button
          );


          row.appendChild(
            buttonCell
          );


          row.dataset.tsnewEdit =
            "1";

        }
      );

    }
  );

}

/* ==============================================================
   TABLERO · DATOS DE PROGRAMACIÓN
   ============================================================== */

function TSNEWProduction(){

  const raw =
    TSNEWReadJSON(
      "theStudioProduccion_v4",
      []
    );


  if(
    Array.isArray(raw)
  )
    return raw;


  if(
    raw &&
    Array.isArray(
      raw.prod
    )
  )
    return raw.prod;


  if(
    raw &&
    Array.isArray(
      raw.produccion
    )
  )
    return raw.produccion;


  return [];

}


function TSNEWAdvances(){

  const raw =
    TSNEWReadJSON(
      "theStudioAvances_v4",
      []
    );


  if(
    Array.isArray(raw)
  )
    return raw;


  if(
    raw &&
    Array.isArray(
      raw.avances
    )
  )
    return raw.avances;


  return [];

}


function TSNEWLine(item){

  return String(
    item.linea ??
    item.line ??
    item.lineaProduccion ??
    item.lineaNombre ??
    item.Linea ??
    ""
  ).trim();

}


function TSNEWSameLine(
  item,
  line
){

  const a =
    TSNEWNormalize(
      TSNEWLine(item)
    );

  const b =
    TSNEWNormalize(
      line
    );


  if(a===b)
    return true;


  if(
    b==="linea a"
  ){

    return (
      a==="a" ||
      a==="lineaa" ||
      a==="linea  a"
    );

  }


  if(
    b==="linea b"
  ){

    return (
      a==="b" ||
      a==="lineab" ||
      a==="linea  b"
    );

  }


  return false;

}


function TSNEWDateOf(item){

  return TSNEWDate(
    item.fecha ??
    item.date ??
    item.fechaHora ??
    item.createdAt ??
    ""
  );

}


function TSNEWProgrammed(
  date,
  line
){

  return TSNEWProduction()
    .filter(
      item=>
        TSNEWDateOf(item)===date &&
        TSNEWSameLine(
          item,
          line
        )
    );

}


function TSNEWPiecesProgrammed(
  item
){

  return TSNEWNum(
    item.programado ??
    item.piezasProgramadas ??
    item.cantidad ??
    item.qty ??
    item.piezas
  );

}


function TSNEWOT(item){

  return String(
    item.ot ??
    item.OT ??
    item.numeroOT ??
    item.otNumber ??
    item.folio ??
    item.orden ??
    item.ordenTrabajo ??
    item.ordenProduccion ??
    ""
  ).trim();

}


function TSNEWProcess(
  item
){

  return TSNEWNormalize(
    item.siguienteProceso ??
    item.procesoNuevo ??
    item.procesoDestino ??
    item.destino ??
    item.hasta ??
    item.to ??
    ""
  );

}


function TSNEWIsSalidaPespunte(
  item
){

  const destination =
    TSNEWProcess(
      item
    );


  const source =
    TSNEWNormalize(
      item.procesoAnterior ??
      item.procesoOrigen ??
      item.proceso ??
      item.desde ??
      item.from ??
      ""
    );


  if(
    destination.includes(
      "salida pespunte"
    ) ||
    destination.includes(
      "salida de pespunte"
    ) ||
    destination==="salidapespunte" ||
    destination==="salidadepespunte"
  ){

    return true;

  }


  return (
    source.includes(
      "pespunte"
    ) &&
    destination.includes(
      "clasificacion"
    )
  );

}


function TSNEWSalida(
  date,
  line
){

  return TSNEWAdvances()
    .filter(
      item=>
        TSNEWDateOf(item)===date &&
        TSNEWSameLine(
          item,
          line
        ) &&
        TSNEWIsSalidaPespunte(
          item
        )
    )
    .reduce(
      (
        total,
        item
      )=>
        total+
        TSNEWNum(
          item.piezas ??
          item.cantidad ??
          item.qty ??
          item.pares
        ),
      0
    );

}

function TSNEWRenderDashboard(
  panel
){

  const date =
    typeof getReferenceDate==="function"
      ? (
          getReferenceDate() ||
          TSNEWDate(
            new Date()
          )
        )
      : TSNEWDate(
          new Date()
        );


  const lines =
    [
      "Línea A",
      "Línea B"
    ];


  const data =
    lines.map(
      line=>{

        const records =
          TSNEWProgrammed(
            date,
            line
          );


        const programmed =
          records.reduce(
            (
              total,
              item
            )=>
              total+
              TSNEWPiecesProgrammed(
                item
              ),
            0
          );


        const salida =
          TSNEWSalida(
            date,
            line
          );


        const efficiency =
          programmed>0
            ? (
                salida/
                programmed
              )*100
            : 0;


        return {

          line,
          records,
          programmed,
          salida,
          efficiency

        };

      }
    );


  const totalProgrammed =
    data[0].programmed+
    data[1].programmed;


  const totalSalida =
    data[0].salida+
    data[1].salida;


  const totalEfficiency =
    totalProgrammed>0
      ? (
          totalSalida/
          totalProgrammed
        )*100
      : 0;


  const format =
    value=>
      new Intl.NumberFormat(
        "es-MX"
      ).format(
        TSNEWNum(value)
      );


  const card =
    item=>{

      const bar =
        Math.min(
          100,
          Math.max(
            0,
            item.efficiency
          )
        );


      const otRows =
        item.records.length
          ? item.records
              .map(
                r=>`

                  <div
                    style="
                      display:grid;
                      grid-template-columns:
                        1fr auto;
                      gap:8px;
                      padding:8px 0;
                      border-bottom:
                        1px solid #104456;
                    "
                  >

    console.error(
      "The Studio nuevo ajuste:",
      e

  }

}

  TSNEWStart,
  700
);

  TSNEWStart,
  1600
);

  3000
);


/* ==============================================================

   ============================================================== */

if(
  !window.__TSNEW_OBSERVER__
){

  window.__TSNEW_OBSERVER__ =
    new MutationObserver(
      ()=>{

        try{

          TSNEWRefreshCostTables();

          TSNEWInstallTimeInput();

          TSNEWInstallDashboard();

        }catch{}

      }
    );


  setTimeout(
    ()=>{

      if(document.body){

        window.__TSNEW_OBSERVER__.observe(
          document.body,
          {
            childList:true,
            subtree:true
          }
        );

      }

    },
    1000
  );

}
