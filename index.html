<script>

(async()=>{

  try{

    const ORIGINAL_URL=
    "https://raw.githubusercontent.com/dantedeaht-ctrl/the-studio-produccion/f07dc9e5221a9b207d205d143d68c0b917ee0e0e/index.html";

    const src=
    await (await fetch(ORIGINAL_URL,{cache:"no-store"})).text();

    const m=src.match(/const b="([^"]+)"/);

    if(!m)
      throw new Error("No se encontró la versión base de The Studio");

    const a=
    Uint8Array.from(
      atob(m[1]),
      c=>c.charCodeAt(0)
    );

    const ds=
    new DecompressionStream("gzip");

    const t=
    await new Response(
      new Response(a).body.pipeThrough(ds)
    ).text();

    document.open();
    document.write(t);
    document.close();

    setTimeout(()=>{

      try{

        /*
        ============================================================
        RECUPERACIÓN Y SINCRONIZACIÓN DE COSTOS
        ============================================================
        */

        const changed=syncCostos();

        fixResponsive();

        installDestajo();

        /*
        Si encontramos costos antiguos y los recuperamos,
        recargamos una sola vez para que The Studio los muestre.
        */

        if(
          changed &&
          !sessionStorage.getItem("ts_costos_sync_reload")
        ){

          sessionStorage.setItem(
            "ts_costos_sync_reload",
            "1"
          );

          location.reload();

        }

      }catch(e){

        console.error(e);

      }

    },80);

  }catch(e){

    document.body.innerHTML=
    '<div style="font:18px system-ui;padding:30px">'+
    'Error al cargar The Studio<br>'+
    '<small>'+e+'</small>'+
    '</div>';

  }

})();

/*
====================================================================
RECUPERAR COSTOS ANTERIORES
====================================================================

Busca información que haya quedado guardada con las claves anteriores.

NO borra nada.

Si encuentra modelos que no están actualmente en
theStudioCostos_v4, los agrega.

====================================================================
*/

function syncCostos(){

  try{

    const MAIN=
    "theStudioCostos_v4";


    /*
    Claves donde pudieron haber quedado
    los costos de versiones anteriores.
    */

    const CAND=[
      "ts_costos_v1",
      "theStudioCostos_v3",
      "theStudioCostos_v2",
      "theStudioCostos_v1"
    ];


    const parse=(key)=>{

      try{

        const value=
        JSON.parse(
          localStorage.getItem(key)||"null"
        );

        return value;

      }catch{

        return null;

      }

    };


    /*
    Algunos formatos pueden guardar directamente
    el arreglo y otros dentro de costos/modelos.
    */

    const unwrap=(value)=>{

      if(Array.isArray(value))
        return value;


      if(
        value &&
        Array.isArray(value.costos)
      )
        return value.costos;


      if(
        value &&
        Array.isArray(value.modelos)
      )
        return value.modelos;


      return [];

    };


    /*
    Identificar el nombre del modelo.
    */

    const modelOf=(item)=>{

      return String(
        item?.modelo ??
        item?.model ??
        item?.nombre ??
        item?.name ??
        ""
      ).trim();

    };


    /*
    Identificar el costo.

    Si existe costo directo se usa.

    Si solamente existen pespunte + preliminar,
    se toma la suma para recuperar el costo
    total por pieza.
    */

    const costOf=(item)=>{

      const directKeys=[
        "costo",
        "cost",
        "costoPieza",
        "costo_pieza",
        "precio",
        "valor"
      ];


      for(
        const key of directKeys
      ){

        if(
          item?.[key]!==undefined &&
          item?.[key]!==null &&
          item?.[key]!==""
        ){

          return Number(item[key])||0;

        }

      }


      const pespunte=
      Number(item?.pespunte)||0;


      const preliminar=
      Number(item?.preliminar)||0;


      return pespunte+preliminar;

    };


    /*
    Juntamos las fuentes anteriores.
    */

    const sources=[];


    for(
      const key of CAND
    ){

      const array=
      unwrap(parse(key));


      if(array.length){

        sources.push(...array);

      }

    }


    /*
    Costos actualmente existentes.
    */

    const current=
    unwrap(
      parse(MAIN)
    );


    /*
    Índice por modelo.
    */

    const byModel={};


    current.forEach(item=>{

      const model=
      modelOf(item)
      .toLowerCase();


      if(model){

        byModel[model]=item;

      }

    });


    let changed=false;


    /*
    Recuperamos modelos faltantes.
    */

    for(
      const source of sources
    ){

      const model=
      modelOf(source);


      const key=
      model.toLowerCase();


      const cost=
      costOf(source);


      if(
        !key ||
        cost<=0
      )
        continue;


      /*
      Si el modelo no existe,
      lo recuperamos.
      */

      if(!byModel[key]){

        const item={
          modelo:model,
          costo:cost
        };


        /*
        Si además tenemos los valores
        de pespunte y preliminar,
        también los conservamos.
        */

        if(
          source.pespunte!==undefined
        ){

          item.pespunte=
          Number(source.pespunte)||0;

        }


        if(
          source.preliminar!==undefined
        ){

          item.preliminar=
          Number(source.preliminar)||0;

        }


        current.push(item);

        byModel[key]=item;

        changed=true;

      }

      /*
      Si existe pero tiene costo 0,
      recuperamos el costo antiguo.
      */

      else if(
        costOf(byModel[key])<=0 &&
        cost>0
      ){

        byModel[key].costo=
        cost;

        changed=true;

      }

    }


    /*
    Guardamos solamente si hubo cambios.
    */

    if(changed){

      localStorage.setItem(
        MAIN,
        JSON.stringify(current)
      );

    }


    return changed;


  }catch(e){

    console.error(
      "No se pudieron sincronizar los costos",
      e
    );

    return false;

  }

}

  const read=(key,defaultValue)=>{

        localStorage.getItem(key)||
        JSON.stringify(defaultValue)

  };

      date+"T12:00:00"

    const day=
    x.getDay();


    const diff=
    day===0
    ?-6

    x.setDate(
      x.getDate()+diff

    return x
    .toISOString()
    .slice(0,10);

        );


        const pairs=
        Number(
          document
          .getElementById("tsPairs")
          .value
        )||0;


        if(
          !model ||
          pairs<=0
        ){

          return alert(
            "Selecciona un modelo y captura los pares salidos."
          );

        }


        const r=
        records();


        r.push({

          id:Date.now(),

          date:
          document
          .getElementById("tsDate")
          .value,

          line:
          document
          .getElementById("tsLine")
          .value,

          modelo:
          model.modelo,

          pares:pairs,

          pespunte:
          Number(model.pespunte)||0,

          preliminar:
          Number(model.preliminar)||0

        });


        save(
          KEYR,
          r
        );


        renderAll();

      }
    );


    document
    .getElementById("tsClear")
    ?.addEventListener(
      "click",
      ()=>{

        document
        .getElementById("tsPairs")
        .value="";

        update();

      }
    );


    const rr=
    records()
    .slice(-12)
    .reverse();


    document
    .getElementById("tsRecent")
    .innerHTML=

    rr.length

    ?

    `

    <table class="tsTable">

      <tr>

        <th>
        Fecha
        </th>

        <th>
        Línea
        </th>

        <th>
        Modelo
        </th>

        <th class="tsRight">
        Pares
        </th>

        <th class="tsRight">
        Destajo
        </th>

      </tr>


      ${
        rr
        .map(r=>`

        <tr>

          <td>
          ${r.date}
          </td>

          <td>
          ${esc(
            r.line.replace(
              "Línea ",
              ""
            )
          )}
          </td>

          <td>
          ${esc(r.modelo)}
          </td>

          <td class="tsRight">
          ${r.pares}
          </td>

          <td class="tsRight">

          ${
            money(
              r.pares*
              (
                r.pespunte+
                r.preliminar
              )
            )
          }

          </td>

        </tr>

        `)
        .join("")
      }

    </table>

    `

    :

    `

    <div
    class="tsMuted"
    style="padding:10px 0"
    >

    Aún no hay registros.

    </div>

    `;

  }


  /*
  ================================================================
  COSTOS
  ================================================================
  */

  function renderCost(){

    const c=
    costs();


    document
    .getElementById("tsCost")
    .innerHTML=

    `

    <div class="tsCard">

      <b>
      Catálogo de costos
      </b>


      <div class="tsMuted">

      Captura una vez el costo
      por modelo; al registrar
      salida se toma automáticamente.

      </div>


      <div
      class="tsGrid3"
      style="margin-top:10px"
      >


        <div class="tsField">

          <label>
          Modelo
          </label>

          <input
          id="tsNewM"
          placeholder="Verona"
          >

        </div>


        <div class="tsField">

          <label>
          Costo pespunte $
          </label>

          <input
          id="tsNewP"
          type="number"
          min="0"
          step="0.01"
          placeholder="12"
          >

        </div>


        <div class="tsField">

          <label>
          Costo preliminar $
          </label>

          <input
          id="tsNewR"
          type="number"
          min="0"
          step="0.01"
          placeholder="8"
          >

        </div>


      </div>


      <button
      class="tsBtn"
      id="tsSaveC"
      style="margin-top:10px"
      >

      Guardar / actualizar modelo

      </button>


    </div>


    <div class="tsCard">

    ${
      c.length

      ?

      `

      <table class="tsTable">

        <tr>

          <th>
          Modelo
          </th>

          <th class="tsRight">
          Pespunte
          </th>

          <th class="tsRight">
          Preliminar
          </th>

          <th>
          </th>

        </tr>


        ${
          c
          .map((x,i)=>`

          <tr>

            <td>
            ${esc(x.modelo)}
            </td>

            <td class="tsRight">
            ${money(x.pespunte)}
            </td>

            <td class="tsRight">
            ${money(x.preliminar)}
            </td>

            <td class="tsRight">

              <button
              class="tsBtn alt"
              data-del="${i}"
              >
              ×
              </button>

            </td>

          </tr>

          `)
          .join("")
        }

      </table>

      `

      :

      `

      <div class="tsMuted">

      No hay modelos capturados.

      </div>

      `

    }

    </div>

    `;


    document
    .getElementById("tsSaveC")
    ?.addEventListener(
      "click",
      ()=>{

        const m=
        document
        .getElementById("tsNewM")
        .value
        .trim();


        if(!m){

          return alert(
            "Escribe el modelo."
          );

        }


        const p=
        Number(
          document
          .getElementById("tsNewP")
          .value
        )||0;


        const r=
        Number(
          document
          .getElementById("tsNewR")
          .value
        )||0;


        const arr=
        costs();


        const i=
        arr.findIndex(
          x=>
          x.modelo
          .toLowerCase()===
          m.toLowerCase()
        );


        const item={

          modelo:m,

          pespunte:p,

          preliminar:r

        };


        if(i>=0){

          arr[i]=item;

        }else{

          arr.push(item);

        }


        save(
          KEYC,
          arr
        );


        renderAll();

      }
    );


    document
    .querySelectorAll(
      "[data-del]"
    )
    .forEach(
      button=>{

        button.onclick=()=>{

          const arr=
          costs();


          arr.splice(
            Number(
              button.dataset.del
            ),
            1
          );


          save(
            KEYC,
            arr
          );


          renderAll();

        };

      }
    );

  }


  /*
  ================================================================
  RESUMEN SEMANAL
  ================================================================
  */

  function renderRes(){

    const start=
    mondayOf(
      today()
    );


    const end=
    addDays(
      start,
      5
    );


    const rr=
    records()
    .filter(
      r=>
      r.date>=start &&
      r.date<=end
    );


    const sum=
    arr=>
    arr.reduce(
      (a,r)=>
      a+r.pares,
      0
    );


    const calc=
    (arr,key)=>
    arr.reduce(
      (a,r)=>
      a+
      r.pares*
      (r[key]||0),
      0
    );


    const A=
    rr.filter(
      r=>
      r.line===
      "Línea A"
    );


    const B=
    rr.filter(
      r=>
      r.line===
      "Línea B"
    );


    const pA=
    calc(
      A,
      "pespunte"
    );


    const pB=
    calc(
      B,
      "pespunte"
    );


    const rA=
    calc(
      A,
      "preliminar"
    );


    const rB=
    calc(
      B,
      "preliminar"
    );


    const total=
    pA+pB+rA+rB;


    document
    .getElementById("tsRes")
    .innerHTML=

    `

    <div class="tsCard">

      <b>
      Semana de nómina
      </b>


      <div class="tsMuted">

      ${start}
      →
      ${end}

      · cierre el sábado

      </div>


      <div
      class="tsKpis"
      style="margin-top:10px"
      >


        <div class="tsKpi">

          <small>
          Línea A · destajo
          </small>

          <div class="tsMoney">

          ${money(
            pA+rA
          )}

          </div>

        </div>


        <div class="tsKpi">

          <small>
          Línea B · destajo
          </small>

          <div class="tsMoney">

          ${money(
            pB+rB
          )}

          </div>

        </div>


        <div class="tsKpi">

          <small>
          Acumulado semanal
          </small>

          <div class="tsMoney">

          ${money(
            total
          )}

          </div>

        </div>


      </div>

    </div>


    <div class="tsCard">

      <b>
      Desglose por línea
      </b>


      <div class="tsLine">

        <span>

        Línea A ·
        ${sum(A)}
        pares

        </span>


        <span>

        <b>
        Pespunte
        ${money(pA)}
        </b>

        · Preliminar
        ${money(rA)}

        </span>

      </div>


      <div class="tsLine">

        <span>

        Línea B ·
        ${sum(B)}
        pares

        </span>


        <span>

        <b>
        Pespunte
        ${money(pB)}
        </b>

        · Preliminar
        ${money(rB)}

        </span>

      </div>


      <div class="tsLine">

        <span>
        <b>
        Total
        </b>
        </span>


        <span>

        <b>
        ${money(total)}
        </b>

        </span>

      </div>

    </div>


    <div class="tsCard">

      <b>
      Cerrar semana
      </b>


      <div class="tsMuted">

      El cierre guarda el total
      de lunes a sábado en el histórico.

      Los registros no se borran.

      </div>


      <button
      class="tsBtn good"
      id="tsCloseWeek"
      style="margin-top:10px"
      >

      Cerrar semana y guardar histórico

      </button>

    </div>


    <div class="tsCard">

      <b>
      Histórico de cierres
      </b>


      <div id="tsHistory">
      </div>

    </div>

    `;


    document
    .getElementById(
      "tsCloseWeek"
    )
    ?.addEventListener(
      "click",
      ()=>{

        const h=
        closes();


        if(
          h.some(
            x=>
            x.week===
            start
          )
        ){

          alert(
            "Esta semana ya está cerrada."
          );

          return;

        }


        h.unshift({

          week:start,

          end:end,

          total:total,

          pespunte:
          pA+pB,

          preliminar:
          rA+rB,

          lineA:
          pA+rA,

          lineB:
          pB+rB,

          closedAt:
          new Date()
          .toISOString()

        });


        save(
          KEYW,
          h
        );


        renderRes();

      }
    );


    const h=
    closes();


    document
    .getElementById(
      "tsHistory"
    )
    .innerHTML=

    h.length

    ?

    `

    <table class="tsTable">

      <tr>

        <th>
        Semana
        </th>

        <th>
        A
        </th>

        <th>
        B
        </th>

        <th class="tsRight">
        Total
        </th>

      </tr>


      ${
        h
        .map(x=>`

        <tr>

          <td>
          ${x.week}
          </td>

          <td>
          ${money(x.lineA)}
          </td>

          <td>
          ${money(x.lineB)}
          </td>

          <td class="tsRight">

            <b>
            ${money(x.total)}
            </b>

          </td>

        </tr>

        `)
        .join("")
      }

    </table>

    `

    :

    `

    <div
    class="tsMuted"
    style="padding-top:8px"
    >

    No hay semanas cerradas todavía.

    </div>

    `;

  }


  function renderAll(){

    renderCap();

    renderCost();

    renderRes();

  }


  panel.style.display="none";

}

</script>
