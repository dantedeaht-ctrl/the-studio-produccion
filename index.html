    "https://raw.githubusercontent.com/dantedeaht-ctrl/the-studio-produccion/f07dc9e5221a9b207d205d143d68c0b917ee0e0e/index.html";

  const response = await fetch(
    ORIGINAL_URL,
    {cache:"no-store"}
  );

  const src = await response.text();

  const m = src.match(/const b="([^"]+)"/);

  if(!m){
    throw new Error(
      "No se encontró la versión base de The Studio"
    );
  }

  const a = Uint8Array.from(
    atob(m[1]),
    c=>c.charCodeAt(0)
  );

  const ds = new DecompressionStream("gzip");

  const t = await new Response(
    new Response(a)
      .body
      .pipeThrough(ds)
  ).text();

  document.open();
  document.write(t);
  document.close();

  setTimeout(()=>{

    try{

      migrateAllCosts();

      fixResponsive();

      installBMWTheme();

      installJARVISTheme();

      installCostRepair();

      installWeekRepair();

      installDestajo();

      installLineEfficiency();

      replacePairsText();

      refreshStudio();

      if(!window.__TS_OBSERVER__){

        window.__TS_OBSERVER__ =
          new MutationObserver(()=>{

            replacePairsText();
            refreshStudio();
            installLineEfficiency();

          });

        window.__TS_OBSERVER__.observe(
          document.body,
          {
            childList:true,
            subtree:true
          }
        );
      }

    }catch(e){

      console.error(
        "The Studio patch:",
        e
      );

    }

  },250);

}catch(e){

  document.body.innerHTML =
    '<div style="font:18px system-ui;padding:30px">'+
    'Error al cargar The Studio<br>'+
    '<small>'+
    String(e)+
    '</small>'+
    '</div>';

}

})();


/* ================================================================
   UTILIDADES
   ================================================================ */

function readJSON(key,fallback){

  try{

    const value =
      localStorage.getItem(key);

    if(
      value===null ||
      value===undefined ||
      value===""
    ){

      return fallback;

    }

    return JSON.parse(value);

  }catch{

    return fallback;

  }

}


function saveJSON(key,value){

  localStorage.setItem(
    key,
    JSON.stringify(value)
  );

}


function num(value){

  const n=Number(value);

  return Number.isFinite(n)
    ? n
    : 0;

}


function money(value){

  return new Intl.NumberFormat(
    "es-MX",
    {
      style:"currency",
      currency:"MXN",
      minimumFractionDigits:2
    }
  ).format(num(value));

}


function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      m=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[m])
    );

}


function normalize(value){

  return String(value ?? "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .trim()
    .toLowerCase();

}


/* ================================================================
   FECHAS
   ================================================================ */

function localDateString(date){

  const d =
    date instanceof Date
      ? new Date(date)
      : new Date(String(date)+"T12:00:00");

  if(Number.isNaN(d.getTime()))
    return "";

  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");

}


function todayLocal(){

  return localDateString(new Date());

}


function mondayOf(date){

  const d =
    new Date(String(date)+"T12:00:00");

  if(Number.isNaN(d.getTime()))
    return todayLocal();

  const day=d.getDay();

  const diff =
    day===0
      ? -6
      : 1-day;

  d.setDate(d.getDate()+diff);

  return localDateString(d);

}


function addDays(date,n){

  const d =
    new Date(String(date)+"T12:00:00");

  d.setDate(d.getDate()+n);

  return localDateString(d);

}


function weekRange(reference){

  const start=mondayOf(reference);

  return {
    start:start,
    end:addDays(start,5)
  };

}


function inWeek(date,reference){

  const d=localDateString(date);

  const r=weekRange(reference);

  return d>=r.start && d<=r.end;

}


/* ================================================================
   PRODUCCIÓN
   ================================================================ */

function getProduction(){

  const raw =
    readJSON(
      "theStudioProduccion_v4",
      []
    );

  if(Array.isArray(raw))
    return raw;

  if(raw && Array.isArray(raw.prod))
    return raw.prod;

  if(raw && Array.isArray(raw.produccion))
    return raw.produccion;

  return [];

}


/* ================================================================
   AVANCES
   ================================================================ */

function getAdvances(){

  const raw =
    readJSON(

      []

  if(Array.isArray(raw))
    return raw;

  if(raw && Array.isArray(raw.avances))
    return raw.avances;

  return [];

}


/* ================================================================
   COSTOS
   ================================================================ */

function normalizeCostObject(raw){

  const result={};

  if(
    raw &&
    !Array.isArray(raw) &&
    typeof raw==="object" &&
    raw.cost &&
    typeof raw.cost==="object"
  ){

    raw=raw.cost;

  }

  if(
    raw &&
    !Array.isArray(raw) &&
    typeof raw==="object"
  ){

    Object.keys(raw).forEach(model=>{

      const item=raw[model];

      if(
        item &&
        typeof item==="object"
      ){

        result[model]={

          pes:num(
            item.pes ??
            item.pespunte ??
            item.pesPunte ??
            item.costoPespunte
          ),

          pre:num(
            item.pre ??
            item.preliminar ??
            item.costoPreliminar
          ),

          min:num(
            item.min ??
            item.minutos ??
            item.tiempoStandard ??
            item.tiempoEstandar
          )

        };

      }else{

        result[model]={
          pes:num(item),
          pre:0,
          min:0
        };

      }

    });

    return result;

  }


  if(Array.isArray(raw)){

    raw.forEach(item=>{

      if(!item)
        return;

      const model=
        String(
          item.modelo ??
          item.model ??
          item.nombre ??
          item.name ??
          ""
        ).trim();

      if(!model)
        return;

      result[model]={

        pes:num(
          item.pes ??
          item.pespunte ??
          item.pesPunte ??
          item.costoPespunte
        ),

        pre:num(
          item.pre ??
          item.preliminar ??
          item.costoPreliminar
        ),

        min:num(
          item.min ??
          item.minutos ??
          item.tiempoStandard ??
          item.tiempoEstandar
        )

      };

    });

  }

  return result;

}


/* ================================================================
   RECUPERACIÓN DE COSTOS
   ================================================================ */

function migrateAllCosts(){

  try{

    const MAIN=
      "theStudioCostos_v4";

    let main=
      normalizeCostObject(
        readJSON(MAIN,{})
      );

    const OLD_KEYS=[

      "ts_costos_v1",
      "theStudioCostos_v1",
      "theStudioCostos_v2",
      "theStudioCostos_v3",
      "theStudioCostos",
      "costos",
      "modelos",
      "catalogoModelos",
      "catalogoCostos"

    ];


    function mergeModel(model,incoming){

      const cleanModel=
        String(model ?? "").trim();

      if(!cleanModel)
        return;

      const existingName=
        Object.keys(main).find(
          x=>
            normalize(x)===
            normalize(cleanModel)
        );

      const name=
        existingName ||
        cleanModel;

      if(!main[name]){

        main[name]={

          pes:num(incoming?.pes),
          pre:num(incoming?.pre),
          min:num(incoming?.min)

        };

        return;

      }

      if(
        !num(main[name].pes) &&
        num(incoming?.pes)
      ){

        main[name].pes=
          num(incoming.pes);

      }

      if(
        !num(main[name].pre) &&
        num(incoming?.pre)
      ){

        main[name].pre=
          num(incoming.pre);

      }

      if(
        !num(main[name].min) &&
        num(incoming?.min)
      ){

        main[name].min=
          num(incoming.min);

      }

    }


    function extractItem(item){

      if(
        !item ||
        typeof item!=="object"
      )
        return null;

      const model=
        String(
          item.modelo ??
          item.model ??
          item.nombre ??
          item.name ??
          ""
        ).trim();

      if(!model)
        return null;

      return {

        model:model,

        pes:num(
          item.pes ??
          item.pespunte ??
          item.pesPunte ??
          item.costoPespunte ??
          item.costo_pespunte ??
          item.precioPespunte ??
          item.precio_pespunte
        ),

        pre:num(
          item.pre ??
          item.preliminar ??
          item.costoPreliminar ??
          item.costo_preliminar ??
          item.precioPreliminar ??
          item.precio_preliminar
        ),

        min:num(
          item.min ??
          item.minutos ??
          item.tiempoStandard ??
          item.tiempoEstandar
        )

      };

    }


    function readCostSource(raw){

      if(!raw)
        return;

      if(Array.isArray(raw)){

        raw.forEach(item=>{

          const found=
            extractItem(item);

          if(found){

            mergeModel(
              found.model,
              found
            );

          }

        });

        return;

      }

      if(
        typeof raw!=="object"
      )
        return;


      [
        raw.costos,
        raw.modelos,
        raw.cost,
        raw.catalogo,
        raw.data
      ].forEach(source=>{

        if(
          source &&
          source!==raw
        ){

          readCostSource(source);

        }

      });


      Object.keys(raw).forEach(key=>{

        if([
          "costos",
          "modelos",
          "cost",
          "catalogo",
          "data"
        ].includes(key))
          return;

        const value=raw[key];

        if(
          !value ||
          typeof value!=="object" ||
          Array.isArray(value)
        )
          return;

        mergeModel(
          key,
          {
            pes:num(
              value.pes ??
              value.pespunte ??
              value.pesPunte ??
              value.costoPespunte
            ),

            pre:num(
              value.pre ??
              value.preliminar ??
              value.costoPreliminar
            ),

            min:num(
              value.min ??
              value.minutos ??
              value.tiempoStandard ??
              value.tiempoEstandar
            )
          }
        );

      });

    }


    OLD_KEYS.forEach(key=>{

      readCostSource(
        readJSON(key,null)
      );

    });


    for(
      let i=0;
      i<localStorage.length;
      i++
    ){

      const key=
        localStorage.key(i);

      if(!key)
        continue;

      if(
        OLD_KEYS.includes(key) ||
        key===MAIN
      )
        continue;

      let raw=null;

      try{

        raw=
          JSON.parse(
            localStorage.getItem(key)
          );

      }catch{

        continue;

      }

      if(Array.isArray(raw)){

        const possible=
          raw.some(item=>{

            if(
              !item ||
              typeof item!=="object"
            )
              return false;

            return (
              (
                item.modelo!==undefined ||
                item.model!==undefined ||
                item.nombre!==undefined ||
                item.name!==undefined
              ) &&
              (
                item.pes!==undefined ||
                item.pespunte!==undefined ||
                item.costoPespunte!==undefined ||
                item.pre!==undefined ||
                item.preliminar!==undefined ||
                item.costoPreliminar!==undefined ||
                item.min!==undefined ||
                item.minutos!==undefined
              )
            );

          });

        if(possible)
          readCostSource(raw);

      }else if(
        raw &&
        typeof raw==="object"
      ){

        const text=
          JSON.stringify(raw).toLowerCase();

        if(
          text.includes("pespunte") ||
          text.includes("preliminar") ||
          text.includes("tiempo") ||
          text.includes("minutos")
        ){

          readCostSource(raw);

        }

      }

    }


    saveJSON(
      MAIN,
      main
    );


    saveJSON(
      "ts_costos_v1",
      Object.keys(main).map(model=>({

        modelo:model,

        pespunte:
          num(main[model].pes),

        preliminar:
          num(main[model].pre),

        min:
          num(main[model].min)

      }))
    );


    return main;

  }catch(e){

    console.error(
      "Error recuperando costos:",
      e
    );

    return normalizeCostObject(
      readJSON(
        "theStudioCostos_v4",
        {}
      )
    );

  }

}

function replacePairsText(){

  const nodes=
    document.querySelectorAll(
      "body *"
    );

  nodes.forEach(el=>{

    if(el.children.length)
      return;

    const original=
      el.textContent || "";

    const n=
      normalize(original);

    if(
      n==="pares salidos" ||
      n==="pares salido" ||
      n==="pares salidas"
    ){

      el.textContent=
        "Piezas Terminadas";

    }

/* ================================================================
   REFERENCIA DE FECHA
   ================================================================ */

function getReferenceDate(){

  const inputs=[
    ...document.querySelectorAll(
      'input[type="date"]'
    )
  ];

  for(const input of inputs){

    const text=
      normalize(
        input.parentElement?.textContent
      );

    if(
      text.includes(
        "fecha de referencia"
      ) &&
      input.value
    ){

      return input.value;

    }

  }

  for(const input of inputs){

    if(
      input.closest("#tsDestajo")
    )
      continue;

    if(
      input.offsetParent!==null &&
      input.value
    ){

      return input.value;

    }

  }

  return todayLocal();

}


/* ================================================================
   DATOS SEMANALES
   ================================================================ */

function calculateWeek(reference){

  const prod=getProduction();
  const advances=getAdvances();
  const range=weekRange(reference);

  const programmed=
    prod.filter(
      item=>
        inWeek(
          item.fecha,
          reference
        )
    );

  const programado=
    programmed.reduce(
      (total,item)=>
        total+
        num(item.programado),
      0
    );

  const empaqueRecords=
    advances.filter(item=>{

      const date=
        item.fecha ??
        item.fechaHora;

      if(!inWeek(date,reference))
        return false;

      return normalize(
        item.siguienteProceso ??
        item.procesoNuevo ??
        item.procesoDestino ??
        item.destino ??
        ""
      )==="empaque";

    });

  const empaque=
    empaqueRecords.reduce(
      (total,item)=>
        total+
        num(
          item.piezas ??
          item.cantidad ??
          item.qty
        ),
      0
    );

  const auditoriaRecords=
    advances.filter(item=>{

      const date=
        item.fecha ??
        item.fechaHora;

      if(!inWeek(date,reference))
        return false;

      return normalize(
        item.siguienteProceso ??
        item.procesoNuevo ??
        item.procesoDestino ??
        item.destino ??
        ""
      )==="auditoria";

    });

  const auditoria=
    auditoriaRecords.reduce(
      (total,item)=>
        total+
        num(
          item.piezas ??
          item.cantidad ??
          item.qty
        ),
      0
    );

  const ots=new Set();

  empaqueRecords.forEach(item=>{

    if(
      item.ot!==undefined &&
      item.ot!==null &&
      String(item.ot).trim()
    ){

      ots.add(
        String(item.ot).trim()
      );

    }

  });

  return {

    start:range.start,
    end:range.end,
    programado,
    empaque,
    auditoria,
    otsEmpaque:ots.size,
    programmedRecords:programmed,
    empaqueRecords,
    auditoriaRecords

  };

}


/* ================================================================
   DASHBOARD
   ================================================================ */

function setDashboardMetric(label,value){

  const target=
    normalize(label);

  const leaves=
    [
      ...document.querySelectorAll(
        "body *"
      )
    ].filter(
      el=>
        el.children.length===0 &&
        normalize(el.textContent)===target &&
        el.offsetParent!==null
    );

  for(const labelEl of leaves){

    let box=labelEl.parentElement;

    for(
      let level=0;
      level<5 && box;
      level++,
      box=box.parentElement
    ){

      const candidates=
        [
          ...box.querySelectorAll(
            "strong,b,h1,h2,h3,h4,h5,.value,.number,.num,.stat-value"
          )
        ]
        .filter(
          el=>
            el!==labelEl &&
            el.offsetParent!==null &&
            /\d/.test(el.textContent)
        );

      if(candidates.length){

        candidates.sort(
          (a,b)=>
            a.textContent.length-
            b.textContent.length
        );

        candidates[0].textContent=
          new Intl.NumberFormat(
            "es-MX"
          ).format(value);

        return true;

      }

    }

  }

  return false;

}


function refreshStudio(){

  try{

    const reference=
      getReferenceDate();

    const data=
      calculateWeek(reference);

    setDashboardMetric(
      "Programado",
      data.programado
    );

    setDashboardMetric(
      "Empaque para nómina",
      data.empaque
    );

    setDashboardMetric(
      "Auditoría",
      data.auditoria
    );

    setDashboardMetric(
      "OTs con Empaque",
      data.otsEmpaque
    );

    installWeekListeners();

    installCostRepair();

  }catch(e){

    console.error(
      "refreshStudio:",
      e
    );

  }

}

/* ================================================================
   EFICIENCIA POR LÍNEA
   ================================================================ */

function getLine(item){

  return String(
    item?.linea ??
    item?.line ??
    item?.lineaProduccion ??
    item?.lineaProducción ??
    item?.lineaNombre ??
    item?.lineName ??
    ""
  ).trim();

}


function getOT(item){

  return String(
    item?.ot ??
    item?.OT ??
    item?.ordenTrabajo ??
    item?.orden ??
    ""
  ).trim();

}


function getModel(item){

  return String(
    item?.modelo ??
    item?.model ??
    ""
  ).trim();

}


function getPieces(item){

  return num(
    item?.programado ??
    item?.piezas ??
    item?.cantidad ??
    item?.qty ??
    0
  );

}


function advancePieces(item){

  return num(
    item?.piezas ??
    item?.cantidad ??
    item?.qty ??
    0
  );

}


function advanceDate(item){

  return localDateString(
    item?.fecha ??
    item?.fechaHora ??
    ""
  );

}


function isSalidaPespunte(item){

  const destination=
    normalize(
      item?.siguienteProceso ??
      item?.procesoNuevo ??
      item?.procesoDestino ??
      item?.destino ??
      ""
    );

  return (
    destination==="salida pespunte" ||
    (
      destination.includes("salida") &&
      destination.includes("pespunte")
    )
  );

}


function lineForAdvance(item,productionMap){

  const direct=
    getLine(item);

  if(direct)
    return direct;

  const ot=
    getOT(item);

  if(
    ot &&
    productionMap[ot]
  ){

    return productionMap[ot];

  }

  return "";

}


function lineEfficiencyData(line,date){

  const prod=
    getProduction();

  const advances=
    getAdvances();

  const productionMap={};

  prod.forEach(item=>{

    const ot=getOT(item);
    const itemDate=
      localDateString(item.fecha);

    if(
      ot &&
      itemDate===date
    ){

      productionMap[ot]=
        getLine(item);

    }

  });


  const programmedRecords=
    prod.filter(item=>{

      return (
        localDateString(item.fecha)===date &&
        normalize(
          getLine(item)
        )===
        normalize(line)
      );

    });


  const programmed=
    programmedRecords.reduce(
      (sum,item)=>
        sum+
        getPieces(item),
      0
    );


  const salidaRecords=
    advances.filter(item=>{

      if(
        advanceDate(item)!==date
      )
        return false;

      if(
        !isSalidaPespunte(item)
      )
        return false;

      const l=
        lineForAdvance(
          item,
          productionMap
        );

      return (
        normalize(l)===
        normalize(line)
      );

    });


  const salida=
    salidaRecords.reduce(
      (sum,item)=>
        sum+
        advancePieces(item),
      0
    );


  const efficiency=
    programmed>0
      ? salida/programmed*100
      : 0;


  return {

    programmed,
    salida,
    efficiency

  };

}

        </div>

      `;

    );

    );

        B.efficiency.toFixed(1)+"%";

    }


  }catch(e){

      "Eficiencia línea:",
      e
    );

    .getElementById("tsRes")
    .innerHTML=`

      <div class="tsCard">

        <b>
          Semana de nómina
        </b>

        <div class="tsMuted">

          ${start}
          →
          ${end}

          · cierre el sábado

        </div>


        <div
          class="tsKpis"
          style="margin-top:10px"
        >

          <div class="tsKpi">

            <small>
              Línea A · destajo
            </small>

            <div class="tsMoney">
              ${money(pA+rA)}
            </div>

          </div>


          <div class="tsKpi">

            <small>
              Línea B · destajo
            </small>

            <div class="tsMoney">
              ${money(pB+rB)}
            </div>

          </div>


          <div class="tsKpi">

            <small>
              Acumulado semanal
            </small>

            <div class="tsMoney">
              ${money(total)}
            </div>

          </div>

        </div>

      </div>


      <div class="tsCard">

        <b>
          Desglose por línea
        </b>


        <div class="tsLine">

          <span>

            Línea A ·
            ${sum(A)}
            piezas

          </span>


          <span>

            <b>
              Pespunte
              ${money(pA)}
            </b>

            · Preliminar
            ${money(rA)}

          </span>

        </div>


        <div class="tsLine">

          <span>

            Línea B ·
            ${sum(B)}
            piezas

          </span>


          <span>

            <b>
              Pespunte
              ${money(pB)}
            </b>

            · Preliminar
            ${money(rB)}

          </span>

        </div>


        <div class="tsLine">

          <span>
            <b>Total</b>
          </span>

          <span>
            <b>${money(total)}</b>
          </span>

        </div>

      </div>


      <div class="tsCard">

        <b>
          Cerrar semana
        </b>

        <div class="tsMuted">

          El cierre guarda el total
          de lunes a sábado.
          Los registros no se borran.

        </div>


        <button
          class="tsBtn good"
          id="tsCloseWeek"
          style="margin-top:10px"
        >

          Cerrar semana y guardar histórico

        </button>

      </div>


      <div class="tsCard">

        <b>
          Histórico de cierres
        </b>

        <div id="tsHistory"></div>

      </div>

    `;


    document
    .getElementById(
      "tsCloseWeek"
    )
    ?.addEventListener(
      "click",
      ()=>{

        const h=
          closes();

        if(
          h.some(
            x=>
              x.week===start
          )
        ){

          alert(
            "Esta semana ya está cerrada."
          );

          return;

        }


        h.unshift({

          week:start,

          end:end,

          total:total,

          pespunte:
            pA+pB,

          preliminar:
            rA+rB,

          lineA:
            pA+rA,

          lineB:
            pB+rB,

          closedAt:
            new Date()
            .toISOString()

        });


        saveJSON(
          KEYW,
          h
        );

        renderRes();

      }
    );


    const h=
      closes();


    document
    .getElementById(
      "tsHistory"
    )
    .innerHTML=
      h.length

      ?

      `

      <table class="tsTable">

        <tr>

          <th>Semana</th>
          <th>A</th>
          <th>B</th>

          <th class="tsRight">
            Total
          </th>

        </tr>


        ${
          h.map(x=>`

            <tr>

              <td>
                ${esc(x.week)}
              </td>

              <td>
                ${money(x.lineA)}
              </td>

              <td>
                ${money(x.lineB)}
              </td>

              <td class="tsRight">

                <b>
                  ${money(x.total)}
                </b>

              </td>

            </tr>

          `).join("")
        }

      </table>

      `

      :

      `

      <div
        class="tsMuted"
        style="padding-top:8px"
      >

        No hay semanas cerradas todavía.

      </div>

      `;

  }


  function renderAll(){

    renderCap();

    renderCost();

    renderRes();

    replacePairsText();

  }


  panel.style.display="none";

}


/* ================================================================
   FIN
   ================================================================ */

</script>
